// ======================================================
// HAND ANALYSIS
// ======================================================
function canFormMelds(tiles,n){
  if(tiles.length!==n*3) return false;
  if(n===0) return true;
  const s=sortTiles(tiles), f=s[0];
  if(countTile(s,f)>=3){const r=removeTiles(s,[f,f,f]);if(r&&canFormMelds(r,n-1))return true;}
  if(f.suit!=='z'&&f.num<=7){
    const f2={suit:f.suit,num:f.num+1},f3={suit:f.suit,num:f.num+2};
    const r=removeTiles(s,[f,f2,f3]);if(r&&canFormMelds(r,n-1))return true;
  }
  return false;
}

function allTileTypes(){
  const out=[];
  for(const suit of ['m','p','s']) for(let num=1;num<=9;num++) out.push({suit,num});
  for(let i=0;i<4;i++) out.push({suit:'z',num:5});
  return out;
}

function meldDecompositions(tiles){
  if(tiles.length===0) return [[]];
  const s=sortTiles(tiles), f=s[0], out=[];
  if(countTile(s,f)>=3){
    const r=removeTiles(s,[f,f,f]);
    if(r) for(const rest of meldDecompositions(r)) out.push([[f,f,f],...rest]);
  }
  if(f.suit!=='z'&&f.num<=7){
    const f2={suit:f.suit,num:f.num+1}, f3={suit:f.suit,num:f.num+2};
    const r=removeTiles(s,[f,f2,f3]);
    if(r) for(const rest of meldDecompositions(r)) out.push([[f,f2,f3],...rest]);
  }
  return out;
}

function winningDecompositions(fullHand){
  if(fullHand.length%3!==2) return [];
  const s=sortTiles(fullHand), out=[];
  for(const pair of uniq(s)){
    if(countTile(s,pair)<2) continue;
    const rest=removeTiles(s,[pair,pair]);
    if(!rest) continue;
    for(const melds of meldDecompositions(rest)){
      out.push({pair:[pair,pair],melds});
    }
  }
  return out;
}

function waitTypesForWin(hand, winTile){
  const types=new Set();
  const full=sortTiles([...hand,winTile]);
  for(const d of winningDecompositions(full)){
    if(d.pair.some(t=>tileEq(t,winTile))) types.add('tanki');
    for(const group of d.melds){
      if(!group.some(t=>tileEq(t,winTile))) continue;
      if(isTriplet(group)) types.add('shanpon');
      else if(isSeq(group)){
        const seq=sortTiles(group);
        types.add(tileEq(seq[1],winTile)?'katan':'side');
      }
    }
  }
  return types;
}

function isPureKatanWin(hand, winTile){
  const types=waitTypesForWin(hand,winTile);
  return types.size===1&&types.has('katan');
}

function standardWaits(hand){
  if(hand.length<4||(hand.length-1)%3!==0) return [];
  return allTileTypes().filter(t=>countTile(hand,t)<4&&winningDecompositions([...hand,t]).length>0);
}

function getKatanWaits(hand){
  const n=hand.length;
  if(n<4||(n-4)%3!==0) return [];
  const waits=standardWaits(hand);
  const katan=waits.filter(w=>isPureKatanWin(hand,w));
  // 扣聴は「嵌張だけで上がれる」形に限定する。单钓/双碰/辺張/両面が混ざる形は不可。
  if(katan.length!==waits.length) return [];
  return katan;
}

function isTriplet(tiles){return tiles.length===3&&tileEq(tiles[0],tiles[1])&&tileEq(tiles[1],tiles[2]);}
function isSeq(tiles){
  if(tiles.length!==3) return false;
  const s=sortTiles(tiles);
  return s[0].suit===s[1].suit&&s[1].suit===s[2].suit&&s[0].suit!=='z'&&
    s[1].num===s[0].num+1&&s[2].num===s[1].num+1;
}

function hasTriplInDecomp(tiles,n){
  if(n===0) return false;
  const s=sortTiles(tiles),f=s[0];
  if(countTile(s,f)>=3){
    const r=removeTiles(s,[f,f,f]);
    if(r&&canFormMelds(r,n-1)) return true;
  }
  if(f.suit!=='z'&&f.num<=7){
    const f2={suit:f.suit,num:f.num+1},f3={suit:f.suit,num:f.num+2};
    const r=removeTiles(s,[f,f2,f3]);
    if(r&&hasTriplInDecomp(r,n-1)) return true;
  }
  return false;
}

// Check ALL Harbin + katan win conditions
function checkWin(player, winTile){
  if(!winTile) return false;
  // 1. Katan: winTile is in katan waits
  const waits=getKatanWaits(player.hand);
  if(!waits.some(w=>tileEq(w,winTile))) return false;
  // 2. 開門 — at least one called meld OR 扣聴 (concealed tenpai)
  if(player.melds.length===0 && !player.kouTing) return false;
  // All tiles
  const allTiles=[...player.hand,winTile,...player.melds.flatMap(m=>m.tiles)];
  // 3. ヤオ九
  if(!allTiles.some(t=>t.suit==='z'||t.num===1||t.num===9)) return false;
  // 4. 2+ suits
  const suits=new Set(allTiles.filter(t=>t.suit!=='z').map(t=>t.suit));
  if(suits.size<2) return false;
  // 5. triplet + sequence — 面子が実際に組めること
  return winningDecompositions([...player.hand,winTile]).length>0;
}

function getChiOptions(hand, tile){
  if(tile.suit==='z') return [];
  const opts=[];
  const pairs=[[tile.num-2,tile.num-1],[tile.num-1,tile.num+1],[tile.num+1,tile.num+2]];
  for(const [n1,n2] of pairs){
    if(n1<1||n1>9||n2<1||n2>9) continue;
    const t1={suit:tile.suit,num:n1},t2={suit:tile.suit,num:n2};
    if(hand.some(x=>tileEq(x,t1))&&hand.some(x=>tileEq(x,t2)))
      opts.push([t1,t2]);
  }
  return opts;
}
function getAnkanOptions(hand){
  return uniq(hand).filter(t=>countTile(hand,t)>=4);
}
/** ポン＋手牌1枚で加槓可能な候補 */
function getShouminkanOptions(p){
  const opts=[];
  if(!p||!p.melds) return opts;
  p.melds.forEach((m,mi)=>{
    if(m.type!=='pon') return;
    const t=m.calledTile||m.tiles[0];
    if(countTile(p.hand,t)>=1) opts.push({tile:t,meldIndex:mi});
  });
  return opts;
}
function getPostDrawKanOptions(p){
  return {ankan:getAnkanOptions(p.hand),shouminkan:getShouminkanOptions(p)};
}
function getTurnStartKanOptions(p){
  if(!p||p.kouTing||G.kanBranchBActive||G.discardedThisTurn) return {ankan:[],shouminkan:[]};
  return getPostDrawKanOptions(p);
}
function hasPostDrawKanOffer(post){
  return !!(post&&(post.ankan.length||post.shouminkan.length));
}
function drawRinshanTile(pi){
  const p=G.players[pi];
  if(G.wall.length===0){
    if(!G.treasureUsed){
      G.treasureUsed=true;
      const drawn=G.treasure;
      appendDrawToHandRight(p,drawn);
      updateAllTenpai();
      return drawn;
    }
    endRound(tr('roundDraw','流局'));
    return null;
  }
  const drawn=G.wall.pop();
  appendDrawToHandRight(p,drawn);
  updateAllTenpai();
  return drawn;
}
function checkRinshanWin(pi,drawn){
  if(!drawn) return false;
  const p=G.players[pi];
  const handWithout=removeTile(p.hand,drawn);
  const waitsBefore=handWithout?getKatanWaits(handWithout):[];
  const canTsumo=handWithout&&waitsBefore.some(w=>tileEq(w,drawn))&&checkWin({...p,hand:handWithout},drawn);
  if(!canTsumo) return false;
  if(p.isHuman){
    G.tsumoTile=drawn;
    G.humanOptions=['tsumo'];
    G.msg=UI.lang==='zh'?`岭上开花！(${tileName(drawn)})`:`嶺上開花！ (${tileName(drawn)})`;
    render();
  }else{
    resolveWin(pi,drawn,true,false);
  }
  return true;
}
function applySelfKanMeld(p,spec){
  const t=spec.tile;
  if(spec.kind==='ankan'){
    const newHand=removeTiles(p.hand,[t,t,t,t]);
    if(!newHand) return false;
    p.hand=sortTiles(newHand);
    p.melds.push({type:'ankan',tiles:[t,t,t,t],from:p.idx,concealed:true});
    return true;
  }
  const m=p.melds[spec.meldIndex];
  if(!m||m.type!=='pon') return false;
  const newHand=removeTile(p.hand,t);
  if(!newHand) return false;
  p.hand=sortTiles(newHand);
  p.melds[spec.meldIndex]={
    type:'kan',tiles:[t,t,t,t],from:m.from,calledTile:t,calledDiscardIdx:m.calledDiscardIdx
  };
  return true;
}
function executeSelfKan(pi,spec,branch){
  const p=G.players[pi];
  if(!p||p.kouTing) return;
  if(!applySelfKanMeld(p,spec)) return;
  const label=spec.kind==='shouminkan'?tr('shouminkan','加槓'):tr('ankan','暗槓');
  addLog(`${p.isHuman?sideName(0):p.name}が${label}！${tileName(spec.tile)}`);
  playActionFx('kan',`${p.isHuman?sideName(0):p.name} `,{
    actor:pi,
    meldTiles:[spec.tile,spec.tile,spec.tile,spec.tile]
  });
  updateAllTenpai();
  const drawn=drawRinshanTile(pi);
  if(checkRinshanWin(pi,drawn)) return;
  G.kanBranchAOpts=null;
  G.humanOptions=[];
  if(branch==='A'){
    G.kanTurnEnding=true;
    p.drawnTile=drawn;
    if(p.isHuman) G.lastDrawn=drawn;
    G.msg=UI.lang==='zh'?`杠后补牌: ${tileName(drawn)}。下家`:`嶺上補充: ${tileName(drawn)}。次へ`;

    scheduleMatch(()=>{G.kanTurnEnding=false;nextTurn(pi);},450);

  G.kanBranchBActive=true;
  p.drawnTile=null;
  if(p.isHuman) G.lastDrawn=null;
  G.turn=pi;
  G.phase='discard';
  G.msg=UI.lang==='zh'?'杠后请选择打牌（先切后摸）':'カン後、捨て牌を選んでください（先切後引）';
  render();
  if(!p.isHuman) scheduleMatch(()=>aiDiscard(pi),500);
}
function tryOfferPostDrawKan(fromPi){

// 扣聴: 摸牌直後に和了条件を満たす嵌張待ちだけ自動移行（13枚だけでは入らない）。
function updateAllTenpai(){
  for(const p of G.players){
    const exp=expectedHandCount(p);
    const atDiscardReady=(p.hand.length-4)%3===0;
    const atDrawReady=p.hand.length===exp+1;
    const drawn=p.drawnTile||(p.isHuman?G.lastDrawn:null);
    const atPostMainDraw=p.hand.length===exp&&handHasDrawnRef(p,drawn);
    if(!atDiscardReady&&!atDrawReady&&!atPostMainDraw) continue;
    const basis=atDrawReady||atPostMainDraw?concealedHandForTenpai(p):p.hand;
    const w=getKatanWaits(basis);
    if(p.kouTing) p.waits=w;
    if(!p.kouTing&&(atDrawReady||atPostMainDraw)&&drawn){
      if(shouldEnterKouTing(p,drawn)){
        p.kouTing=true;
        p.waits=w;
        if(p.isHuman) addLog(`${sideName(0)}が扣聴！${tr('waiting','待ち')}: ${w.map(tileName).join(' ')}`);
        else addLog(`${p.name}が扣聴`);
      }
    }
  }
}

function addLog(msg){G.log.unshift(msg);if(G.log.length>8)G.log.pop();}
// 面子1組あたり手牌から3枚相当が表に出る扱い（暗槓・大明槓も1組として数える＝嶺上1枚とセットで帳尻）
const expectedHandCount = p => Math.max(1,13-(p.melds.length*3));
const sideName = i => {
  if(G?.players?.[i]?.name) return G.players[i].name;
  const dealerReal=MATCH?.dealer??G?.dealerReal??0;
  return windLabelForView(i, dealerReal);
};
const tilesText = tiles => (tiles&&tiles.length)?sortTiles(tiles).map(tileName).join(' '):(UI.lang==='zh'?'无':'なし');

function appendDrawToHandRight(p,drawn){
  p.hand=[...p.hand,drawn];
  p.drawnTile=drawn;
  if(p.isHuman) G.lastDrawn=drawn;
}

/** 手牌配列内で ref と同一オブジェクトのインデックス（摸牌は通常末尾＝最右表示） */
function handIndexOfTileRef(p,ref){
  if(!p||!ref) return -1;
  for(let i=p.hand.length-1;i>=0;i--) if(p.hand[i]===ref) return i;
  return -1;
}

/** 扣聴: その1枚を外しても嵌張待ちが残る捨て候補（摸牌直後は引いた牌を必ず含める） */
function kouTingLegalDiscardIndices(p){
  if(!p||!p.kouTing) return [];
  const exp=expectedHandCount(p);
  const keep=p.waits&&p.waits.length?p.waits:null;
  const out=[];
  for(let i=0;i<p.hand.length;i++){
    const nh=p.hand.filter((_,j)=>j!==i);
    const w=getKatanWaits(nh);
    if(!w.length) continue;
    if(keep&&!keep.every(ww=>w.some(x=>tileEq(x,ww)))) continue;
    out.push(i);
  }
  if(p.hand.length===exp+1){
    const drawn=p.drawnTile||(p.isHuman&&G?G.lastDrawn:null);
    const di=drawn?handIndexOfTileRef(p,drawn):p.hand.length-1;
    if(di>=0&&!out.includes(di)) out.push(di);
  }
  return out;
}

function checkTsumoAfterDraw(pi,drawn){
  const p=G.players[pi];
  const basis=kouTingBasisHand(p,drawn);
  if(!basis) return false;
  const waits=getKatanWaits(basis);
  if(!waits.some(w=>tileEq(w,drawn))) return false;
  return checkWin({...p,hand:basis,kouTing:p.kouTing},drawn);
}

function handHasDrawnRef(p,drawn){
  return !!(drawn&&p.hand.some(t=>t===drawn||tileEq(t,drawn)));
}

function kouTingBasisHand(p,drawn){
  const exp=expectedHandCount(p);
  if(!p||!drawn) return null;
  if(p.hand.length===exp+1) return removeTile(p.hand,drawn);
  if(p.hand.length===exp&&handHasDrawnRef(p,drawn)) return [...p.hand];
  return null;
}

function concealedHandForTenpai(p){
  const exp=expectedHandCount(p);
  const drawn=p.drawnTile||(p.isHuman?G.lastDrawn:null);
  if(p.hand.length===exp+1&&drawn){
    const hw=removeTile(p.hand,drawn);
    return hw||p.hand;
  }
  if(p.hand.length===exp&&handHasDrawnRef(p,drawn)) return [...p.hand];
  return p.hand;
}

function shouldEnterKouTing(p,drawn){
  if(!drawn||p.kouTing) return false;
  const basis=kouTingBasisHand(p,drawn);
  if(!basis||(basis.length-4)%3!==0) return false;
  const waits=getKatanWaits(basis);
  if(!waits.length) return false;
  const pseudo={...p,hand:basis,kouTing:true};
  return waits.some(w=>checkWin(pseudo,w));
}

/** チー/ポン直後など exp+1 枚: この牌を捨てれば扣聴に入れる手牌インデックス */
function kouTingEntryDiscardIndices(p){
  if(!p||p.kouTing) return [];
  const exp=expectedHandCount(p);
  const hand=sortTiles([...p.hand]);
  if(hand.length!==exp+1) return [];
  const out=[];
  for(let i=0;i<hand.length;i++){
    const basis=hand.filter((_,j)=>j!==i);
    const waits=getKatanWaits(basis);
    if(!waits.length) continue;
    const pseudo={...p,hand:basis,kouTing:true};
    if(!waits.some(w=>checkWin(pseudo,w))) continue;
    out.push(i);
  }
  return out;
}

function enterKouTingByDiscard(p,tileIdx){
  const tile=p.hand[tileIdx];
  if(!tile) return false;
  noteDiscardMeta(0,tile);
  p.hand=p.hand.filter((_,i)=>i!==tileIdx);
  p.hand=sortTiles(p.hand);
  pushPlayerDiscard(p,tile);
  p.drawnTile=null;
  G.lastDrawn=null;
  p.kouTing=true;
  p.waits=getKatanWaits(p.hand);
  G.kouTingPick=false;
  updateAllTenpai();
  addLog(`${sideName(0)}が扣聴！${tr('waiting','待ち')}: ${(p.waits||[]).map(tileName).join(' ')}`);
  GameSFX.play('discard');
  fxVibrate(22);
  afterDiscard(0,tile);
  return true;
}

/** 通常手番: 捨てたあとの本引きで扣聴に入れる牌（捨て候補ごとに判定） */
function discardBasesForKouTingHint(p){
  const exp=expectedHandCount(p);
  const out=[];
  const seen=new Set();
  const push=(hand)=>{
    if(hand.length!==exp) return;
    const key=sortTiles(hand).map(tileKey).join(',');
    if(seen.has(key)) return;
    seen.add(key);
    out.push(hand);
  };
  if(p.hand.length===exp+1){
    for(let i=0;i<p.hand.length;i++) push(p.hand.filter((_,j)=>j!==i));
  }else if(p.hand.length===exp){
    push(p.hand);
  }
  return out;
}

function kouTingNearDrawTiles(p){
  if(!p||p.kouTing) return [];
  const exp=expectedHandCount(p);
  if(p.hand.length!==exp+1) return [];
  const found=new Map();
  for(const basis of discardBasesForKouTingHint(p)){
    for(const T of allTileTypes()){
      if(countTile(basis,T)>=4) continue;
      const hand14=[...basis,T];
      const pseudo={...p,hand:hand14};
      if(shouldEnterKouTing(pseudo,T)) found.set(tileKey(T),T);
    }
  }
  return sortTiles([...found.values()]);
}

function formatKtNearDrawHint(tiles){
  if(!tiles||!tiles.length) return '';
  const maxShow=12;
  if(tiles.length<=maxShow) return tiles.map(tileName).join(' ');
  return `${tiles.slice(0,maxShow).map(tileName).join(' ')} …`;
}

/* 軽量 SE（Web Audio・外部ファイルなし）と触覚 */
const GameSFX=(function(){
  let ctx=null;
  const getCtx=()=>{
    if(ctx) return ctx;
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C) return null;
    ctx=new C();
    return ctx;
  };
  const resume=c=>{if(c&&c.state==='suspended') c.resume().catch(()=>{});};
  const tone=(freq,dur,type,vol,t0)=>{
    const c=getCtx();if(!c)return;
    resume(c);
    const t=c.currentTime+(t0||0);
    const o=c.createOscillator();
    const g=c.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(c.destination);
    o.start(t);o.stop(t+dur+0.03);
  };
  return{
    play(name){
      switch(name){
        case 'discard':tone(540,0.038,'triangle',0.075,0);tone(360,0.032,'triangle',0.045,0.04);break;
        case 'draw':tone(720,0.055,'sine',0.065,0);tone(880,0.04,'sine',0.04,0.05);break;
        case 'chi':tone(920,0.055,'sine',0.08,0);tone(740,0.045,'sine',0.055,0.06);break;
        case 'pon':tone(420,0.065,'square',0.055,0);tone(620,0.05,'square',0.045,0.07);break;
        case 'kan':tone(300,0.1,'sine',0.085,0);tone(220,0.08,'sine',0.06,0.09);break;
        case 'win':[523,659,784].forEach((f,i)=>{setTimeout(()=>tone(f,0.12,'sine',0.06,0),i*72);});break;
        case 'skip':tone(320,0.045,'sine',0.04,0);break;
        case 'tap':tone(800,0.028,'sine',0.045,0);break;
        case 'deal':tone(420,0.03,'triangle',0.05,0);tone(560,0.022,'sine',0.035,0.03);break;
        case 'round':tone(280,0.08,'triangle',0.05,0);break;
        case 'gacha':
          for(let i=0;i<7;i++){
            tone(340+i*75,0.038,'square',0.055-i*0.0055, i*0.058);
          }
          break;
        case 'reveal':
          tone(520,0.05,'sine',0.06,0);
          tone(740,0.07,'sine',0.075,0.055);
          tone(990,0.09,'sine',0.065,0.1);
          break;
        case 'kt_discard':
          tone(220,0.06,'triangle',0.072,0);
          tone(180,0.045,'triangle',0.048,0.065);
          break;
        case 'dice':
          for(let i=0;i<8;i++) tone(180+Math.random()*520,0.04,'square',0.04,i*0.045);
          break;
        case 'dice_land':
          tone(260,0.06,'triangle',0.07,0);
          tone(140,0.08,'sine',0.05,0.04);
          break;
        default:break;
      }
    }
  };
})();

function fxVibrate(pattern){

let _overlayFocusPrev=null;
function _overlayTrapKey(ev){
  const ov=document.getElementById('overlay');
  if(!ov||ov.classList.contains('hidden')) return;
  if(ev.key==='Escape'){ev.preventDefault();closeOverlay();return;}
  if(ev.key!=='Tab') return;
  const box=ov.querySelector('.overlay-box');
  if(!box) return;
  const sel='button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])';
  const list=[].filter.call(box.querySelectorAll(sel),el=>!el.disabled&&el.offsetParent!==null);
  if(!list.length) return;
  const first=list[0],last=list[list.length-1];
  if(ev.shiftKey){if(document.activeElement===first){ev.preventDefault();last.focus();}}
  else{if(document.activeElement===last){ev.preventDefault();first.focus();}}
}

function closeOverlay(){
  document.removeEventListener('keydown',_overlayTrapKey,true);
  document.getElementById('overlay').classList.add('hidden');
  if(_overlayFocusPrev&&typeof _overlayFocusPrev.focus==='function'){
    try{_overlayFocusPrev.focus();}catch(_e){}
  }
  _overlayFocusPrev=null;
}

function showOverlay(title, body, detail){
  refreshOverlayLocale();
  document.getElementById('ov-title').textContent=title||'';
  document.getElementById('ov-body').textContent=body||'';
  document.getElementById('ov-detail').textContent=detail||'';
  const ov=document.getElementById('overlay');
  document.removeEventListener('keydown',_overlayTrapKey,true);
  _overlayFocusPrev=document.activeElement;
  ov.classList.remove('hidden');
  document.addEventListener('keydown',_overlayTrapKey,true);
  requestAnimationFrame(function(){
    const btn=document.getElementById('ov-view-btn');
    if(btn) btn.focus();
  });
  refreshOverlayLocale();
}

function seatAnchorRect(pi, role){
  const area=document.querySelector(MELD_FX_SEAT_ROOT[pi]);
  if(!area) return null;
  let el=null;
  if(role==='meld'){
    const groups=area.querySelectorAll('.meld-group');
    el=groups.length?groups[groups.length-1]:area.querySelector('.melds-row')||area.querySelector('#human-rack-wrap')||area;
  }else if(role==='discard'){
    if(pi===1){
      el=area.querySelector('.side-discards-zone .tile:last-child');
    }else if(pi===3){
      el=area.querySelector('.side-discards-zone .tile:last-child');
    }else if(pi===0){
      el=area.querySelector('#human-discards .tile:last-child');
    }else{
      el=area.querySelector('.top-discards .tile:last-child')||area.querySelector('.discard-strip .tile:last-child');
    }
  }else if(role==='hand'){
    el=area.querySelector('#human-hand')||area.querySelector('.tiles-row:last-child')||area.querySelector('.side-col')||area;
  }
  if(!el) return null;
  const r=el.getBoundingClientRect();
  if(!r.width&&!r.height) return null;
  return {x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height};
}

function seatAnchorPoint(pi, role){

function addMeldFxFlight(layer, tile, from, to, delay, animCls, faceDown){
  const wrap=document.createElement('div');
  wrap.innerHTML=tileHTML(tile, 'mfx-tile', faceDown);
  const el=wrap.firstElementChild;
  if(!el) return;
  el.classList.add('mfx-flight', animCls);
  const sw=to.w>0?Math.min(34,Math.max(22,to.w/3)):28;
  const sh=to.h>0?Math.min(48,Math.max(32,to.h)):40;
  el.style.width=sw+'px';
  el.style.height=sh+'px';
  const hw=sw/2, hh=sh/2;
  el.style.left=(from.x-hw)+'px';
  el.style.top=(from.y-hh)+'px';
  el.style.setProperty('--tx',(to.x-from.x)+'px');
  el.style.setProperty('--ty',(to.y-from.y)+'px');
  if(delay) el.style.animationDelay=delay+'ms';
  layer.appendChild(el);
}

  const shell=document.querySelector('.table-shell');
  if(shell) shell.setAttribute('data-mfx-seat', String(spec.actor));

  const target=seatAnchorRect(spec.actor,'meld');
  if(!target){clearMeldFx();return;}
  const isAnkan=spec.kind==='ankan';
  const source=(!isAnkan&&spec.from!=null&&spec.from>=0)?seatAnchorPoint(spec.from,'discard'):seatAnchorPoint(spec.actor,'hand');
  const targetPt={x:target.x,y:target.y,w:target.w,h:target.h};
  const glow={chi:'#6adfd5',pon:'#ff6a2f',minkan:'#ffd94a',ankan:'#8aa0ff'};
  if(shell) shell.style.setProperty('--mfx-glow',glow[spec.kind]||'#78fff0');

  const veil=document.createElement('div');
  veil.className='mfx-veil';
  const mid=source?{x:(source.x+targetPt.x)/2,y:(source.y+targetPt.y)/2}:targetPt;
  veil.style.left=mid.x+'px';
  veil.style.top=mid.y+'px';
  root.appendChild(veil);

  if(source&&!isAnkan) addMeldFxBeam(root, source, targetPt);

  const flights=document.createElement('div');
  flights.className='mfx-flights';
  root.appendChild(flights);

  const tiles=meldFxFlightTiles(spec.kind, spec.tile, spec.meldTiles);
  const animCls=isAnkan?'mfx-fly-ankan':spec.kind==='pon'?'mfx-fly-pon':spec.kind==='minkan'?'mfx-fly-kan':'mfx-fly';
  const count=Math.max(1,tiles.length);
  for(let i=0;i<count;i++){
    const t=tiles[i]||spec.tile;
    const off=(i-(count-1)/2)*10;
    const fromPt=source?{x:source.x+off,y:source.y+off*.35}:targetPt;
    const toPt={x:targetPt.x+off,y:targetPt.y};
    addMeldFxFlight(flights, t, fromPt, {...targetPt,...toPt}, i*70, animCls, isAnkan);
  }

  const stamp=document.createElement('div');
  stamp.className='mfx-stamp';
  stamp.textContent=mfxStampText(spec.kind, spec.actorLabel||'');
  stamp.style.left=targetPt.x+'px';
  stamp.style.top=(targetPt.y-target.h*.45)+'px';
  root.appendChild(stamp);

  _meldFxTimer=setTimeout(clearMeldFx,950);
}

function playActionFx(kind, actorLabel, meta={}){
  const actor=meta.actor!=null?meta.actor:0;
  const themeKind=kind==='kan'?'ankan':kind;
  try{ render(); }catch(_e){}
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      runMeldFx({
        kind:themeKind,
        actor,
        from:meta.from,
        tile:meta.tile,
        meldTiles:meta.meldTiles,
        actorLabel
      });
    });
  });
  if(themeKind==='chi'){GameSFX.play('chi');fxVibrate([12,18,12]);}
  else if(themeKind==='pon'){GameSFX.play('pon');fxVibrate([16,22,16]);}
  else if(themeKind==='minkan'){GameSFX.play('kan');fxVibrate([18,26,18]);}
  else if(themeKind==='ankan'){GameSFX.play('kan');fxVibrate([10,14,10]);}
}

// ======================================================
// GAME FLOW
// ======================================================
function drawAndPlay(pi){
  const p=G.players[pi];

  // Treasure draw: when wall is empty, only 扣聴 players get treasure
  if(G.wall.length===0){
    if(G.treasureUsed||!p.kouTing){endRound(tr('roundDraw','流局'));return;}
    G.treasureUsed=true;
    const drawn=G.treasure;
    appendDrawToHandRight(p,drawn);
    updateAllTenpai();
    if(p.isHuman){
      // Auto-resolve treasure win for human in 扣聴 (or always since treasure is auto-win)
      G.msg=UI.lang==='zh'?'摸到宝牌！宝中宝和牌！':'宝牌を引きました！宝中宝で上がります！';
      G.phase='discard';
      G.tsumoTile=drawn;
      render();
      scheduleMatch(()=>resolveWin(0,drawn,true,true),900);
    } else {
      resolveWin(pi,drawn,true,true);
    }
    return;
  }

  const drawn=G.wall.splice(0,1)[0];
  appendDrawToHandRight(p,drawn);
  updateAllTenpai();

  // Check tsumo win (normal draw)
  const canTsumo=checkTsumoAfterDraw(pi,drawn);

  if(canTsumo){
    if(p.isHuman){
      // In 扣聴, auto-tsumo. Otherwise show button.
      G.tsumoTile=drawn;
      if(p.kouTing){
        G.msg=`${tr('tsumo','ツモ！')} ${tileName(drawn)}`;
        G.phase='discard';
        G.humanOptions=[];
        render();
        scheduleMatch(()=>resolveWin(0,drawn,true,false),900);
      } else {
        G.msg=UI.lang==='zh'?'可以自摸和牌！':'ツモ上がりできます！';
        G.phase='discard';
        G.humanOptions=['tsumo'];
        render();
      }
    } else {
      resolveWin(pi,drawn,true,false);
    }
    return;
  }

  G.phase='discard';
  G.humanOptions=[];
  G.tsumoTile=null;

  if(p.isHuman){
    if(p.kouTing){
      scheduleKouTingHumanDrama(0,900,680);
    } else {
      G.msg=tr('chooseDiscard','牌を選んで捨てましょう（先出後引き）');
      render();
    }
  } else {
    if(p.kouTing){
      scheduleMatch(()=>autoDiscardDrawn(pi),700);
    } else {
      scheduleMatch(()=>aiDiscard(pi),600);
    }
  }
}

// 捨て牌が鳴かれたとき、先出後引きの「引き」は捨て主が山から1枚拾う（finalize が鳴き経路で呼ばれないためここで補う）
function replenishDiscardAfterCall(fromPi){
  if(!G||G.gameOver||fromPi==null||fromPi<0)return;
  const d=G.players[fromPi];
  if(!d)return;
  if(!drawAfterDiscard(fromPi)) return;
  updateAllTenpai();
}

/** 扣聴・人間のみ: 裏牌サスペンス→表オープン→自分で打牌（摸牌は配列末尾＝最右表示） */
function scheduleKouTingHumanDrama(pi,suspenseMs,holdMs){
  const p=G.players[pi];
  const tile=p.drawnTile||G.lastDrawn;
  if(!p||!tile){
    return;
  }
  if(!p.isHuman||!p.kouTing){
    return;
  }
  const ep=G._epoch;
  const tileRef=tile;
  const drawIdx=handIndexOfTileRef(p,tileRef);
  G.ktReveal={phase:'suspense',tile:tileRef,pi,drawIdx:drawIdx>=0?drawIdx:p.hand.length-1};
  G.lastDrawn=null;
  G.msg=`${tr('ktGachaTitle','扣聴・山から一枚…')} ${tr('ktGachaSub','何が出るかな…？')}`;
  GameSFX.play('gacha');
  fxVibrate([18,26,18,26,36,26,44]);
  render();
  scheduleMatch(()=>{
    if(!G||G._epoch!==ep||G.gameOver) return;
    const di=handIndexOfTileRef(p,tileRef);
    G.ktReveal={phase:'reveal',tile:tileRef,pi,drawIdx:di>=0?di:p.hand.length-1};
    G.lastDrawn=tileRef;
    G.msg=`${tr('ktRevealLine','来た！')} ${tileName(tileRef)} — ${tr('ktTensionLine','この一枚を切る瞬間…胸がザワザワ')}`;
    GameSFX.play('reveal');
    GameSFX.play('draw');
    fxVibrate([20,38,20]);
    render();
    scheduleMatch(()=>{
      if(!G||G._epoch!==ep||G.gameOver) return;
      G.ktReveal=null;
      G.msg=`${tr('ktPickDiscard','嵌張待ちを保てる牌だけ、タップして捨ててください')}\n${tr('ktPickDiscardHint','切った牌が誰かの和了に…と思うとヒリヒリしますね')}`;
      render();
    },typeof holdMs==='number'?holdMs:520);
  },typeof suspenseMs==='number'?suspenseMs:880);
}

// 扣聴・AIのみ: 山から摸って自動打牌（人間は「牌を引く」＋手動打牌）
function kouTingDrawThenAutoDiscard(pi){
  const p=G.players[pi];
  if(!p||!p.kouTing||G.gameOver) return;
  if(p.isHuman) return;

  if(G.wall.length===0){
    if(G.treasureUsed||!p.kouTing){endRound(tr('roundDraw','流局'));return;}
    G.treasureUsed=true;
    const drawn=G.treasure;
    appendDrawToHandRight(p,drawn);
    updateAllTenpai();
    resolveWin(pi,drawn,true,true);
    return;
  }

  const drawn=G.wall.splice(0,1)[0];
  appendDrawToHandRight(p,drawn);
  updateAllTenpai();

  if(checkTsumoAfterDraw(pi,drawn)){
    resolveWin(pi,drawn,true,false);
    return;
  }

  G.phase='discard';
  G.humanOptions=[];
  G.tsumoTile=null;
  GameSFX.play('draw');
  render();
  scheduleMatch(()=>autoDiscardDrawn(pi),350);
}

// 扣聴・AIのみ: 摸った牌を自動打牌（人間は humanDraw + humanDiscard）
function autoDiscardDrawn(pi){
  const p=G.players[pi];
  const drawn=p.drawnTile||G.lastDrawn;
  if(!drawn){return;}
  let idx=handIndexOfTileRef(p,p.drawnTile);
  if(idx<0) idx=p.hand.findIndex(t=>tileEq(t,drawn));
  if(idx<0){
    addLog(UI.lang==='zh'
      ? `[sync]扣听自动打出失败: 手牌中无${tileName(drawn)}`
      : `[整合]扣聴自動打牌: 手牌に${tileName(drawn)}がありません`);
    return;
  }
  if(!p.isHuman&&p.kouTing) GameSFX.play('kt_discard');
  G.pendingKouTingFrom=pi;
  p.hand.splice(idx,1);
  p.hand=sortTiles(p.hand);
  pushPlayerDiscard(p,drawn);
  p.drawnTile=null;
  if(p.isHuman) G.lastDrawn=null;
  updateAllTenpai();
  addLog(`${p.isHuman?sideName(0):p.name}が${tileName(drawn)}を捨てました（扣聴）`);
  GameSFX.play('discard');
  fxVibrate(12);
  afterDiscard(pi,drawn);
  render();
}

// 先出後引き: 捨てたあと、手牌が想定枚数に足りなければ山から補う（暗槓の嶺上で既に足りているときは引かない）
function drawAfterDiscard(pi){
  const p=G.players[pi];
  if(G.wall.length===0){
    if(G.treasureUsed||!p.kouTing){endRound(tr('roundDraw','流局'));return false;}
    G.treasureUsed=true;
    const drawn=G.treasure;
    appendDrawToHandRight(p,drawn);
    updateAllTenpai();
    resolveWin(pi,drawn,true,true);
    return false;
  }
  const expected=expectedHandCount(p);
  let lastDrawn=null;
  while(p.hand.length<expected&&G.wall.length>0){
    lastDrawn=G.wall.splice(0,1)[0];
    appendDrawToHandRight(p,lastDrawn);
  }
  updateAllTenpai();
  if(p.hand.length>expected){
    addLog(UI.lang==='zh'
      ? `[sync]引牌后手牌长度 ${p.hand.length}→${expected}（截断） ${tilesText(p.hand)}`
      : `[整合]摸調後の手牌 ${p.hand.length}→${expected}（切り詰め） ${tilesText(p.hand)}`);
    p.hand=sortTiles(p.hand.slice(0,expected));
    if(lastDrawn){
      p.drawnTile=p.hand.find(t=>t===lastDrawn)||p.hand.find(t=>tileEq(t,lastDrawn))||p.hand[p.hand.length-1]||null;
      if(p.isHuman) G.lastDrawn=p.drawnTile;
    } else {
      p.drawnTile=null;
      if(p.isHuman) G.lastDrawn=null;
    }
    updateAllTenpai();
  }
  if(p.isHuman&&lastDrawn&&!p.kouTing){GameSFX.play('draw');fxVibrate(10);}
  if(lastDrawn&&checkTsumoAfterDraw(pi,lastDrawn)){
    resolveWin(pi,lastDrawn,true,false);
    return false;
  }
  return true;
}

function finalizeAfterDiscardCycle(fromPi){
  if(G.gameOver) return;
  // 親の配牌14枚スタート時、最初の打牌だけは引かないで13枚に揃える
  if(G.dealerOpeningDiscardNoDraw && fromPi===G.dealer){
    G.dealerOpeningDiscardNoDraw=false;
    nextTurn(fromPi);
    return;
  }
  // チー/ポン直後は「出すだけで引かない」。
  if(G.skipDrawAfterCallBy===fromPi){
    G.skipDrawAfterCallBy=null;
    nextTurn(fromPi);
    return;
  }
  // 扣聴: 摸った直後の自動打牌で来た2回目の finalize は摸り直さず次家へ（摸打1サイクル完了）
  if(G.pendingKouTingFrom===fromPi){
    G.pendingKouTingFrom=null;
    nextTurn(fromPi);
    return;
  }
  if(G.players[fromPi].kouTing){
    nextTurn(fromPi);
    return;
  }
  if(!drawAfterDiscard(fromPi)) return;
  if(G.kanBranchBActive){
    G.kanBranchBActive=false;
    nextTurn(fromPi);
    return;
  }
  if(tryOfferPostDrawKan(fromPi)) return;
  const pk=G.players[fromPi];
  if(pk.kouTing){
    if(pk.isHuman){
      scheduleKouTingHumanDrama(fromPi,920,560);
    } else {
      scheduleMatch(()=>autoDiscardDrawn(fromPi),280);
    }
    return;
  }
  nextTurn(fromPi);
}

function humanKouTingPick(){
  if(!G||G.turn!==0||G.phase!=='discard') return;
  const p=G.players[0];
  if(p.kouTing) return;
  const entry=G.online?(G.kouTingEntryIdx||[]):kouTingEntryDiscardIndices(p);
  if(!entry.length) return;
  G.kouTingPick=true;
  G.msg=tr('kouTingPick','聴に入る牌をタップして捨ててください');
  render();
}

function humanKouTingPickCancel(){
  if(!G) return;
  G.kouTingPick=false;
  G.msg=tr('chooseDiscard','牌を選んで捨てましょう（先出後引き）');
  render();
}

function humanDiscard(tileIdx){
  if(G?.online){
    if(G.kouTingPick&&onlineLegal('kouting')) onlineAction('kouting',{index:tileIdx});
    else onlineAction('discard',{index:tileIdx});
    return;
  }
  if(G.phase!=='discard'||G.turn!==0) return;
  if(G.kanBranchAOpts||G.kanTurnEnding) return;
  const p=G.players[0];
  G.discardedThisTurn=true;
  const tile=p.hand[tileIdx];
  if(!tile) return;
  if(!p.kouTing&&G.kouTingPick){
    const entry=kouTingEntryDiscardIndices(p);
    if(entry.includes(tileIdx)&&enterKouTingByDiscard(p,tileIdx)) return;
    return;
  }
  noteDiscardMeta(0,tile);
  if(p.kouTing){
    if(G.ktReveal) return;
    const leg=kouTingLegalDiscardIndices(p);
    const drawnRef=p.drawnTile||(G.lastDrawn&&p.hand.some(t=>t===G.lastDrawn)?G.lastDrawn:null);
    const drawnIdx=drawnRef?handIndexOfTileRef(p,drawnRef):-1;
    if(!leg.includes(tileIdx)&&!(drawnIdx>=0&&tileIdx===drawnIdx)) return;
    p.hand=p.hand.filter((_,i)=>i!==tileIdx);
    p.hand=sortTiles(p.hand);
    pushPlayerDiscard(p,tile);
    p.drawnTile=null;
    G.lastDrawn=null;
    updateAllTenpai();
    addLog(`${sideName(0)}が${tileName(tile)}を捨てました（扣聴）`);
    GameSFX.play('discard');
    fxVibrate(15);
    afterDiscard(0,tile);
    return;
  }
  p.hand=p.hand.filter((_,i)=>i!==tileIdx);
  p.hand=sortTiles(p.hand);
  pushPlayerDiscard(p,tile);
  p.drawnTile=null;
  G.lastDrawn=null;
  updateAllTenpai();
  addLog(`${sideName(0)}が${tileName(tile)}を捨てました`);
  GameSFX.play('discard');
  fxVibrate(15);
  afterDiscard(0,tile);
}

function afterDiscard(fromPi, tile){
  G.pendingDiscard=tile;
  G.pendingFrom=fromPi;
  const human=G.players[0];
  G.humanOptions=[];
  G.chiOpts=[];

  if(fromPi!==0){
    // Can human ron?
    if(checkWin(human,tile)){
      // In 扣聴, auto-ron (no choice). Otherwise offer button.
      if(human.kouTing){
        scheduleMatch(()=>resolveWin(0,tile,false,false),500);
        G.msg=`${tr('ron','ロン！')} ${tileName(tile)}`;
        render();
        return;
      }
      G.humanOptions.push('win');
    }
    // Pon/Chi only allowed when NOT in 扣聴
    if(!human.kouTing){
      if(countTile(human.hand,tile)>=3&&human.hand.length>3){
        G.humanOptions.push('minkan');
      }
      if(countTile(human.hand,tile)>=2&&human.hand.length>3){
        G.humanOptions.push('pon');
      }
      if(nextPlayer(fromPi)===0){
        const opts=getChiOptions(human.hand,tile);
        if(opts.length>0){G.humanOptions.push('chi');G.chiOpts=opts;}
      }
    }
  }

  if(G.humanOptions.length>0){
    G.phase='after_discard';
    G.msg=tr('actionPrompt','どうしますか？');
    render();
  } else {
    processAIResponses(fromPi,tile,()=>finalizeAfterDiscardCycle(fromPi));
  }
}

function processAIResponses(fromPi, tile, done){
  const lv=aiLevel();
  // Check AI for win first
  for(const p of G.players){
    if(p.isHuman||p.idx===fromPi) continue;
    if(checkWin(p,tile)&&Math.random()<(lv.claimBoost||1)){
      scheduleMatch(()=>resolveWin(p.idx,tile,false,false),400);
      return;
    }
  }
  // 大明槓（手に3枚＋捨て1枚）— ポンより先に判定
  for(const p of G.players){
    if(p.isHuman||p.idx===fromPi||p.kouTing) continue;
    if(countTile(p.hand,tile)>=3&&p.hand.length>3){
      if(Math.random()<lv.pon*0.22){
        scheduleMatch(()=>{aiMinkan(p.idx,tile,fromPi);},400);
        return;
      }
    }
  }
  // Check AI for pon (only if AI is not in 扣聴)
  for(const p of G.players){
    if(p.isHuman||p.idx===fromPi||p.kouTing) continue;
    if(countTile(p.hand,tile)>=2&&p.hand.length>3){
      if(Math.random()<lv.pon){
        scheduleMatch(()=>{aiPon(p.idx,tile,fromPi);},400);
        return;
      }
    }
  }
  // Check next player for chi (skip if in 扣聴)
  const nextPi=nextPlayer(fromPi);
  const nxt=G.players[nextPi];
  if(!nxt.isHuman&&!nxt.kouTing){
    const chiOpts=getChiOptions(nxt.hand,tile);
    const canChi=chiOpts.length>0&&(lv.chiOpen||nxt.melds.some(m=>m.type==='pon'||m.type==='kan'));
    if(canChi&&Math.random()<lv.chi*(lv.claimBoost||1)){
      scheduleMatch(()=>{aiChi(nextPi,tile,chiOpts[0],fromPi);},400);
      return;
    }
  }
  done();
}

function beginActiveTurn(){
  if(!G||G.gameOver||G.roundOver) return;
  if(G.dealCinemaActive){
    clearDealCinema();
    G.dealCinemaActive=false;
    G.dealFaceReveal=false;
    G.dealRevealCounts=null;
    G.dealCinemaPhase=null;
  }
  G.phase='discard';
  G.kanBranchBActive=false;
  G.kanBranchAOpts=null;
  G.discardedThisTurn=false;
  G.kanTurnEnding=false;
  const p=G.players[G.turn];
  if(!p) return;
  if(p.isHuman){
    if(p.kouTing){
      G.msg=tr('kouTingNeedDraw','扣聴です。「牌を引く」で山から1枚（右端に現れます）');
    }else{
      G.msg=tr('chooseDiscard','牌を選んで捨てましょう（先出後引き）');
    }
    G.humanOptions=[];
    render();
    return;
  }
  if(aiMaybeTurnStartKan(G.turn)) return;
  if(p.kouTing) scheduleMatch(()=>kouTingDrawThenAutoDiscard(G.turn),500);
  else scheduleMatch(()=>aiDiscard(G.turn),500);
}

function nextTurn(fromPi){
  G.turn=nextPlayer(fromPi);
  beginActiveTurn();
}

// ======================================================
function humanMinkan(){
  if(G?.online){onlineAction('minkan');return;}
  const p=G.players[0],tile=G.pendingDiscard;
  const donor=G.pendingFrom;
  if(p.kouTing) return;
  if(countTile(p.hand,tile)<3) return;
  const newHand=removeTiles(p.hand,[tile,tile,tile]);
  if(!newHand) return;
  p.hand=newHand;
  const calledDiscardIdx=markPendingDiscardClaimed();
  p.melds.push({type:'kan',tiles:[tile,tile,tile,tile],from:donor,calledTile:tile,calledDiscardIdx});
  addLog(`${sideName(0)}が${tr('minkan','大明槓')}！${tileName(tile)}`);
  playActionFx('minkan',`${sideName(0)} `,{tile,from:donor,actor:0,meldTiles:[tile,tile,tile,tile]});
  replenishDiscardAfterCall(donor);
  G.skipDrawAfterCallBy=0;
  G.turn=0;
  G.phase='discard';
  G.humanOptions=[];
  G.tsumoTile=null;
  G.lastDrawn=null;
  p.drawnTile=null;
  updateAllTenpai();
  G.msg=UI.lang==='zh'?'请选择打牌':'捨て牌を選んでください';
  render();
}

function humanPon(){
  if(G?.online){onlineAction('pon');return;}
  const p=G.players[0],tile=G.pendingDiscard;
  const donor=G.pendingFrom;
  if(p.kouTing) return;
  const newHand=removeTiles(p.hand,[tile,tile]);
  if(!newHand) return;
  p.hand=sortTiles(newHand);
  const calledDiscardIdx=markPendingDiscardClaimed();
  p.melds.push({type:'pon',tiles:[tile,tile,tile],from:donor,calledTile:tile,calledDiscardIdx});
  addLog(`${sideName(0)}が${tr('pon','ポン')}！${tileName(tile)}`);
  playActionFx('pon',`${sideName(0)} `,{tile,from:donor,actor:0,meldTiles:[tile,tile,tile]});
  replenishDiscardAfterCall(donor);
  G.skipDrawAfterCallBy=0;
  G.turn=0;

    if(onlineLegal('draw')) onlineAction('draw');
    return;

  if(!G||G.gameOver) return;
  if(G.phase!=='discard'||G.turn!==0) return;

    G.phase='discard';

  }
  const drawn=G.wall.splice(0,1)[0];
  appendDrawToHandRight(p,drawn);
  updateAllTenpai();
  if(checkTsumoAfterDraw(0,drawn)){
    G.tsumoTile=drawn;

    G.phase='discard';

function aiFindDiscard(p){
  // Score each tile: lower = better to discard
  const hand=p.hand;
  const scores=hand.map(tile=>{
    let sc=0;
    // Part of pair?
    if(countTile(hand,tile)>=2) sc+=5;
    // Part of kanchan?
    if(tile.suit!=='z'){
      for(const t of hand){
        if(t.suit===tile.suit&&Math.abs(t.num-tile.num)===2) sc+=4;
      }
    }
    // Adjacent?
    if(tile.suit!=='z'){
      const adj=[{suit:tile.suit,num:tile.num-1},{suit:tile.suit,num:tile.num+1}];
      for(const a of adj) if(a.num>=1&&a.num<=9&&hand.some(x=>tileEq(x,a))) sc+=2;
    }
    // Yaochu?
    if(tile.suit==='z'||tile.num===1||tile.num===9) sc+=1;
    return sc;
  });
  const min=Math.min(...scores);
  const cands=hand.filter((_,i)=>scores[i]===min);
  const lv=aiLevel();
  if(Math.random()<(lv.discardNoise||0)) return hand[Math.floor(Math.random()*hand.length)];
  return cands[Math.floor(Math.random()*cands.length)];
}

function isDiscarderListening(p){
  if(!p) return false;
  if(p.kouTing) return true;
  return getKatanWaits(p.hand).length>0;
}

function noteDiscardMeta(fromPi, tile){
  if(!G||fromPi==null||fromPi<0) return;
  const p=G.players[fromPi];
  G.lastDiscardMeta={from:fromPi,tile,discarderListening:isDiscarderListening(p)};
}

function getTsumoScoreDeltas(winnerSeat, basePts=4){
  const d=[0,0,0,0];
  d[winnerSeat]=basePts*3;
  for(let s=0;s<4;s++) if(s!==winnerSeat) d[s]=-basePts;
  return d;
}

/** 哈尔滨: 听牌放炮は各家−2、未听牌放炮（出冲）は放炮者のみ−6 */
function getRonScoreDeltas(winnerSeat, fromSeat, discarderListening, basePts=2){
  const d=[0,0,0,0];
  d[winnerSeat]=basePts*3;
  if(discarderListening){
    for(let s=0;s<4;s++) if(s!==winnerSeat) d[s]=-basePts;
  }else{
    d[fromSeat]=-basePts*3;
  }
  return d;
}

function applyScoreDeltas(deltas){
  for(let s=0;s<4;s++) G.scores[s]+=deltas[s];
  if(MATCH) MATCH.scores=G.scores;
}

function formatScoreDeltaLine(seat,delta){
  const sign=delta>0?`+${delta}`:String(delta);
  return `${sideName(seat)} ${sign}`;
}

function buildWinScoreDetail(winnerSeat, deltas, isTsumo, fromSeat, discarderListening){
  const lines=[formatScoreDeltaLine(winnerSeat,deltas[winnerSeat])];
  if(isTsumo){
    for(let s=0;s<4;s++) if(s!==winnerSeat) lines.push(formatScoreDeltaLine(s,deltas[s]));
  }else if(discarderListening){
    lines.push(UI.lang==='zh'?tr('ronScoreListening','听牌放炮（各家−2分）'):tr('ronScoreListening','听牌放炮（各家−2点）'));
    for(let s=0;s<4;s++) if(s!==winnerSeat) lines.push(formatScoreDeltaLine(s,deltas[s]));
  }else{
    lines.push(UI.lang==='zh'?tr('ronScoreBao','未听牌放炮·包两家（放铳者−6分）'):tr('ronScoreBao','未听牌放炮・包两家（放銃者−6点）'));
    lines.push(formatScoreDeltaLine(fromSeat,deltas[fromSeat]));
    for(let s=0;s<4;s++) if(s!==winnerSeat&&s!==fromSeat&&deltas[s]) lines.push(formatScoreDeltaLine(s,deltas[s]));
  }
  return lines.join('\n');
}

  return UI.lang==='zh'?tr('dianpao','点炮'):tr('fangpao','放銃');
}

function seatAnchorRonDiscard(fromPi, tile){
  const area=document.querySelector(MELD_FX_SEAT_ROOT[fromPi]);
  if(!area||!tile) return null;
  const cells=area.querySelectorAll('.discard-cell.ron-fired');
  if(cells.length){
    const r=cells[0].getBoundingClientRect();
    return {x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height};
  }
  const key=tileKey(tile);
  for(const cell of area.querySelectorAll('.discard-cell.is-claimed')){
    const img=cell.querySelector('.tile');
    if(!img) continue;
    if(cell.getAttribute('data-tile-key')===key||cell.classList.contains('ron-fired')){
      const r=cell.getBoundingClientRect();
      return {x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height};
    }
  }
  return seatAnchorRect(fromPi,'discard');
}

  if(fromSeat==null||fromSeat<0) return;

  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      const fromPt=seatAnchorRonDiscard(fromSeat,tile);

function resolveWin(pi, tile, isTsumo, isTreasure){
  G.gameOver=true;
  G.roundOver=true;
  G.handsRevealed=true;
  GameSFX.play('win');
  fxVibrate([35,85,35,85,140]);
  const p=G.players[pi];
  const fromPi=!isTsumo&&!isTreasure
    ?(G.lastDiscardMeta?.from ?? G.pendingFrom)
    :-1;
  const discarderListening=fromPi>=0
    ?(G.lastDiscardMeta?.discarderListening ?? isDiscarderListening(G.players[fromPi]))
    :false;
  if(!isTsumo&&!isTreasure) markPendingDiscardClaimed();

  let deltas;
  let totalPts;
  if(isTreasure){
    const base=12;
    deltas=[0,0,0,0];
    deltas[pi]=base*3;
    for(let s=0;s<4;s++) if(s!==pi) deltas[s]=-base;
    totalPts=base*3;
  }else if(isTsumo){
    deltas=getTsumoScoreDeltas(pi,4);
    totalPts=deltas[pi];
  }else{
    deltas=getRonScoreDeltas(pi,fromPi,discarderListening,2);
    totalPts=deltas[pi];
  }
  applyScoreDeltas(deltas);

  const method=isTreasure?tr('treasureWin','宝中宝！'):isTsumo?tr('tsumo','ツモ！'):tr('ron','ロン！');
  const winnerName=p.isHuman?sideName(0):p.name;
  const fromName=fromPi>=0?sideName(fromPi):null;
  const scoreLines=buildWinScoreDetail(pi,deltas,isTsumo,fromPi,discarderListening);
  const sourceText=UI.lang==='zh'
    ?(isTsumo?`支付: 三家各−4分`:fromName?`${tr('dianpao','点炮')}: ${fromName}（${tileName(tile)}）`:'')
    :(isTsumo?`支払い: 他家各−4点`:fromName?`${tr('fangpao','放銃')}: ${fromName}（${tileName(tile)}）`:'');
  const meldText=p.melds.length?p.melds.map(m=>`${m.type.toUpperCase()}[${m.tiles.map(tileName).join(' ')}]`).join('  '):(UI.lang==='zh'?'无':'なし');
  const totalLine=UI.lang==='zh'
    ?`${tr('matchTotal','合计分')}: ${scoreSummaryText()}`
    :`${tr('matchTotal','合計点')}: ${scoreSummaryText()}`;
  const detail=UI.lang==='zh'
    ?[
      `和牌: ${tileName(tile)}`,
      `方式: ${method}`,
      sourceText,
      `手牌: ${tilesText(p.hand)}`,
      `副露: ${meldText}`,
      `得分:\n${scoreLines}`,
      totalLine,
    ].join('\n')
    :[
      `和了牌: ${tileName(tile)}`,
      `和了方法: ${method}`,
      sourceText,
      `手牌: ${tilesText(p.hand)}`,
      `副露: ${meldText}`,
      `得点:\n${scoreLines}`,
      totalLine,
    ].join('\n');
  G.lastWin={
    winner:pi,
    tile,
    method,
    points:totalPts,
    from:fromPi>=0?fromPi:null,
    discarderListening,
    isTsumo:!!isTsumo,
    isTreasure:!!isTreasure,
    scoreDeltas:deltas,
    detail,
  };
  G.msg=UI.lang==='zh'
    ?`${winnerName} ${method} ${tileName(tile)} (+${totalPts}分)${fromName?`\n${tr('dianpao','点炮')}: ${fromName}`:''}`
    :`${winnerName} ${method} ${tileName(tile)} (+${totalPts}点)${fromName?`\n${tr('fangpao','放銃')}: ${fromName}`:''}`;
  const body=UI.lang==='zh'
    ?`${method} +${totalPts}分  和牌: ${tileName(tile)}\n${totalLine}`
    :`${method} +${totalPts}点  和了牌: ${tileName(tile)}\n${totalLine}`;
  render();
  if(!isTsumo&&!isTreasure&&fromPi>=0){
    playRonRevealFx(pi,fromPi,tile);
    scheduleMatch(()=>showOverlay(`${winnerName}${t('winTitle')}`,body,detail),1200);
  }else{
    showOverlay(`${winnerName}${t('winTitle')}`,body,detail);
  }
}

function renderDiscardStrip(tiles, cls, size='xs', pendingFromSeat=null){
  if(!tiles||!tiles.length) return '';
  const tileCls=cls==='left'?'hand-face opp-hand opp-disc opp-rot-right'
    :cls==='right'?'hand-face opp-hand opp-disc opp-rot-left'
    :size;
  const stripCls=cls==='left'||cls==='right'?`discard-strip ${cls} strip-side`:`discard-strip ${cls}`;
  const seatByCls={'opp-top':2,left:1,right:3,human:0};
  const stripSeat=Object.prototype.hasOwnProperty.call(seatByCls,cls)?seatByCls[cls]:-1;
  const lastIdx=tiles.length-1;
  const pinPending=G&&G.phase==='after_discard'&&G.pendingDiscard&&pendingFromSeat!=null&&stripSeat===pendingFromSeat;
  const ronWin=G&&G.lastWin&&!G.lastWin.isTsumo&&!G.lastWin.isTreasure&&G.lastWin.from!=null?G.lastWin:null;
  const ronLabel=ronRevealLabel();
  const fluidRiver=cls==='human'||cls==='opp-top';
  let flat=0;
  const cellHtml=entry=>{
    const d=normalizeDiscardEntry(entry);
    const cls2=tileCls+(d.claimed?' discard-claimed':'');
    const isPin=pinPending&&flat===lastIdx&&tileEq(d.tile,G.pendingDiscard);
    const isRonFired=!!(ronWin&&stripSeat===ronWin.from&&d.claimed&&tileEq(d.tile,ronWin.tile));
    flat++;
    const cw=(d.claimed?' discard-cell is-claimed':' discard-cell')+(isPin?' discard-pending-target':'')+(isRonFired?' ron-fired':'');
    const ronAttr=isRonFired?` data-ron-label="${escapeHtmlText(ronLabel)}" data-tile-key="${tileKey(d.tile)}"`:` data-tile-key="${tileKey(d.tile)}"`;
    return `<div class="${cw}"${ronAttr}>${tileHTML(d.tile,cls2)}</div>`;
  };
  if(fluidRiver){
    const inner=tiles.map(cellHtml).join('');
    return `<div class="discard-river-mat"><div class="${stripCls}">${inner}</div></div>`;
  }
  const rows=chunkEvery(tiles,6);
  const rowExtra=cls==='left'||cls==='right'?' discard-row-sidecol':'';
  const inner=rows.map(row=>{
    const cells=row.map(cellHtml).join('');
    return `<div class="discard-row discard-row-6${rowExtra}">${cells}</div>`;
  }).join('');
  return `<div class="discard-river-mat"><div class="${stripCls}">${inner}</div></div>`;
}

function renderDealHandRows(tiles, renderTile, colsPerRow=3){
  if(!tiles.length) return '';
  const rows=[];
  for(let i=0;i<tiles.length;i+=colsPerRow) rows.push(tiles.slice(i,i+colsPerRow));
  return rows.map(row=>`<div class="deal-hand-row">${row.map(renderTile).join('')}</div>`).join('');
}

/** @param {'north'|'east'|'west'|null} seatStyle 北=lg卓上、東=手札左90°、西=手札右90° */
function renderSeatHand(p, faceSize, side=false, seatStyle=null){
  const reveal=!!(G&&G.roundOver&&G.handsRevealed);
  const cinema=!!(G&&G.dealCinemaActive);
  const count=cinema&&G.dealRevealCounts?Math.min(G.dealRevealCounts[p.idx]||0,p.hand.length):p.hand.length;
  const tiles=cinema?p.hand.slice(0,count):p.hand;
  const hf=p.isHuman&&!side?' hand-face':'';
  const eastCls='hand-face opp-hand opp-rot-left';
  const westCls='hand-face opp-hand opp-rot-right';
  if(cinema){
    const humanFlip=p.isHuman&&G.dealFaceReveal;
    const renderTile=t=>{
      if(humanFlip||reveal){
        if(seatStyle==='north') return tileHTML(t,HUMAN_RIVER_TILE_CLS);
        if(seatStyle==='east') return tileHTML(t,eastCls);
        if(seatStyle==='west') return tileHTML(t,westCls);
        return tileHTML(t,(side?'side-xs':faceSize)+hf);
      }
      return tileHTML(null,side?'side-xs':faceSize+(p.kouTing?' kouting-tile':''),true);
    };
    if(count>0) return renderDealHandRows(tiles,renderTile,3);
    return '';
  }
  if(side){
    return tiles.map(t=>{
      if(reveal){
        if(seatStyle==='east') return tileHTML(t,eastCls);
        if(seatStyle==='west') return tileHTML(t,westCls);
      }
      return tileHTML(null,'side-xs'+(p.kouTing?' kouting-tile':''),true);
    }).join('');
  }
  if(seatStyle==='north'){
    const cls=HUMAN_RIVER_TILE_CLS;
    return tiles.map(t=>reveal?tileHTML(t,cls):tileHTML(null,cls+(p.kouTing?' kouting-tile':''),true)).join('');
  }
  return tiles.map(t=>reveal?tileHTML(t,faceSize+hf):tileHTML(null,faceSize+(p.kouTing?' kouting-tile':''),true)).join('');
}

function normalizeDiscardEntry(entry){
  if(entry&&typeof entry==='object'&&entry.tile) return {tile:entry.tile,claimed:!!entry.claimed};
  return {tile:entry,claimed:false};
}

function pushPlayerDiscard(player,tile){
  player.discards.push({tile,claimed:false});
}

function markPendingDiscardClaimed(){
  if(!G||G.pendingFrom==null||G.pendingFrom<0) return null;
  const donor=G.players[G.pendingFrom];
  if(!donor||!donor.discards.length) return null;
  const idx=donor.discards.length-1;
  const entry=normalizeDiscardEntry(donor.discards[idx]);
  donor.discards[idx]={tile:entry.tile,claimed:true};
  return idx;
}

function syncDiscardClaimsFromMelds(players){
  players.forEach(p=>{
    p.discards=(p.discards||[]).map(entry=>{
      const e=normalizeDiscardEntry(entry);
      return {tile:e.tile,claimed:false};
    });
  });
  players.forEach(claimer=>{
    (claimer.melds||[]).forEach(m=>{
      if(m.concealed||m.type==='ankan') return;
      if(m.from==null&&m.from!==0) return;
      const donor=players[m.from];
      if(!donor) return;
      if(m.calledDiscardIdx!=null&&donor.discards[m.calledDiscardIdx]!=null){
        const entry=normalizeDiscardEntry(donor.discards[m.calledDiscardIdx]);
        donor.discards[m.calledDiscardIdx]={tile:entry.tile,claimed:true};
        return;
      }
      const called=m.calledTile||m.tiles[0];
      for(let i=donor.discards.length-1;i>=0;i--){
        const entry=normalizeDiscardEntry(donor.discards[i]);
        if(entry.claimed) continue;
        if(tileEq(entry.tile,called)){
          donor.discards[i]={tile:entry.tile,claimed:true};
          break;
        }
      }
    });
  });
}

function renderMeldGroups(melds,tileCls){
  if(!melds||!melds.length) return '';
  const tagRiverCalled=tileCls!==HUMAN_MELD_TILE_CLS;
  return melds.map(m=>{
    const called=m.calledTile||m.tiles[0];
    return `<div class="meld-group">${m.tiles.map(t=>{
      const riverTag=tagRiverCalled&&called&&tileEq(t,called)?' meld-from-river':'';
      return tileHTML(t,tileCls+riverTag);
    }).join('')}</div>`;
  }).join('');
}

function renderSideMeldGroups(melds,seat){
  if(!melds||!melds.length) return '';
  const base=seat==='right'?'hand-face opp-hand opp-rot-left':'hand-face opp-hand opp-rot-right';
  return melds.map(m=>{
    const called=m.calledTile||m.tiles[0];
    return `<div class="meld-group">${m.tiles.map(t=>tileHTML(t,base+(called&&tileEq(t,called)?' meld-from-river':''))).join('')}</div>`;
  }).join('');
}

  const topHand=renderSeatHand(p2,HUMAN_RIVER_TILE_CLS,false,'north');
  const topMelds=renderMeldGroups(p2.melds,HUMAN_RIVER_TILE_CLS);
  const topDiscards=renderDiscardStrip(p2.discards,'opp-top',HUMAN_RIVER_TILE_CLS,pendingForStrip);

  // === LEFT PLAYER (p1, 西) ===
  const leftHand=`<div class="side-col${dealActive?' deal-staging':''}">${renderSeatHand(p1,'',true,'west')}</div>`;
  const leftMelds=p1.melds.length?renderSideMeldGroups(p1.melds,'left'):'';
  const leftDiscards=renderDiscardStrip(p1.discards,'left','xs',pendingForStrip);

  // === RIGHT PLAYER (p3, 東) ===
  const rightHand=`<div class="side-col${dealActive?' deal-staging':''}">${renderSeatHand(p3,'',true,'east')}</div>`;
  const rightMelds=p3.melds.length?renderSideMeldGroups(p3.melds,'right'):'';
  const rightDiscards=renderDiscardStrip(p3.discards,'right','xs',pendingForStrip);

  // === HUMAN (p0) ===
  const waits=p0.waits&&p0.waits.length?p0.waits:getKatanWaits(p0.hand);
  const exp0=expectedHandCount(p0);
  const kouTingMayDiscard=p0.kouTing&&G.phase==='discard'&&G.turn===0&&p0.hand.length>exp0&&!G.ktReveal;
  const ktEntry=!p0.kouTing
    ?(G.online?(G.kouTingEntryIdx||[]):kouTingEntryDiscardIndices(p0))
    :[];
  const kouTingPick=!!G.kouTingPick;
  const canHumanDiscard=G.phase==='discard'&&G.turn===0&&(!p0.kouTing||kouTingMayDiscard)&&!G.dealCinemaActive;
  const ktLeg=kouTingMayDiscard?kouTingLegalDiscardIndices(p0):[];
  const kt=G.ktReveal;
  const suspenseMask=!!(kt&&kt.phase==='suspense'&&kt.pi===0&&p0.kouTing&&Number.isInteger(kt.drawIdx));
  const revealPop=!!(kt&&kt.phase==='reveal'&&kt.pi===0&&p0.kouTing&&Number.isInteger(kt.drawIdx));
  const humanRackCls='human-rack'+(suspenseMask?' kt-rack-pulse':'');
  const dealCount=dealActive&&G.dealRevealCounts?Math.min(G.dealRevealCounts[0]||0,p0.hand.length):p0.hand.length;
  const drawnRef0=p0.drawnTile||(G.lastDrawn&&p0.hand.some(t=>t===G.lastDrawn)?G.lastDrawn:null);
  const drawnIdx0=drawnRef0?handIndexOfTileRef(p0,drawnRef0):-1;
  const humanMeldTileCount=(p0.melds||[]).reduce((n,m)=>n+(m.tiles?m.tiles.length:0),0);
  const humanRackSlots=Math.max(14,humanMeldTileCount+p0.hand.length+(drawnIdx0>=0?1:0)+2);
  const humanRackStyle=`--human-rack-slots:${humanRackSlots}`;
  const humanTiles=dealActive&&!G.dealFaceReveal
    ? renderDealHandRows(
      Array.from({length:dealCount},()=>null),
      ()=>tileHTML(null,'lg',true),
      3
    )
    : p0.hand.map((t,i)=>{
    if(suspenseMask&&i===kt.drawIdx){
      return tileHTML(null,'lg kt-mystery kouting-tile',true);
    }
    const isWait=waits.some(w=>tileEq(w,t));
    const isDrawn=(G.lastDrawn&&t===G.lastDrawn)||(p0.drawnTile&&t===p0.drawnTile);
    const isLocked=p0.kouTing;
    let cls=`lg hand-face`;
    if(isWait) cls+=' tenpai-glow';
    if(isDrawn) cls+=' just-drawn';
    if(drawnIdx0===i&&drawnIdx0>=0) cls+=' tsumo-separated';
    if(revealPop&&i===kt.drawIdx) cls+=' kt-reveal-pop';
    if(isLocked) cls+=' kouting-tile';
    if(kouTingMayDiscard) cls+=ktLeg.includes(i)?' kt-discardable':' kt-discard-locked';
    else if(kouTingPick&&ktEntry.includes(i)) cls+=' kt-discardable';
    else if(kouTingPick) cls+=' kt-discard-locked';
    return tileHTML(t,cls,false,null,`data-hand-i="${i}"`);
  }).join('');
  const humanMelds=renderMeldGroups(p0.melds,HUMAN_MELD_TILE_CLS);
  const humanDiscards=renderDiscardStrip(p0.discards,'human',HUMAN_RIVER_TILE_CLS,pendingForStrip);

  // === ACTION BUTTONS ===
  let buttons='';
  if(!G.dealCinemaActive){
  if(G.phase==='draw'&&G.turn===0&&G.humanOptions.includes('draw')){
    buttons+=`<button class="btn btn-new" onclick="humanDraw()">${tr('drawTile','牌を引く')} (${G.wall.length}${tr('wallUnit','枚')})</button>`;
  }
  if(G.phase==='discard'&&G.turn===0){
    const canKtDraw=G.online
      ?!!onlineLegal('draw')
      :(p0.kouTing&&p0.hand.length===exp0&&!G.ktReveal&&(G.wall.length>0||!G.treasureUsed));
    if(canKtDraw){
      const drawLabel=G.wall.length>0
        ?`${tr('drawTile','牌を引く')} (${G.wall.length}${tr('wallUnit','枚')})`
        :tr('drawTile','牌を引く');
      buttons+=`<button class="btn btn-new" onclick="humanDraw()">${drawLabel}</button>`;
    }
    const turnStartKan=(!p0.kouTing&&!G.discardedThisTurn&&!G.kanBranchBActive&&!G.kanBranchAOpts)?getTurnStartKanOptions(p0):{ankan:[],shouminkan:[]};
    if(G.humanOptions.includes('tsumo'))
      buttons+=`<button class="btn btn-win" onclick="humanWin(true,false)">${tr('tsumo','ツモ！')}</button>`;
    if(G.humanOptions.includes('treasure_win'))
      buttons+=`<button class="btn btn-win" onclick="humanWin(true,true)">${tr('treasureWin','宝中宝！')}</button>`;
    if(!G.online){
      if(G.kanBranchAOpts&&hasPostDrawKanOffer(G.kanBranchAOpts)){
        G.kanBranchAOpts.ankan.forEach(t=>{
          buttons+=`<button class="btn btn-pon" onclick="humanKanAfterDraw('${tileKey(t)}','ankan')">${tr('ankan','暗槓')} ${tileName(t)}</button>`;
        });
        G.kanBranchAOpts.shouminkan.forEach(o=>{
          buttons+=`<button class="btn btn-pon" onclick="humanKanAfterDraw('${tileKey(o.tile)}','shouminkan',${o.meldIndex})">${tr('shouminkan','加槓')} ${tileName(o.tile)}</button>`;
        });
        buttons+=`<button class="btn btn-skip" onclick="humanSkipPostDrawKan()">${tr('kanSkip','カンしない')}</button>`;
      }else if(!G.humanOptions.includes('tsumo')&&!G.humanOptions.includes('treasure_win')){
        turnStartKan.ankan.forEach(t=>{
          buttons+=`<button class="btn btn-pon" onclick="humanAnkan('${tileKey(t)}')">${tr('ankan','暗槓')} ${tileName(t)}</button>`;
        });
        turnStartKan.shouminkan.forEach(o=>{
          buttons+=`<button class="btn btn-pon" onclick="humanShouminkan('${tileKey(o.tile)}',${o.meldIndex},'B')">${tr('shouminkan','加槓')} ${tileName(o.tile)}</button>`;
        });
      }
    }
    if(p0.kouTing&&kouTingMayDiscard&&!G.humanOptions.includes('tsumo')&&!G.humanOptions.includes('treasure_win')){
      buttons+=`<span style="color:#ffd44b;font-size:11px">${tr('ktTapHint','聴牌を保てる牌だけクリック')}</span>`;
    }
    if(!p0.kouTing&&ktEntry.length&&!kouTingPick&&!G.humanOptions.includes('tsumo')&&!G.humanOptions.includes('treasure_win')){
      buttons+=`<button class="btn btn-new" onclick="humanKouTingPick()">${tr('kouting','扣聴')}</button>`;
    }
    if(kouTingPick&&!p0.kouTing){
      buttons+=`<span style="color:#ffd44b;font-size:11px">${tr('kouTingPick','聴に入る牌をタップして捨ててください')}</span>`;
      buttons+=`<button class="btn btn-skip" onclick="humanKouTingPickCancel()">${tr('kouTingPickCancel','通常の捨てに戻る')}</button>`;
    }
    if(!p0.kouTing&&!kouTingPick&&!G.humanOptions.includes('tsumo')&&!G.humanOptions.includes('treasure_win'))
      buttons+=`<span style="color:#ffe;font-size:11px">${tr('clickToDiscard','クリックして捨てる')}</span>`;
  }
  if(G.phase==='after_discard'){
    if(G.humanOptions.includes('win'))
      buttons+=`<button class="btn btn-win" onclick="humanWin(false,false)">${tr('ron','ロン！')} ${tileName(G.pendingDiscard)}</button>`;
    if(G.humanOptions.includes('minkan'))
      buttons+=`<button class="btn btn-minkan" onclick="humanMinkan()">${tr('minkan','大明槓')}</button>`;
    if(G.humanOptions.includes('pon'))
      buttons+=`<button class="btn btn-pon" onclick="humanPon()">${tr('pon','ポン')}</button>`;
    if(G.humanOptions.includes('chi')){
      G.chiOpts.forEach((opt,i)=>{
        const label=sortTiles([...opt,G.pendingDiscard]).map(tileName).join('');
        buttons+=`<button class="btn btn-chi" onclick="humanChi(${i})">${tr('chi','チー')} ${label}</button>`;
      });
    }
    if(G.humanOptions.length>0)
      buttons+=`<button class="btn btn-skip" onclick="humanSkip()">${tr('skip','スキップ')}</button>`;
  }
  if(G.gameOver&&G.lastWin){
    buttons+=`<button class="btn btn-win" onclick="openResultOverlay()">${t('resultAgain')}</button>`;
  }
  const onlineMatch=ONLINE.room?.match;
  const isOnlineHost=G.online&&ONLINE.room&&ONLINE.playerId===ONLINE.room.hostId;
  if(G.online&&G.gameOver&&isOnlineHost&&onlineMatch&&!onlineMatch.finished&&onlineMatch.round<onlineMatch.totalRounds){
    buttons+=`<button class="btn btn-new" onclick="onlineNextHand()">${tr('nextHand','次の局へ')}</button>`;
  }
  }

  // 宝牌は扣聴中または使用済のときだけ表向き（開局から見せるとゲームが壊れる）。
  const treasureFaceKnown=G.treasureUsed||p0.kouTing||G.wall.length===0;
  const treasureTileHtml=treasureFaceKnown?tileHTML(G.treasure,'sm'):tileHTML(null,'sm',true);
  const treasureUsedTag=G.treasureUsed
    ? (UI.lang==='zh'?' <span class="treasure-used">（已用）</span>':' <span class="treasure-used">（使用済）</span>')
    : '';
  const treasureInfo=
    `<div class="treasure-reveal">${tr('treasure','宝牌')}: ${treasureTileHtml}${treasureUsedTag}</div>`;

  const playerLabelByIdx=[sideName(0),sideName(1),sideName(2),sideName(3)];
  const showCallHint = G.phase==='after_discard' && G.humanOptions.length>0 && G.pendingDiscard && G.pendingFrom>=0;
  const pendingTilePopup = showCallHint ? `
    <div class="callout-tile callout-compact" role="status">
      <span><strong>${playerLabelByIdx[G.pendingFrom]}</strong> ${tr('callHintDiscard','の捨て牌')}: <strong>${tileName(G.pendingDiscard)}</strong> · ${tr('callHintAction','に対して行動できます')}</span>
    </div>
  ` : '';
  const dealerRealHub=G.dealerReal??MATCH?.dealer??G.dealer??0;
  const hubPrimary=matchObj
    ? tr('matchRound','第{n} / {t}局').replace('{n}',String(matchObj.round)).replace('{t}',String(matchObj.totalRounds))
    : (UI.lang==='zh'?'单场':'対局');
  const hubSubLine=`${tr('wall','山')} ${G.wall.length}${tr('wallUnit','枚')}`;
  const hubScoreTxt=pi=>{
    const u=UI.lang==='zh'?'分':'点';
    return `${G.scores[pi]}${u}`;
  };
  const hubW=(seat,pos)=>`<div class="hub-wind hub-wind-${pos} ${G.turn===seat?'is-turn':''}" title="${escapeHtmlText(sideName(seat))}">
    ${G.turn===seat?'<span class="hub-turn-arrow" aria-hidden="true"></span>':''}
    <span class="hub-wind-face">${escapeHtmlText(windLabelForView(seat,dealerRealHub))}</span>
    <span class="hub-wind-score">${escapeHtmlText(hubScoreTxt(seat))}</span>
  </div>`;
  const tableHub=`<div class="table-hub" role="group" aria-label="卓心">
    <span class="hub-crosshair" aria-hidden="true"></span>
    <div class="hub-arm hub-arm-n">${hubW(2,'n')}</div>
    <div class="hub-arm hub-arm-w">${hubW(1,'w')}</div>
    <div class="hub-core-wrap"><div class="hub-screen"><div class="hub-line1">${escapeHtmlText(hubPrimary)}</div><div class="hub-line2">${hubSubLine}</div></div></div>
    <div class="hub-arm hub-arm-e">${hubW(3,'e')}</div>
    <div class="hub-arm hub-arm-s">${hubW(0,'s')}</div>
  </div>`;
  const feltWallOrnaments=renderFeltWallOrnaments();

  const showKtNearHint=G.phase==='discard'&&G.turn===0&&!p0.kouTing&&!G.ktReveal&&!G.humanOptions.includes('tsumo')&&!G.humanOptions.includes('treasure_win');
  const ktNearDraws=showKtNearHint?kouTingNearDrawTiles(p0):[];
  const ktNearHint=ktNearDraws.length?`<div class="kt-near-hint">${tr('ktNearDraw','次の引きで扣聴になる牌')}: ${formatKtNearDrawHint(ktNearDraws)}</div>`:'';
  const humanLabelText=`<span class="rim-name">${sideName(0)} ${ktBadge(p0)} ${p0.kouTing?`<span style="color:#ffd44b;font-size:10px">${tr('waiting','待ち')}: ${(p0.waits||waits).map(tileName).join(' ')}</span>`:''}</span>${dealerMark(0)}`;

  const html=`
  <div class="table-shell">
  <div class="table-felt">
  ${feltWallOrnaments}
  <div class="felt-play-column">
  <div id="top-area">
    <div class="top-seat">
      <div class="player-label player-label-rim"><span class="rim-name">${p2.name} ${p2.melds.length>0?'['+p2.melds.length+tr('calledCount','鳴')+']':''} ${ktBadge(p2)}</span>${dealerMark(2)}</div>
      <div class="north-rack-row">
        <div class="tiles-row north-hand-row${dealActive&&!G.dealFaceReveal?' deal-staging':''}">${topHand}</div>
        ${topMelds?`<div class="melds-row north-melds">${topMelds}</div>`:''}
      </div>
      <div class="tiles-row top-discards north-discards">${topDiscards}</div>
    </div>
  </div>
  <div id="middle-area">
    <div id="left-area">
      <div class="side-player">
        <div class="side-main">
          <div class="player-label player-label-rim"><span class="rim-name">${p1.name} ${ktBadge(p1)}</span>${dealerMark(1)}</div>
          <div class="side-rack">
            ${leftHand}
            ${leftMelds?`<div class="melds-row">${leftMelds}</div>`:''}
          </div>
        </div>
        <div class="side-discards-zone">${leftDiscards}</div>
      </div>
    </div>
    <div id="center-area">
      <div id="center-hud">
        ${tableHub}
        <div class="message">${escapeHtmlText(G.msg||"").replace(/\n/g,"<br>")}</div>
        ${G.gameOver&&G.lastWin&&G.lastWin.from!=null&&!G.lastWin.isTsumo?ronRevealBannerHtml(G.lastWin.winner,G.lastWin.from,G.lastWin.tile):''}
        ${pendingTilePopup}
        ${treasureInfo}
      </div>
    </div>
    <div id="right-area">
      <div class="side-player">
        <div class="side-discards-zone">${rightDiscards}</div>
        <div class="side-main">
          <div class="player-label player-label-rim"><span class="rim-name">${p3.name} ${ktBadge(p3)}</span>${dealerMark(3)}</div>
          <div class="side-rack">
            ${rightMelds?`<div class="melds-row">${rightMelds}</div>`:''}
            ${rightHand}
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="bottom-area">
    <div class="player-label-row">
      <div class="player-label player-label-rim" style="font-size:11px">${humanLabelText}</div>
    </div>
    ${ktNearHint}
    <div id="human-discards">${humanDiscards}</div>
    <div class="human-rack-scroll">
    <div class="${humanRackCls}" id="human-rack-wrap" style="${humanRackStyle}">
      <div class="melds-row">${humanMelds}</div>
      <div id="human-hand"${dealActive&&!G.dealFaceReveal?' class="deal-staging"':''}>${humanTiles}</div>
    </div>
    </div>
  </div>
  ${G.online&&ONLINE.sseDisconnected?`<div class="online-sse-banner" role="alert" style="margin:8px 12px;padding:10px 12px;background:rgba(180,40,40,.85);border-radius:8px;color:#fff;font-size:12px;line-height:1.5">
    ${tr('onlineReconnectHint','サーバーとの接続が切れました。ページを再読み込みせずに再接続できます。')}
    <div style="margin-top:8px"><button type="button" class="btn btn-new" onclick="reconnectOnlineSse()">${tr('onlineReconnectBtn','再接続')}</button></div>
  </div>`:''}
  <div id="action-bar">${buttons}<button type="button" class="btn btn-ghost" onclick="leaveToMenu()">${t('backToMenu')}</button></div>
  </div>
  </div>
  </div>
  `;
  document.getElementById('app').innerHTML=html;

  // attach tile click for discard (only when human can choose discard, i.e., not 扣聴)
  if(canHumanDiscard&&!G.kanBranchAOpts&&!G.kanTurnEnding){
    document.querySelectorAll('#human-hand .tile[data-hand-i]').forEach(el=>{
      const i=parseInt(el.getAttribute('data-hand-i'),10);
      if(Number.isNaN(i)) return;
      if(p0.kouTing){
        if(ktLeg.includes(i)) el.onclick=()=>humanDiscard(i);
      }else if(kouTingPick){
        if(ktEntry.includes(i)) el.onclick=()=>humanDiscard(i);
      }else{
        el.onclick=()=>humanDiscard(i);
      }
    });
  }
  armTurnTimer();
}

// ======================================================
// START
// ======================================================
function renderStartScreen(){
  if(G&&!G.online){
    render();
    return;
  }
  if(ONLINE.room?.game&&ONLINE.private){
    renderOnlineOrStart();
    return;
  }
  clearTurnTimer();
  G=null;
  const diffBtn = (key,val)=>`<button class="btn btn-lite ${UI.difficulty===val?'active':''}" onclick="setDifficulty('${val}')">${t(key)}</button>`;
  const langBtn = (label,val)=>`<button class="btn btn-lite ${UI.lang===val?'active':''}" onclick="setLanguage('${val}')">${label}</button>`;
  const onlinePlayers = ONLINE.room ? ONLINE.room.players.map(p=>`${p.seat}:${p.name}${p.connected?'●':'○'}`).join(' / ') : '';
  const isOnlineHost = ONLINE.room&&ONLINE.playerId===ONLINE.room.hostId;
  const onlinePanel = `
    <div class="splash-card">
      <div class="menu-label">${t('online')}</div>
      ${ONLINE.room?`
        <div style="font-size:12px;color:#ffe;line-height:1.6">
          ${t('onlineRoom')}: <strong style="color:#ffd44b;letter-spacing:2px">${ONLINE.room.id}</strong><br>
          ${t('onlineSeat')}: ${ONLINE.seat} / ${ONLINE.status||t('onlineWaiting')}<br>
          ${onlinePlayers}
        </div>
        <div class="menu-row" style="margin-top:8px;">
          ${isOnlineHost&&ONLINE.room.players.length>=2&&ONLINE.room.players.length<=4?`<button class="btn btn-new" onclick="onlineStartRoom()">${t('onlineStart')}</button>`:''}
          ${ONLINE.room&&ONLINE.room.status!=='playing'?`<div style="margin-top:6px;font-size:10px;color:#a8ebc4">${t('onlineAiSeats')}</div>`:''}
        </div>
      `:`
        <div class="menu-row">
          <button class="btn btn-new" onclick="onlineCreateRoom()">${t('onlineCreate')}</button>
          <button class="btn btn-lite" onclick="onlineJoinRoom()">${t('onlineJoin')}</button>
        </div>
      `}
    </div>
  `;
  document.getElementById('app').innerHTML=`
  <div class="splash">
    <h1>${t('title')}</h1>
    <div class="splash-card">
      <div class="menu-label">${t('diff')}</div>
      <div class="menu-row">
        ${diffBtn('easy','easy')}
        ${diffBtn('normal','normal')}
        ${diffBtn('hard','hard')}
      </div>
      <div class="menu-row" style="margin-top:10px;">
        <button class="btn btn-new" onclick="startGame()">${t('start')}</button>
        <button type="button" class="btn btn-ghost" onclick="toggleSettings()">${UI.settingsOpen?t('close'):t('settings')}</button>
      </div>
      ${UI.settingsOpen?`
      <div class="settings-panel">
        <button type="button" class="btn btn-lite" onclick="openRulebook()">${t('rulebook')}</button>
        <div class="menu-row">
          ${langBtn('日本語','ja')}
          ${langBtn('中文','zh')}
        </div>
        <div class="menu-row" style="margin-top:8px;">
          <button type="button" class="btn btn-lite" onclick="setOnlineServerUrl()">${t('onlineSetServer')}</button>
          <button type="button" class="btn btn-lite" onclick="clearOnlineServerUrl()">${t('onlineClearServer')}</button>
        </div>
        <div style="font-size:10px;color:#bde8ff;line-height:1.5;margin-top:6px;word-break:break-all">${UI.apiBase||''}</div>
      </div>
      `:''}
    </div>
    ${onlinePanel}
  </div>
  `;
}
refreshOverlayLocale();
loadUiPrefs();
preloadTileTextures();
renderStartScreen();
</script>
</body>
</html>
