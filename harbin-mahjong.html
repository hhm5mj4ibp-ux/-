// 暗槓・加槓（分岐B: ターン開始・捨て前）→ 嶺上→捨て→本引き
function humanAnkan(tileK){
  if(G?.online){onlineAction('ankan',{tile:tileK});return;}
  if(G.phase!=='discard'||G.turn!==0||G.discardedThisTurn||G.kanBranchBActive||G.kanBranchAOpts) return;
  const p=G.players[0];
  if(p.kouTing) return;
  const t=parseTileKey(tileK);
  if(countTile(p.hand,t)<4) return;
  executeSelfKan(0,{kind:'ankan',tile:t},'B');
}
function humanShouminkan(tileK,meldIndex,branch){
  if(G?.online){onlineAction('shouminkan',{tile:tileK,meldIndex,branch});return;}
  if(G.phase!=='discard'||G.turn!==0) return;
  const p=G.players[0];
  if(p.kouTing) return;
  const t=parseTileKey(tileK);
  const mi=Number(meldIndex);
  if(branch==='A'){
    if(!G.kanBranchAOpts) return;
  }else{
    if(G.discardedThisTurn||G.kanBranchBActive||G.kanBranchAOpts) return;
  }
  const spec={kind:'shouminkan',tile:t,meldIndex:mi};
  const m=p.melds[mi];
  if(!m||m.type!=='pon'||!tileEq(m.calledTile||m.tiles[0],t)||countTile(p.hand,t)<1) return;
  executeSelfKan(0,spec,branch);
}
function humanKanAfterDraw(tileK,kind,meldIndex){
  if(G?.online){onlineAction('kan_after_draw',{tile:tileK,kind,meldIndex});return;}
  if(!G.kanBranchAOpts||G.turn!==0) return;
  const p=G.players[0];
  const t=parseTileKey(tileK);
  if(kind==='ankan'){
    if(!G.kanBranchAOpts.ankan.some(x=>tileEq(x,t))) return;
    executeSelfKan(0,{kind:'ankan',tile:t},'A');
    return;

  humanShouminkan(tileK,meldIndex,'A');
}

    appendDrawToHandRight(p,drawn);

}

function aiMinkan(pi, tile, fromPi){
  const p=G.players[pi];
  if(p.kouTing||countTile(p.hand,tile)<3){
    finalizeAfterDiscardCycle(fromPi);
    return;
  }
  const newHand=removeTiles(p.hand,[tile,tile,tile]);
  if(!newHand){
    finalizeAfterDiscardCycle(fromPi);
    return;
  }
  p.hand=newHand;
  const calledDiscardIdx=markPendingDiscardClaimed();
  p.melds.push({type:'kan',tiles:[tile,tile,tile,tile],from:fromPi,calledTile:tile,calledDiscardIdx});
  addLog(UI.lang==='zh'?`${p.name} 大明杠！${tileName(tile)}`:`${p.name}が${tr('minkan','大明槓')}！${tileName(tile)}`);
  playActionFx('minkan',`${p.name} `,{tile,from:fromPi,actor:pi,meldTiles:[tile,tile,tile,tile]});
  replenishDiscardAfterCall(fromPi);
  G.skipDrawAfterCallBy=pi;
  updateAllTenpai();
  G.turn=pi;
  G.phase='discard';
  scheduleMatch(()=>aiDiscard(pi),600);
}

function aiPon(pi, tile, fromPi){

function aiChi(pi, tile, handPair, fromPi){

function aiDiscard(pi){
  const p=G.players[pi];
  G.discardedThisTurn=true;
  G.kanBranchAOpts=null;
  const lv=aiLevel();
  if(!p.kouTing){
    const entry=kouTingEntryDiscardIndices(p);
    if(entry.length&&Math.random()<(lv.kouTingEnter||0)){
      const pick=lv.smartPick?aiPickKouTingEntryIndex(p,entry):entry[Math.floor(Math.random()*entry.length)];
      if(enterKouTingByDiscard(p,pick)) return;
    }
  }
  const tile=aiFindDiscard(p);
  const idx=p.hand.findIndex(t=>tileEq(t,tile));
  if(idx>=0){
    noteDiscardMeta(pi,tile);
    armDiscardFlight(pi,tile);
    p.hand.splice(idx,1);
  }
  p.hand=sortTiles(p.hand);
  pushPlayerDiscard(p,tile);
  p.drawnTile=null;
  updateAllTenpai();
  addLog(UI.lang==='zh'?`${p.name} 打出${tileName(tile)}`:`${p.name}が${tileName(tile)}を捨てました`);
  GameSFX.play('discard');
  afterDiscard(pi,tile);
  render();
  flushDiscardFlight();
}

function aiFindDiscard(p){
  const lv=aiLevel();
  const hand=p.hand;
  if(p.kouTing){
    const leg=kouTingLegalDiscardIndices(p);
    if(leg.length){
      const idx=aiPickKouTingDiscardIndex(p,leg);
      return p.hand[idx];
    }
  }
  if(Math.random()<(lv.discardNoise||0)) return hand[Math.floor(Math.random()*hand.length)];
  let bestIdx=0,bestScore=Infinity;
  for(let i=0;i<hand.length;i++){
    const tile=hand[i];
    const utility=aiScoreDiscardIndex(p,i);
    const danger=lv.defense?aiDiscardDanger(tile,p.idx):0;
    const noise=lv.smartPick?0:(Math.random()*8);
    const score=-utility+danger+noise;
    if(score<bestScore){bestScore=score;bestIdx=i;}
  }
  return hand[bestIdx];
}

function aiWinTreasure(pi, treasureTile){
  resolveKouTingTreasureDraw(pi,treasureTile);
}

function isDiscarderListening(p){
  if(!p) return false;
  if(p.kouTing) return true;
  return getKatanWaits(p.hand).length>0;
}

function noteDiscardMeta(fromPi, tile){
  if(!G||fromPi==null||fromPi<0) return;
  const p=G.players[fromPi];
  G.lastDiscardMeta={from:fromPi,tile,discarderListening:isDiscarderListening(p)};
}

/** 宝中宝: 各家 basePts（デフォルト12＝ツモ4点の3倍） */
function getTreasureScoreDeltas(winnerSeat, basePts=12){
  const d=[0,0,0,0];
  d[winnerSeat]=basePts*3;
  for(let s=0;s<4;s++) if(s!==winnerSeat) d[s]=-basePts;
  return d;
}

function getTsumoScoreDeltas(winnerSeat, basePts=4){
  const d=[0,0,0,0];
  d[winnerSeat]=basePts*3;
  for(let s=0;s<4;s++) if(s!==winnerSeat) d[s]=-basePts;
  return d;
}

/** 哈尔滨: 听牌放炮は各家−2、未听牌放炮（出冲）は放炮者のみ−6 */
function getRonScoreDeltas(winnerSeat, fromSeat, discarderListening, basePts=2){
  const d=[0,0,0,0];
  d[winnerSeat]=basePts*3;
  if(discarderListening){
    for(let s=0;s<4;s++) if(s!==winnerSeat) d[s]=-basePts;
  }else{
    d[fromSeat]=-basePts*3;
  }
  return d;
}

function applyScoreDeltas(deltas){
  for(let s=0;s<4;s++) G.scores[s]+=deltas[s];
  if(MATCH) MATCH.scores=G.scores;
}

function formatScoreDeltaLine(seat,delta){
  const sign=delta>0?`+${delta}`:String(delta);
  return `${sideName(seat)} ${sign}`;
}

function buildWinScoreDetail(winnerSeat, deltas, isTsumo, fromSeat, discarderListening){
  const lines=[formatScoreDeltaLine(winnerSeat,deltas[winnerSeat])];
  if(isTsumo){
    for(let s=0;s<4;s++) if(s!==winnerSeat) lines.push(formatScoreDeltaLine(s,deltas[s]));
  }else if(discarderListening){
    lines.push(UI.lang==='zh'?tr('ronScoreListening','听牌放炮（各家−2分）'):tr('ronScoreListening','听牌放炮（各家−2点）'));
    for(let s=0;s<4;s++) if(s!==winnerSeat) lines.push(formatScoreDeltaLine(s,deltas[s]));
  }else{
    lines.push(UI.lang==='zh'?tr('ronScoreBao','未听牌放炮·包两家（放铳者−6分）'):tr('ronScoreBao','未听牌放炮・包两家（放銃者−6点）'));
    lines.push(formatScoreDeltaLine(fromSeat,deltas[fromSeat]));
    for(let s=0;s<4;s++) if(s!==winnerSeat&&s!==fromSeat&&deltas[s]) lines.push(formatScoreDeltaLine(s,deltas[s]));
  }
  return lines.join('\n');
}

function ronRevealLabel(){
  return UI.lang==='zh'?tr('dianpao','点炮'):tr('fangpao','放銃');
}

function ronRevealBannerHtml(winnerSeat, fromSeat, tile){
  if(fromSeat==null||fromSeat<0) return '';
  const who=sideName(fromSeat);
  const winner=sideName(winnerSeat);
  const line=tr('ronFromLine','{who}が{tile}を放銃 → {winner}がロン')
    .replace('{who}',who).replace('{tile}',tileName(tile)).replace('{winner}',winner);
  return `<div class="ron-reveal-banner" role="status"><strong>${escapeHtmlText(ronRevealLabel())}</strong> ${escapeHtmlText(line)}</div>`;

function seatAnchorRonDiscard(fromPi, tile){
  const root=discardRiverRoot(fromPi);
  const area=root?document.querySelector(root):document.querySelector(MELD_FX_SEAT_ROOT[fromPi]);
  if(!area||!tile) return null;
  const cells=area.querySelectorAll('.discard-cell.ron-fired');
  if(cells.length){
    const r=cells[0].getBoundingClientRect();
    return {x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height};
  }
  const key=tileKey(tile);
  for(const cell of area.querySelectorAll('.discard-cell.is-claimed')){
    const img=cell.querySelector('.tile');
    if(!img) continue;
    if(cell.getAttribute('data-tile-key')===key||cell.classList.contains('ron-fired')){
      const r=cell.getBoundingClientRect();
      return {x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height};
    }
  }
  return seatAnchorRect(fromPi,'discard');
}

let _ronCineTimer=null;
/** 自家がロン/ツモ/宝中宝を選んだ瞬間のド派手な全画面演出。終了後に cb（結果オーバーレイ）を呼ぶ。 */
function playHumanWinCinema({kanji='和',label='ロン！',points=0,tile=null,cb,kind='ron'}={}){
  const root=document.getElementById('ron-cinema');
  if(!root){ cb&&cb(); return; }
  clearTimeout(_ronCineTimer);
  root.classList.remove('cine-tsumo','cine-treasure','cine-ron');
  root.classList.add(kind==='treasure'?'cine-treasure':kind==='tsumo'?'cine-tsumo':'cine-ron');
  const kEl=document.getElementById('ron-cine-kanji');
  const lEl=document.getElementById('ron-cine-label');
  const pEl=document.getElementById('ron-cine-points');
  const tEl=document.getElementById('ron-cine-tile');
  const pars=document.getElementById('ron-cine-particles');
  if(kEl) kEl.textContent=kanji;
  if(lEl) lEl.textContent=label;
  if(pEl) pEl.textContent=points?`+${points}${UI.lang==='zh'?'分':'点'}`:'';
  if(tEl) tEl.innerHTML=tile?tileHTML(tile,'lg'):'';
  if(pars){
    const cols=['#ffd84b','#ff5a28','#36d07a','#3aa0ff','#fff2b0','#ff8fb0'];
    pars.innerHTML=Array.from({length:42},()=>{
      const left=(Math.random()*100).toFixed(2);
      const col=cols[(Math.random()*cols.length)|0];
      const dur=(1.8+Math.random()*1.4).toFixed(2);
      const delay=(Math.random()*.5).toFixed(2);
      const w=(6+Math.random()*7).toFixed(0);
      const h=(10+Math.random()*12).toFixed(0);
      return `<span class="ron-cine-confetti" style="left:${left}%;width:${w}px;height:${h}px;background:${col};--cf-dur:${dur}s;--cf-delay:${delay}s"></span>`;
    }).join('');
  }
  root.classList.remove('hidden');
  root.setAttribute('aria-hidden','false');
  // reflow then trigger animations
  void root.offsetWidth;
  root.classList.add('show');
  document.body.classList.add('ron-cine-shake');
  try{ GameSFX.play('win'); }catch(_e){}
  fxVibrate([40,60,40,60,160]);
  setTimeout(()=>{ try{ GameSFX.play('win'); }catch(_e){} },360);

    root.classList.remove('show');
    root.classList.add('hidden');
    root.setAttribute('aria-hidden','true');
    document.body.classList.remove('ron-cine-shake');
    if(pars) pars.innerHTML='';
    cb&&cb();
  },2400);
}

function resolveWin(pi, tile, isTsumo, isTreasure){
  G.gameOver=true;
  G.roundOver=true;
  G.handsRevealed=true;
  GameSFX.play('win');
  fxVibrate([35,85,35,85,140]);
  const p=G.players[pi];
  const fromPi=!isTsumo&&!isTreasure
    ?(G.lastDiscardMeta?.from ?? G.pendingFrom)
    :-1;
  const discarderListening=fromPi>=0
    ?(G.lastDiscardMeta?.discarderListening ?? isDiscarderListening(G.players[fromPi]))
    :false;
  if(!isTsumo&&!isTreasure) markPendingDiscardClaimed();

  let deltas;
  let totalPts;
  if(isTreasure){
    deltas=getTreasureScoreDeltas(pi,12);
    totalPts=deltas[pi];
  }else if(isTsumo){
    deltas=getTsumoScoreDeltas(pi,4);
    totalPts=deltas[pi];
  }else{
    deltas=getRonScoreDeltas(pi,fromPi,discarderListening,2);
    totalPts=deltas[pi];
  }
  applyScoreDeltas(deltas);

  const method=isTreasure?tr('treasureWin','宝中宝！'):isTsumo?tr('tsumo','ツモ！'):tr('ron','ロン！');
  const winnerName=p.isHuman?sideName(0):p.name;
  const fromName=fromPi>=0?sideName(fromPi):null;
  const scoreLines=buildWinScoreDetail(pi,deltas,isTsumo,fromPi,discarderListening);
  const sourceText=UI.lang==='zh'
    ?(isTsumo?`支付: 三家各−4分`:fromName?`${tr('dianpao','点炮')}: ${fromName}（${tileName(tile)}）`:'')
    :(isTsumo?`支払い: 他家各−4点`:fromName?`${tr('fangpao','放銃')}: ${fromName}（${tileName(tile)}）`:'');
  const meldText=p.melds.length?p.melds.map(m=>`${m.type.toUpperCase()}[${m.tiles.map(tileName).join(' ')}]`).join('  '):(UI.lang==='zh'?'无':'なし');
  const totalLine=UI.lang==='zh'
    ?`${tr('matchTotal','合计分')}: ${scoreSummaryText()}`
    :`${tr('matchTotal','合計点')}: ${scoreSummaryText()}`;
  const detail=UI.lang==='zh'
    ?[
      `和牌: ${tileName(tile)}`,
      `方式: ${method}`,
      sourceText,
      `手牌: ${tilesText(p.hand)}`,
      `副露: ${meldText}`,
      `得分:\n${scoreLines}`,
      totalLine,
    ].join('\n')
    :[
      `和了牌: ${tileName(tile)}`,
      `和了方法: ${method}`,
      sourceText,
      `手牌: ${tilesText(p.hand)}`,
      `副露: ${meldText}`,
      `得点:\n${scoreLines}`,
      totalLine,
    ].join('\n');
  G.lastWin={
    winner:pi,
    tile,
    method,
    points:totalPts,
    from:fromPi>=0?fromPi:null,
    discarderListening,
    isTsumo:!!isTsumo,
    isTreasure:!!isTreasure,
    scoreDeltas:deltas,
    detail,
  };
  G.msg=UI.lang==='zh'
    ?`${winnerName} ${method} ${tileName(tile)} (+${totalPts}分)${fromName?`\n${tr('dianpao','点炮')}: ${fromName}`:''}`
    :`${winnerName} ${method} ${tileName(tile)} (+${totalPts}点)${fromName?`\n${tr('fangpao','放銃')}: ${fromName}`:''}`;
  const body=UI.lang==='zh'
    ?`${method} +${totalPts}分  和牌: ${tileName(tile)}\n${totalLine}`
    :`${method} +${totalPts}点  和了牌: ${tileName(tile)}\n${totalLine}`;
  render();
  const finishWin=()=>showOverlay(`${winnerName}${t('winTitle')}`,body,detail);
  const humanWinner=(pi===0);
  const isRon=!isTsumo&&!isTreasure&&fromPi>=0;
  if(isRon){
    playRonRevealFx(pi,fromPi,tile);
    if(humanWinner){
      playHumanWinCinema({kanji:'和',label:tr('ron','ロン！'),points:totalPts,tile,kind:'ron',cb:finishWin});
    }else{
      scheduleMatch(finishWin,1200);
    }
  }else if(humanWinner){
    const winKanji=isTreasure?'宝':isTsumo?'摸':'和';
    const kind=isTreasure?'treasure':isTsumo?'tsumo':'ron';
    playHumanWinCinema({kanji:winKanji,label:method,points:totalPts,tile,kind,cb:finishWin});
  }else{
    finishWin();
  }
}

function chunkEvery(arr,n){
  const out=[];
  for(let i=0;i<arr.length;i+=n) out.push(arr.slice(i,i+n));
  return out;
}
function feltWallTierLen(){
  if(!G||!Array.isArray(G.wall)) return 10;
  return Math.min(18,Math.max(8,Math.floor(G.wall.length/6)+2));
}
function renderFeltWallOrnaments(){
  return '';

function renderDiscardStrip(tiles, cls, size='xs', pendingFromSeat=null){
  const list=tiles||[];
  const tileCls=size;
  const stripCls=`discard-strip ${cls}`;
  const seatByCls={'opp-top':2,left:1,right:3,human:0};
  const stripSeat=Object.prototype.hasOwnProperty.call(seatByCls,cls)?seatByCls[cls]:-1;
  const lastIdx=list.length-1;
  const pinPending=G&&G.phase==='after_discard'&&G.pendingDiscard&&pendingFromSeat!=null&&stripSeat===pendingFromSeat;
  const ronWin=G&&G.lastWin&&!G.lastWin.isTsumo&&!G.lastWin.isTreasure&&G.lastWin.from!=null?G.lastWin:null;
  const ronLabel=ronRevealLabel();
  let flat=0;
  const cellHtml=entry=>{
    const d=normalizeDiscardEntry(entry);
    const cls2=tileCls+(d.claimed?' discard-claimed':'');
    const isPin=pinPending&&flat===lastIdx&&tileEq(d.tile,G.pendingDiscard);
    const isRonFired=!!(ronWin&&stripSeat===ronWin.from&&d.claimed&&tileEq(d.tile,ronWin.tile));
    flat++;
    const cw=(d.claimed?' discard-cell is-claimed':' discard-cell')+(isPin?' discard-pending-target':'')+(isRonFired?' ron-fired':'');
    const ronAttr=isRonFired?` data-ron-label="${escapeHtmlText(ronLabel)}" data-tile-key="${tileKey(d.tile)}"`:` data-tile-key="${tileKey(d.tile)}"`;
    return `<div class="${cw}"${ronAttr}>${tileHTML(d.tile,cls2)}</div>`;
  };
  const rowCap=(cls==='left'||cls==='right')?3:6;
  if(!list.length){
    return `<div class="discard-river-mat is-empty"><div class="${stripCls}"></div></div>`;
  }
  const rows=chunkEvery(list,rowCap);
  const inner=rows.map(row=>`<div class="discard-row discard-row-6${rowCap===3?' discard-row-3':''}">${row.map(cellHtml).join('')}</div>`).join('');
  return `<div class="discard-river-mat"><div class="${stripCls}">${inner}</div></div>`;
}

function renderSeatHand(p, faceSize, side=false, seatStyle=null){
  const reveal=!!(G&&G.roundOver&&G.handsRevealed);
  const cinema=!!(G&&G.dealCinemaActive);
  const count=cinema&&G.dealRevealCounts?Math.min(G.dealRevealCounts[p.idx]||0,p.hand.length):p.hand.length;

  const eastCls=EAST_HAND_TILE_CLS;
  const westCls=WEST_HAND_TILE_CLS;
  if(cinema){
    const humanFlip=p.isHuman&&G.dealFaceReveal;
    const renderTile=t=>{
      if(humanFlip||reveal){
        if(seatStyle==='north') return tileHTML(t,HUMAN_RIVER_TILE_CLS);
        if(seatStyle==='east') return tileHTML(t,eastCls);
        if(seatStyle==='west') return tileHTML(t,westCls);
        return tileHTML(t,(side?'side-xs':faceSize)+hf);
      }
      if(seatStyle==='east') return tileHTML(null,eastCls,true);
      if(seatStyle==='west') return tileHTML(null,westCls,true);
      return tileHTML(null,side?'side-xs':faceSize+(p.kouTing?' kouting-tile':''),true);
    };
    if(count<=0) return '';
    // 左右席は縦1列（deal-staging 列）を維持、自家・対面（北）は横1列で着地させる
    if(side) return renderDealHandRows(tiles,renderTile,3);
    return tiles.map(renderTile).join('');
  }
  if(side){
    const backCls=seatStyle==='east'?eastCls:westCls;
    return tiles.map(t=>{
      if(reveal){
        if(seatStyle==='east') return tileHTML(t,eastCls);
        if(seatStyle==='west') return tileHTML(t,westCls);
      }
      return tileHTML(null,backCls+(p.kouTing?' kouting-tile':''),true);
    }).join('');
  }
  if(seatStyle==='north'){
    const cls=HUMAN_RIVER_TILE_CLS;
    return tiles.map(t=>reveal?tileHTML(t,cls):tileHTML(null,cls+(p.kouTing?' kouting-tile':''),true)).join('');
  }
  return tiles.map(t=>reveal?tileHTML(t,faceSize+hf):tileHTML(null,faceSize+(p.kouTing?' kouting-tile':''),true)).join('');
}

function normalizeDiscardEntry(entry){
  if(entry&&typeof entry==='object'&&entry.tile) return {tile:entry.tile,claimed:!!entry.claimed};
  return {tile:entry,claimed:false};
}

function pushPlayerDiscard(player,tile){
  player.discards.push({tile,claimed:false});
}

function markPendingDiscardClaimed(){
  if(!G||G.pendingFrom==null||G.pendingFrom<0) return null;
  const donor=G.players[G.pendingFrom];
  if(!donor||!donor.discards.length) return null;
  const idx=donor.discards.length-1;
  const entry=normalizeDiscardEntry(donor.discards[idx]);
  donor.discards[idx]={tile:entry.tile,claimed:true};
  return idx;
}

function syncDiscardClaimsFromMelds(players){
  players.forEach(p=>{
    p.discards=(p.discards||[]).map(entry=>{
      const e=normalizeDiscardEntry(entry);
      return {tile:e.tile,claimed:false};
    });
  });
  players.forEach(claimer=>{
    (claimer.melds||[]).forEach(m=>{
      if(m.concealed||m.type==='ankan') return;
      if(m.from==null&&m.from!==0) return;
      const donor=players[m.from];
      if(!donor) return;
      if(m.calledDiscardIdx!=null&&donor.discards[m.calledDiscardIdx]!=null){
        const entry=normalizeDiscardEntry(donor.discards[m.calledDiscardIdx]);
        donor.discards[m.calledDiscardIdx]={tile:entry.tile,claimed:true};
        return;
      }
      const called=m.calledTile||m.tiles[0];
      for(let i=donor.discards.length-1;i>=0;i--){
        const entry=normalizeDiscardEntry(donor.discards[i]);
        if(entry.claimed) continue;
        if(tileEq(entry.tile,called)){
          donor.discards[i]={tile:entry.tile,claimed:true};
          break;
        }
      }
    });
  });
}

    return `<div class="meld-group">${m.tiles.map(t=>{
      const riverTag=tagRiverCalled&&called&&tileEq(t,called)?' meld-from-river':'';
      return tileHTML(t,tileCls+riverTag);
    }).join('')}</div>`;
  }).join('');
}

  return melds.map(m=>{

function render(){
  if(!G) return;
  document.body.classList.add('playing');
  if(G.kouTingTreasurePending&&!canOfferKouTingTreasureNow(0)){
    G.kouTingTreasurePending=false;
    G.kouTingTreasureSeen=false;
  }

  const pendingForStrip=(G.phase==='after_discard'&&G.pendingFrom!=null&&G.pendingFrom>=0)?G.pendingFrom:null;

  // === TOP PLAYER (p2, 北・対面) ===
  const topHand=renderSeatHand(p2,HUMAN_RIVER_TILE_CLS,false,'north');
  const topMelds=renderMeldGroups(p2.melds,HUMAN_RIVER_TILE_CLS);
  const topDiscards=renderDiscardStrip(p2.discards,'opp-top',HUMAN_RIVER_TILE_CLS,pendingForStrip);

  const leftDiscards=renderDiscardStrip(p1.discards,'left',HUMAN_RIVER_TILE_CLS,pendingForStrip);

  // === RIGHT PLAYER (p3, 東) ===
  const rightHand=`<div class="side-col${dealActive?' deal-staging':''}">${renderSeatHand(p3,'',true,'east')}</div>`;
  const rightMelds=p3.melds.length?renderSideMeldGroups(p3.melds,'right'):'';
  const rightDiscards=renderDiscardStrip(p3.discards,'right',HUMAN_RIVER_TILE_CLS,pendingForStrip);

  // === HUMAN (p0) ===
  const waits=p0.waits&&p0.waits.length?p0.waits:getKatanWaits(p0.hand);
  const exp0=expectedHandCount(p0);
  const kouTingMayDiscard=p0.kouTing&&G.phase==='discard'&&G.turn===0&&p0.hand.length>exp0&&!G.ktReveal;
  const ktEntry=!p0.kouTing
    ?(G.online?(G.kouTingEntryIdx||[]):kouTingEntryDiscardIndices(p0))
    :[];
  const kouTingPick=!!G.kouTingPick;
  const canHumanDiscard=G.phase==='discard'&&G.turn===0&&(!p0.kouTing||kouTingMayDiscard)&&!G.kouTingTreasurePending&&!G.dealCinemaActive;

  }
  const ktLeg=kouTingMayDiscard?kouTingLegalDiscardIndices(p0):[];
  const kt=G.ktReveal;
  const suspenseMask=!!(kt&&kt.phase==='suspense'&&kt.pi===0&&p0.kouTing&&Number.isInteger(kt.drawIdx));
  const revealPop=!!(kt&&kt.phase==='reveal'&&kt.pi===0&&p0.kouTing&&Number.isInteger(kt.drawIdx));
  const humanRackCls='human-rack'+(suspenseMask?' kt-rack-pulse':'');
  const dealCount=dealActive&&G.dealRevealCounts?Math.min(G.dealRevealCounts[0]||0,p0.hand.length):p0.hand.length;
  const drawnRef0=p0.drawnTile||(G.lastDrawn&&p0.hand.some(t=>t===G.lastDrawn)?G.lastDrawn:null);
  const drawnIdx0=drawnRef0?handIndexOfTileRef(p0,drawnRef0):-1;
  const humanMeldTileCount=(p0.melds||[]).reduce((n,m)=>n+(m.tiles?m.tiles.length:0),0);
  const humanRackSlots=Math.max(13,humanMeldTileCount+p0.hand.length);
  const humanRackStyle=`--human-rack-slots:${humanRackSlots}`;
  const tableFeltStyle=`--human-rack-slots:${humanRackSlots}`;
  const humanTiles=dealActive&&!G.dealFaceReveal
    ? Array.from({length:dealCount},()=>tileHTML(null,'lg',true)).join('')
    : p0.hand.map((t,i)=>{
    if(suspenseMask&&i===kt.drawIdx){
      return tileHTML(null,'lg kt-mystery kouting-tile',true);
    }
    const isWait=waits.some(w=>tileEq(w,t));
    const isDrawn=(G.lastDrawn&&t===G.lastDrawn)||(p0.drawnTile&&t===p0.drawnTile);
    const isLocked=p0.kouTing;
    let cls=`lg hand-face`;
    if(isWait) cls+=' tenpai-glow';
    if(isDrawn) cls+=' just-drawn';
    if(drawnIdx0===i&&drawnIdx0>=0) cls+=' tsumo-separated';
    if(revealPop&&i===kt.drawIdx) cls+=' kt-reveal-pop';
    if(isLocked) cls+=' kouting-tile';
    if(kouTingMayDiscard) cls+=ktLeg.includes(i)?' kt-discardable':' kt-discard-locked';
    else if(kouTingPick&&ktEntry.includes(i)) cls+=' kt-discardable';
    else if(kouTingPick) cls+=' kt-discard-locked';
    if(canHumanDiscard&&UI.handSelectIdx===i) cls+=' selected';
    return tileHTML(t,cls,false,null,`data-hand-i="${i}"`);
  }).join('');
  const humanMelds=renderMeldGroups(p0.melds,HUMAN_MELD_TILE_CLS);
  const humanDiscards=renderDiscardStrip(p0.discards,'human',HUMAN_RIVER_TILE_CLS,pendingForStrip);

  // === ACTION BUTTONS ===
  let buttons='';
  if(!G.dealCinemaActive){
  if(G.phase==='draw'&&G.turn===0&&G.humanOptions.includes('draw')){
    buttons+=`<button class="btn btn-new" onclick="humanDraw()">${tr('drawTile','牌を引く')} (${G.wall.length}${tr('wallUnit','枚')})</button>`;
  }
  if(G.phase==='discard'&&G.turn===0&&G.kouTingTreasurePending){
    if(!G.kouTingTreasureSeen){
      buttons+=`<button class="btn btn-new" onclick="humanRevealKouTingTreasure()">${tr('revealTreasure','宝を見る')}</button>`;
    }else{
      buttons+=`<button class="btn btn-win" onclick="humanClaimKouTingTreasure()">${tr('treasureWin','宝中宝！')}</button>`;
    }
  }
  if(G.phase==='discard'&&G.turn===0&&!G.kouTingTreasurePending){
    const canKtDraw=G.online
      ?!!onlineLegal('draw')
      :(p0.kouTing&&p0.hand.length===exp0&&!G.ktReveal&&!G.kouTingTreasurePending&&(G.wall.length>0||!G.treasureUsed));
    if(canKtDraw){
      const drawLabel=G.wall.length>0
        ?`${tr('drawTile','牌を引く')} (${G.wall.length}${tr('wallUnit','枚')})`
        :tr('drawTile','牌を引く');
      buttons+=`<button class="btn btn-new" onclick="humanDraw()">${drawLabel}</button>`;
    }
    const turnStartKan=(!p0.kouTing&&!G.discardedThisTurn&&!G.kanBranchBActive&&!G.kanBranchAOpts)?getTurnStartKanOptions(p0):{ankan:[],shouminkan:[]};
    if(G.humanOptions.includes('tsumo'))
      buttons+=`<button class="btn btn-win" onclick="humanWin(true,false)">${tr('tsumo','ツモ！')}</button>`;
    if(G.humanOptions.includes('reveal_treasure'))
      buttons+=`<button class="btn btn-new" onclick="humanRevealKouTingTreasure()">${tr('revealTreasure','宝を見る')}</button>`;
    if(G.humanOptions.includes('treasure_win')&&!G.kouTingTreasurePending)
      buttons+=`<button class="btn btn-win" onclick="humanWin(true,true)">${tr('treasureWin','宝中宝！')}</button>`;
    if(!G.online){
      if(G.kanBranchAOpts&&hasPostDrawKanOffer(G.kanBranchAOpts)){
        G.kanBranchAOpts.ankan.forEach(t=>{
          buttons+=`<button class="btn btn-pon" onclick="humanKanAfterDraw('${tileKey(t)}','ankan')">${tr('ankan','暗槓')} ${tileName(t)}</button>`;
        });
        G.kanBranchAOpts.shouminkan.forEach(o=>{
          buttons+=`<button class="btn btn-pon" onclick="humanKanAfterDraw('${tileKey(o.tile)}','shouminkan',${o.meldIndex})">${tr('shouminkan','加槓')} ${tileName(o.tile)}</button>`;
        });
        buttons+=`<button class="btn btn-skip" onclick="humanSkipPostDrawKan()">${tr('kanSkip','カンしない')}</button>`;
      }else if(!G.humanOptions.includes('tsumo')&&!G.humanOptions.includes('treasure_win')){
        turnStartKan.ankan.forEach(t=>{
          buttons+=`<button class="btn btn-pon" onclick="humanAnkan('${tileKey(t)}')">${tr('ankan','暗槓')} ${tileName(t)}</button>`;
        });
        turnStartKan.shouminkan.forEach(o=>{
          buttons+=`<button class="btn btn-pon" onclick="humanShouminkan('${tileKey(o.tile)}',${o.meldIndex},'B')">${tr('shouminkan','加槓')} ${tileName(o.tile)}</button>`;
        });
      }
    }
    if(p0.kouTing&&kouTingMayDiscard&&!G.kouTingTreasurePending&&!G.humanOptions.includes('tsumo')&&!G.humanOptions.includes('treasure_win')){
      buttons+=`<span style="color:#ffd44b;font-size:11px">${tr('ktTapHint','聴牌を保てる牌だけクリック')}</span>`;
    }
    if(!p0.kouTing&&ktEntry.length&&!kouTingPick&&!G.humanOptions.includes('tsumo')&&!G.humanOptions.includes('treasure_win')){
      buttons+=`<button class="btn btn-new" onclick="humanKouTingPick()">${tr('kouting','扣聴')}</button>`;
    }
    if(kouTingPick&&!p0.kouTing){
      buttons+=`<span style="color:#ffd44b;font-size:11px">${tr('kouTingPick','聴に入る牌をタップして捨ててください')}</span>`;
      buttons+=`<button class="btn btn-skip" onclick="humanKouTingPickCancel()">${tr('kouTingPickCancel','通常の捨てに戻る')}</button>`;
    }
  }
  if(G.phase==='after_discard'){
    if(G.humanOptions.includes('win'))
      buttons+=`<button class="btn btn-win" onclick="humanWin(false,false)">${tr('ron','ロン！')} ${tileName(G.pendingDiscard)}</button>`;
    if(G.humanOptions.includes('minkan'))
      buttons+=`<button class="btn btn-minkan" onclick="humanMinkan()">${tr('minkan','大明槓')}</button>`;
    if(G.humanOptions.includes('pon'))
      buttons+=`<button class="btn btn-pon" onclick="humanPon()">${tr('pon','ポン')}</button>`;
    if(G.humanOptions.includes('chi')){
      G.chiOpts.forEach((opt,i)=>{
        const label=sortTiles([...opt,G.pendingDiscard]).map(tileName).join('');
        buttons+=`<button class="btn btn-chi" onclick="humanChi(${i})">${tr('chi','チー')} ${label}</button>`;
      });
    }
    if(G.humanOptions.length>0)
      buttons+=`<button class="btn btn-skip" onclick="humanSkip()">${tr('skip','スキップ')}</button>`;
  }
  if(G.gameOver&&G.lastWin){
    buttons+=`<button class="btn btn-win" onclick="openResultOverlay()">${t('resultAgain')}</button>`;
  }
  const onlineMatch=ONLINE.room?.match;
  const isOnlineHost=G.online&&ONLINE.room&&ONLINE.playerId===ONLINE.room.hostId;
  if(G.online&&G.gameOver&&isOnlineHost&&onlineMatch&&!onlineMatch.finished&&onlineMatch.round<onlineMatch.totalRounds){
    buttons+=`<button class="btn btn-new" onclick="onlineNextHand()">${tr('nextHand','次の局へ')}</button>`;
  }
  }

  // 宝牌は扣聴中（宝中宝待ちの「宝を見る」前は伏せ）・使用済・山切れで表向き
  const treasureFaceKnown=G.treasureUsed||G.wall.length===0
    ||(p0.kouTing&&!G.kouTingTreasurePending)
    ||(G.kouTingTreasurePending&&G.kouTingTreasureSeen);
  const treasureTileHtml=treasureFaceKnown?tileHTML(G.treasure,'sm'):tileHTML(null,'sm',true);
  const treasureUsedTag=G.treasureUsed
    ? (UI.lang==='zh'?' <span class="treasure-used">（已用）</span>':' <span class="treasure-used">（使用済）</span>')
    : '';
  const treasureInfo=
    `<div class="treasure-reveal mj-dish" title="${tr('treasure','宝牌')}">${tr('treasure','宝牌')}${treasureTileHtml}${treasureUsedTag}</div>`;

  const playerLabelByIdx=[sideName(0),sideName(1),sideName(2),sideName(3)];
  const showCallHint = G.phase==='after_discard' && G.humanOptions.length>0 && G.pendingDiscard && G.pendingFrom>=0;
  const pendingTilePopup = showCallHint
    ? `<span class="callout-tile callout-compact" role="status"><strong>${playerLabelByIdx[G.pendingFrom]}</strong>${tr('callHintDiscard','の捨て牌')} <strong>${tileName(G.pendingDiscard)}</strong> ${tr('callHintAction','に対して行動できます')}</span>`
    : '';
  const slipHtml = !showCallHint && (G.msg||'').trim()
    ? `<div class="message mj-slip">${escapeHtmlText(G.msg).replace(/\n/g,' ')}</div>`
    : '';
  const tablePrompt = (slipHtml || pendingTilePopup)
    ? `<div id="table-prompt">${slipHtml}${pendingTilePopup}</div>`
    : '';
  const dealerRealHub=G.dealerReal??MATCH?.dealer??G.dealer??0;
  const hubPrimary=matchObj
    ? tr('matchRound','第{n} / {t}局').replace('{n}',String(matchObj.round)).replace('{t}',String(matchObj.totalRounds))
    : (UI.lang==='zh'?'单场':'対局');
  const hubSubLine=`${tr('wall','山')} ${G.wall.length}${tr('wallUnit','枚')}`;
  const hubScoreTxt=pi=>{
    const u=UI.lang==='zh'?'分':'点';
    return `${G.scores[pi]}${u}`;
  };
  const seatPlateHtml=(viewSeat, extra='')=>{
    const p=G.players[viewSeat];
    const isTurn=G.turn===viewSeat;
    const wind=windLabelForView(viewSeat,dealerRealHub);
    const rawName=viewSeat===0?sideName(0):(p.name||'');
    const name=escapeHtmlText(rawName);
    const showName=!!rawName && rawName!==wind;
    const meldHint=viewSeat!==0&&p.melds.length>0?` [${p.melds.length}${tr('calledCount','鳴')}]`:'';
    const dealer=dealerMark(viewSeat);
    return `<div class="player-label player-label-rim seat-plate${isTurn?' is-turn':''}">
      <span class="seat-plate-wind">${escapeHtmlText(wind)}</span>
      ${dealer}
      <span class="seat-plate-body">
        ${showName?`<span class="seat-plate-name rim-name">${name}${meldHint} ${ktBadge(p)}${extra}</span>`:`<span class="seat-plate-name rim-name">${meldHint} ${ktBadge(p)}${extra}</span>`}
        <span class="seat-plate-score">${escapeHtmlText(hubScoreTxt(viewSeat))}</span>
      </span>
    </div>`;
  };
  const tableHub=`<div class="table-hub mj-compass felt-compass" role="group" aria-label="卓心">
    <div class="hub-core-wrap"><div class="hub-screen"><div class="hub-line1">${escapeHtmlText(hubPrimary)}</div><div class="hub-line2">${hubSubLine}</div></div></div>
  </div>`;
  const feltWallOrnaments=renderFeltWallOrnaments();

  const showKtNearHint=G.phase==='discard'&&G.turn===0&&!p0.kouTing&&!G.ktReveal&&!G.humanOptions.includes('tsumo')&&!G.humanOptions.includes('treasure_win');
  const ktNearDraws=showKtNearHint?kouTingNearDrawTiles(p0):[];
  const ktNearHint=ktNearDraws.length?`<div class="kt-near-hint">${tr('ktNearDraw','次の引きで扣聴になる牌')}: ${formatKtNearDrawHint(ktNearDraws)}</div>`:'';
  const ktDiscardHint=kouTingMayDiscard?`<div class="kt-discard-hint">${tr('ktTapHint','聴牌を保てる牌だけクリック')}</div>`:'';
  const humanWaitExtra=p0.kouTing?` <span style="color:#ffd44b;font-size:10px">${tr('waiting','待ち')}: ${(p0.waits||waits).map(tileName).join(' ')}</span>`:'';

  const html=`
  <div class="table-shell mj-table">
  <span class="table-corner tl" aria-hidden="true"></span>
  <span class="table-corner tr" aria-hidden="true"></span>
  <span class="table-corner bl" aria-hidden="true"></span>
  <span class="table-corner br" aria-hidden="true"></span>
  <div class="table-felt" style="${tableFeltStyle}">
  ${feltWallOrnaments}
  <div class="felt-play-column">
  <div id="top-area">
    <div class="top-seat">
      ${seatPlateHtml(2)}
      <div class="north-rack-row">
        <div class="tiles-row north-hand-row${dealActive&&!G.dealFaceReveal?' deal-staging':''}">${topHand}</div>
        ${topMelds?`<div class="melds-row north-melds">${topMelds}</div>`:''}
      </div>
    </div>
  </div>
  <div id="middle-area">
    <div id="left-area">
      <div class="side-player">
        <div class="side-main">
          ${seatPlateHtml(1)}
          <div class="side-rack">
            ${leftHand}
            ${leftMelds?`<div class="melds-row">${leftMelds}</div>`:''}
          </div>
        </div>
      </div>
    </div>
    <div id="center-area" class="felt-heart">
      <div class="tiles-row top-discards north-discards" id="north-discards">${topDiscards}</div>
      <div class="side-discards-zone west-discards" id="left-discards">${leftDiscards}</div>
      <div id="center-hud">
        ${tableHub}
        ${treasureInfo}
      </div>
      <div class="side-discards-zone east-discards" id="right-discards">${rightDiscards}</div>
      <div id="human-discards">${humanDiscards}</div>
    </div>
    <div id="right-area">
      <div class="side-player">
        <div class="side-main">
          ${seatPlateHtml(3)}
          <div class="side-rack">
            ${rightMelds?`<div class="melds-row">${rightMelds}</div>`:''}
            ${rightHand}
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="bottom-area">
    <div class="player-label-row">
      ${seatPlateHtml(0, humanWaitExtra)}
    </div>
    ${ktNearHint}
    ${ktDiscardHint}
    ${tablePrompt}
    ${G.gameOver&&G.lastWin&&G.lastWin.from!=null&&!G.lastWin.isTsumo?ronRevealBannerHtml(G.lastWin.winner,G.lastWin.from,G.lastWin.tile):''}
    <div class="human-rack-scroll">
    <div class="${humanRackCls}" id="human-rack-wrap" style="${humanRackStyle}">
      <div class="melds-row">${humanMelds}</div>
      <div id="human-hand"${dealActive&&!G.dealFaceReveal?' class="deal-staging"':''}>${humanTiles}</div>
    </div>
    </div>
    </div>
  </div>
  </div>
  </div>
  ${G.online&&ONLINE.sseDisconnected?`<div class="online-sse-banner" role="alert" style="margin:8px 12px;padding:10px 12px;background:rgba(180,40,40,.85);border-radius:8px;color:#fff;font-size:12px;line-height:1.5">
    ${tr('onlineReconnectHint','サーバーとの接続が切れました。ページを再読み込みせずに再接続できます。').replace('{code}',ONLINE.room?.id||'—')}
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
      <button type="button" class="btn btn-new" onclick="reconnectOnlineSse()">${tr('onlineReconnectBtn','再接続')}</button>
      ${ONLINE.room?.id?`<button type="button" class="btn btn-lite" onclick="onlineRejoinLastRoom()">${tr('onlineRejoinLast','前回の部屋に参加')}</button>`:''}
    </div>
  </div>`:''}
  <div id="action-bar" class="action-dock"><div class="action-dock-main">${buttons}</div><button type="button" class="btn btn-menu" onclick="leaveToMenu()">${t('backToMenu')}</button></div>
  `;
  document.getElementById('app').innerHTML=html;

  // 1タップ目は選択（ポップアップ）、同じ牌の2タップ目で捨て
  if(canHumanDiscard&&!G.kanBranchAOpts&&!G.kanTurnEnding){
    document.querySelectorAll('#human-hand .tile[data-hand-i]').forEach(el=>{
      const i=parseInt(el.getAttribute('data-hand-i'),10);
      if(Number.isNaN(i)) return;
      const legal=p0.kouTing?ktLeg.includes(i):kouTingPick?ktEntry.includes(i):true;
      if(!legal) return;
      el.onclick=()=>{
        if(UI.handSelectIdx===i){
          humanDiscard(i,el);
          return;
        }
        UI.handSelectIdx=i;
        document.querySelectorAll('#human-hand .tile.selected').forEach(n=>n.classList.remove('selected'));
        el.classList.add('selected');
      };
    });
  }
  armTurnTimer();
}

      ${ONLINE.room?`
        <div style="font-size:12px;color:#ffe;line-height:1.6">

          ${onlinePlayers}

        <div class="menu-row" style="margin-top:8px;">
          ${isOnlineHost&&ONLINE.room.players.length>=2&&ONLINE.room.players.length<=4?`<button class="btn btn-new" onclick="onlineStartRoom()">${t('onlineStart')}</button>`:''}
          ${ONLINE.room&&ONLINE.room.status!=='playing'?`<div style="margin-top:6px;font-size:10px;color:#a8ebc4">${t('onlineAiSeats')}</div>`:''}
        </div>
      `:`

          <button class="btn btn-new" onclick="onlineCreateRoom()">${t('onlineCreate')}</button>
          <button class="btn btn-lite" onclick="onlineJoinRoom()">${t('onlineJoin')}</button>
        </div>
        ${getLastOnlineRoom()?.code?`<div class="menu-row" style="margin-top:6px;"><button type="button" class="btn btn-lite" onclick="onlineRejoinLastRoom()">${t('onlineRejoinLast')} (${getLastOnlineRoom().code})</button></div>`:''}
      `}
    </div>
  `;
  document.getElementById('app').innerHTML=`
  <div class="splash">
    <div class="splash-brand">
      <div class="splash-kicker">HARBIN MAHJONG</div>
      <h1>${t('title')}</h1>
      <p class="splash-sub">${t('tagline')}</p>
    </div>
    <div class="splash-card">
      <div class="menu-label">${t('diff')}</div>
      <div class="menu-row">
        ${diffBtn('easy','easy')}
        ${diffBtn('normal','normal')}
        ${diffBtn('hard','hard')}
      </div>
      <div class="menu-label" style="margin-top:12px;">${t('theme')}</div>
      <div class="theme-row">
        ${themeBtn('themeClassic','classic')}
        ${themeBtn('themeGold','gold')}
        ${themeBtn('themeNight','night')}
      </div>
      <div class="menu-row" style="margin-top:12px;">
        <button class="btn btn-new" onclick="startGame()">${t('start')}</button>
        <button type="button" class="btn btn-ghost" onclick="toggleSettings()">${UI.settingsOpen?t('close'):t('settings')}</button>
      </div>
      <div class="shop-banner">
        ${UI.premium?t('premiumOwned'):t('shopHint')}
        ${UI.shopMsg?`<div class="lock-hint">${escapeHtmlText(UI.shopMsg)}</div>`:''}
        <div class="menu-row" style="margin-top:8px;">
          ${UI.premium?'':`<button type="button" class="btn btn-premium" onclick="buyPremium()">${t('premiumBuy')}</button>`}
          <button type="button" class="btn btn-lite" onclick="restorePremium()">${t('premiumRestore')}</button>

        ${UI.shopEnabled?'':`<div class="lock-hint">${t('premiumSoon')}</div>`}

          <button type="button" class="btn btn-lite" onclick="toggleFxSkip()">${UI.fxSkip?t('fxSkip'):t('fxFull')}</button>

refreshShopConfig().then(()=>{ consumeShopReturn(); renderStartScreen(); }).catch(()=>{});
