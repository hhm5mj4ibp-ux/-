function aiLevel(){
  /** やさしい: 鳴き少なめ・たまにミス打牌。ふつう: 嵌張を意識。むずかしい: 積極鳴き・守備・扣聴判断 */
  if(UI.difficulty==='easy') return {
    pon:0.32,chi:0.22,chiOpen:false,minkan:0.06,kanRate:0.06,
    ronTake:0.65,tsumoTake:0.82,kouTingEnter:0.3,smartPick:false,defense:false,
    discardNoise:0.18,claimBoost:0.85,
  };
  if(UI.difficulty==='hard') return {
    pon:0.9,chi:0.78,chiOpen:true,minkan:0.42,kanRate:0.38,
    ronTake:1,tsumoTake:1,kouTingEnter:0.96,smartPick:true,defense:true,
    discardNoise:0.02,claimBoost:1.2,
  };
  return {
    pon:0.58,chi:0.48,chiOpen:true,minkan:0.18,kanRate:0.16,
    ronTake:0.94,tsumoTake:0.97,kouTingEnter:0.62,smartPick:true,defense:false,
    discardNoise:0.07,claimBoost:1,
  };
}

function aiConcealedCore(hand,exp){
  const h=sortTiles([...hand]);
  if(h.length===exp) return h;
  if(h.length===exp+1) return h.slice(0,exp);
  return h;
}

function aiCountKatanBlocks(hand){
  let n=0;
  for(const suit of ['m','p','s']){
    for(let num=1;num<=7;num++){
      const a={suit,num},b={suit,num:num+2};
      if(hand.some(x=>tileEq(x,a))&&hand.some(x=>tileEq(x,b))) n++;
    }
  }
  return n;
}

/** 嵌張・開門・2色・待ち枚数を意識した手牌評価（高いほど良い） */
function aiHandUtility(p,hand){
  const meldN=p.melds?.length||0;
  const exp=Math.max(1,13-meldN*3);
  const core=aiConcealedCore(hand,exp);
  if(core.length!==exp) return -80;
  let u=meldN*14;
  const waits=getKatanWaits(core);
  u+=waits.length*48;
  if(!meldN) u-=28;
  const all=[...core,...p.melds.flatMap(m=>m.tiles)];
  if(!all.some(t=>t.suit==='z'||t.num===1||t.num===9)) u-=12;
  if(new Set(core.filter(t=>t.suit!=='z').map(t=>t.suit)).size<2&&meldN<2) u-=8;
  u+=aiCountKatanBlocks(core)*7;
  for(const tile of core){
    if(tile.suit==='z'&&countTile(core,tile)===1) u-=3;
    if(tile.suit!=='z'&&countTile(core,tile)>=2){
      const alone=!core.some(x=>x!==tile&&x.suit===tile.suit&&Math.abs(x.num-tile.num)<=2);
      if(alone) u-=2;
    }
  }
  return u;
}

function aiScoreDiscardIndex(p,idx){
  const nh=p.hand.filter((_,j)=>j!==idx);
  const exp=expectedHandCount(p);
  return aiHandUtility(p,nh.length>=exp?nh:nh.slice(0,exp));
}

function aiDiscardDanger(tile,fromPi){
  let d=0;
  const human=G.players[0];
  if(human&&human.idx!==fromPi&&!human.kouTing&&checkWin(human,tile)) d+=100;
  for(const op of G.players){
    if(!op||op.isHuman||op.idx===fromPi||op.kouTing) continue;
    if(checkWin(op,tile)) d+=35;
  }
  return d;
}

function aiPickKouTingEntryIndex(p,entry){
  let best=entry[0],bestU=-Infinity;
  for(const i of entry){
    const nh=p.hand.filter((_,j)=>j!==i);
    const w=getKatanWaits(nh);
    const u=w.length*55+aiHandUtility({...p,hand:nh},nh);
    if(u>bestU){bestU=u;best=i;}
  }
  return best;
}

function aiPickKouTingDiscardIndex(p,leg){
  const lv=aiLevel();
  if(!lv.smartPick||Math.random()<(lv.discardNoise||0)*0.5){
    return leg[Math.floor(Math.random()*leg.length)];
  }
  let best=leg[0],bestScore=Infinity;
  for(const i of leg){
    const nh=p.hand.filter((_,j)=>j!==i);
    const tile=p.hand[i];
    const danger=lv.defense?aiDiscardDanger(tile,p.idx):0;
    const keep=aiHandUtility(p,nh);
    const score=danger-keep;
    if(score<bestScore){bestScore=score;best=i;}
  }
  return best;
}

function aiPickBestChiOption(hand,tile,opts){
  let best=opts[0],bestU=-Infinity;
  for(const pair of opts){
    const nh=removeTiles(hand,pair);
    if(!nh) continue;
    const pseudo={hand:nh,melds:[{type:'chi',tiles:[...pair,tile]}]};
    const u=aiHandUtility(pseudo,nh);
    if(u>bestU){bestU=u;best=pair;}
  }
  return best;
}

function aiShouldClaimMeld(p,tile,kind){
  const lv=aiLevel();
  if(kind==='chi'){
    if(Math.random()>=lv.chi*(lv.claimBoost||1)) return false;
    if(!lv.smartPick) return true;
    const opts=getChiOptions(p.hand,tile);
    if(!opts.length) return false;
    const pair=aiPickBestChiOption(p.hand,tile,opts);
    const nh=removeTiles(p.hand,pair);
    if(!nh) return false;
    const pseudo={hand:nh,melds:[...(p.melds||[]),{type:'chi',tiles:sortTiles([...pair,tile])}]};
    return aiHandUtility(pseudo,nh)>=aiHandUtility(p,p.hand)-5;
  }
  if(kind==='minkan'){
    if(Math.random()>=lv.minkan) return false;
  }else if(kind==='pon'){
    if(!p.melds.some(m=>m.type==='pon'||m.type==='kan')&&Math.random()<lv.pon*0.55) return true;
    if(Math.random()>=lv.pon) return false;
  }
  if(!lv.smartPick) return true;
  const nh=removeTiles(p.hand,kind==='minkan'?[tile,tile,tile]:[tile,tile]);
  if(!nh) return false;
  const meldType=kind==='minkan'?'kan':'pon';
  const pseudo={hand:nh,melds:[...(p.melds||[]),{type:meldType,tiles:kind==='minkan'?[tile,tile,tile,tile]:[tile,tile,tile]}]};
  const after=aiHandUtility(pseudo,nh);

  return after>=before-6;
}

  if(!s) return '';
  return s.replace(/\/+$/,'');
}

function prefersReducedMotion(){
  if(UI.fxSkip) return true;
  try{ return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches); }catch(_e){ return false; }
}

let _pendingFlight=null;
function armDiscardFlight(fromPi, tile, fromEl){
  if(prefersReducedMotion()) return;
  let origin=null;
  if(fromEl&&fromEl.getBoundingClientRect){
    const r=fromEl.getBoundingClientRect();
    origin={x:r.left,y:r.top,w:r.width,h:r.height};
  }else{
    const r=typeof seatAnchorRect==='function'?seatAnchorRect(fromPi,'hand'):null;
    if(r) origin={x:r.x-(r.w||24)/2,y:r.y-(r.h||32)/2,w:r.w||28,h:r.h||40};
  }
  _pendingFlight={fromPi,tile,origin};
}
function discardRiverRoot(pi){
  return ['#human-discards','#left-discards','#north-discards','#right-discards'][pi]||'';
}
function lastDiscardCellRect(fromPi){
  const root=discardRiverRoot(fromPi);
  const nodes=document.querySelectorAll(root?`${root} .discard-cell:not(.river-ghost)`:'.north-discards .discard-cell:not(.river-ghost)');
  const el=nodes[nodes.length-1];
  if(!el) return null;
  const r=el.getBoundingClientRect();
  return {x:r.left,y:r.top,w:r.width,h:r.height,el};
}
function flushDiscardFlight(){
  const spec=_pendingFlight;
  _pendingFlight=null;
  if(!spec||!spec.origin) return;
  requestAnimationFrame(()=>{
    const dest=lastDiscardCellRect(spec.fromPi);
    if(!dest) return;
    const layer=document.getElementById('tile-flight');
    if(!layer) return;
    const clone=document.createElement('div');
    clone.className='fly-clone';
    clone.innerHTML=tileHTML(spec.tile,'lg');
    const w=spec.origin.w||dest.w||32;
    const h=spec.origin.h||dest.h||44;
    clone.style.width=w+'px';
    clone.style.height=h+'px';
    clone.style.setProperty('--fx',spec.origin.x+'px');
    clone.style.setProperty('--fy',spec.origin.y+'px');
    clone.style.setProperty('--tx',dest.x+'px');
    clone.style.setProperty('--ty',dest.y+'px');
    clone.style.setProperty('--fr','-10deg');
    clone.style.setProperty('--fly-ms','380ms');
    layer.appendChild(clone);
    dest.el?.classList.add('just-landed');
    setTimeout(()=>{ clone.remove(); dest.el?.classList.remove('just-landed'); },420);
  });
}

async function onlineRequest(path, body){

    method:'POST',
    headers:{'content-type':'application/json'},
    body:JSON.stringify(body||{})
  });
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||`HTTP ${res.status}`);

}

function connectOnlineEvents(){
  if(!ONLINE.room||!ONLINE.playerId) return;
  if(ONLINE.source) ONLINE.source.close();
  const code=ONLINE.room.id;
  const source=new EventSource(apiUrl(`/api/rooms/${code}/events?playerId=${encodeURIComponent(ONLINE.playerId)}`));
  ONLINE.source=source;
  source.addEventListener('hello',ev=>{
    const data=JSON.parse(ev.data);
    ONLINE.room=data.room;
    ONLINE.private=data.private;
    ONLINE.sseDisconnected=false;
    ONLINE.status=tr('onlineConnected','接続中');
    renderOnlineOrStart();
  });
  source.addEventListener('room_state',ev=>{
    ONLINE.room=JSON.parse(ev.data);
    ONLINE.sseDisconnected=false;
    ONLINE.status=tr('onlineConnected','接続中');
    renderOnlineOrStart();
  });
  source.addEventListener('private_state',ev=>{
    ONLINE.private=JSON.parse(ev.data);
    renderOnlineOrStart();
  });
  source.onerror=()=>{
    try{source.close();}catch(_e){}
    if(ONLINE.source===source) ONLINE.source=null;
    ONLINE.sseDisconnected=true;
    ONLINE.status=tr('onlineDisconnected','未接続');
    renderOnlineOrStart();
  };
}

function onlineLegal(type){

}
function buildOnlineGame(){
  const room=ONLINE.room, priv=ONLINE.private;
  if(!room?.game||!priv) return null;
  const players=[0,1,2,3].map(view=>{
    const real=onlineRealSeat(view);
    const isHuman=view===0;
    const kouTing=!!room.game.kouTing?.[real];
    const hand=isHuman?sortTiles(priv.hand||[]):Array.from({length:room.game.handCounts?.[real]||0},()=>({suit:'z',num:5}));
    const waits=kouTing&&isHuman?getKatanWaits(hand):[];
    return {
      idx:view,
      realSeat:real,
      name:isHuman?onlinePlayerName(real):onlinePlayerName(real),
      isHuman,
      hand,
      melds:room.game.melds?.[real]||[],
      discards:room.game.discards?.[real]||[],
      isTenpai:false,
      kouTing,
      waits,
      drawnTile:isHuman&&priv.lastDraw?priv.lastDraw:null,
    };
  });
  const legal=priv.legalActions||[];
  const humanOptions=[];
  let phase='discard';
  let chiOpts=[];
  if(legal.some(a=>a.type==='ron')){phase='after_discard';humanOptions.push('win');}
  if(legal.some(a=>a.type==='minkan')){phase='after_discard';humanOptions.push('minkan');}
  if(legal.some(a=>a.type==='pon')){phase='after_discard';humanOptions.push('pon');}
  const chi=legal.find(a=>a.type==='chi');
  if(chi){phase='after_discard';humanOptions.push('chi');chiOpts=chi.options||[];}
  if(legal.some(a=>a.type==='skip')) phase='after_discard';
  if(legal.some(a=>a.type==='tsumo')) humanOptions.push('tsumo');
  if(legal.some(a=>a.type==='reveal_treasure')) humanOptions.push('reveal_treasure');
  if(legal.some(a=>a.type==='treasure_win')) humanOptions.push('treasure_win');
  const kouTingTreasurePending=room.game.kouTingTreasurePending===priv.seat;
  const kouTingTreasureSeen=!!room.game.kouTingTreasureSeen;
  const pending=room.game.pending;
  const winner=room.game.winner;
  const handEnded=room.game.status==='ended';
  const scores=[0,1,2,3].map(view=>room.match?.scores?.[onlineRealSeat(view)]??0);
  let lastWin=null;
  let endMsg=null;
  if(winner&&winner.type&&winner.type!=='draw'&&winner.seat!=null){
    const wView=onlineViewSeat(winner.seat);
    const fromView=winner.from!=null?onlineViewSeat(winner.from):null;
    const isTsumo=winner.type==='tsumo';
    const isTreasure=!!winner.treasure;
    const deltasReal=winner.scoreDeltas||(isTreasure?getTreasureScoreDeltas(winner.seat,12):isTsumo?getTsumoScoreDeltas(winner.seat,4):getRonScoreDeltas(winner.seat,winner.from,winner.discarderListening!==false,2));
    const deltas=[0,1,2,3].map(v=>deltasReal[onlineRealSeat(v)]);
    const totalPts=deltas[wView]||0;
    const fromName=fromView!=null?sideName(fromView):null;
    lastWin={
      winner:wView,
      tile:winner.tile,
      method:isTreasure?tr('treasureWin','宝中宝！'):winner.type,
      points:totalPts,
      from:fromView,
      discarderListening:winner.discarderListening,
      isTsumo,
      isTreasure,
      scoreDeltas:deltas,
      detail:buildWinScoreDetail(wView,deltas,isTsumo||isTreasure,fromView??-1,winner.discarderListening!==false),
    };
    if(isTreasure){
      endMsg=`${sideName(wView)} ${tr('treasureWin','宝中宝！')} ${tileName(winner.tile)} (+${totalPts})`;
    }else if(winner.type==='ron'&&fromName!=null){
      endMsg=`${sideName(wView)} ${tr('ron','ロン！')} ${tileName(winner.tile)} (+${totalPts})\n${tr('dianpao','点炮')}: ${fromName}`;
    }else{
      endMsg=`${onlinePlayerName(winner.seat)} ${winner.type} (+${totalPts})`;
    }
  }
  return {
    online:true,
    players,
    wall:Array.from({length:room.game.wallCount||0},()=>({suit:'z',num:5})),
    treasure:priv.treasure||{suit:'z',num:5},
    turn:onlineViewSeat(room.game.turn||0),
    dealer:onlineViewSeat(room.game.dealer||0),
    dealerReal:room.game.dealer||0,
    phase,
    pendingDiscard:pending?.tile||null,
    pendingFrom:pending?onlineViewSeat(pending.from):-1,
    humanOptions,
    chiOpts,
    ankanOpts:[],
    scores,
    treasureUsed:!!room.game.treasureUsed,
    msg:winner
      ? (winner.type==='draw'
        ? tr('roundDraw','流局')
        : (endMsg||`${onlinePlayerName(winner.seat)} ${winner.type}`))
      : (kouTingTreasurePending
        ? (kouTingTreasureSeen
          ? tr('kouTingTreasureReady','宝牌を確認しました。「宝中宝！」で和了できます')
          : tr('kouTingTreasurePrompt','扣聴成立。待ちが宝牌と一致しています。「宝を見る」で確認してください'))
        : (room.match
          ? tr('matchRound','第{n} / {t}局').replace('{n}',String(room.match.round)).replace('{t}',String(room.match.totalRounds))
          : `${tr('onlineRoom','部屋コード')}: ${room.id}`)),
    log:[],
    gameOver:handEnded,
    roundOver:handEnded,
    handsRevealed:handEnded,
    lastDrawn:priv.lastDraw||null,
    tsumoTile:legal.find(a=>a.type==='tsumo')?.tile||null,
    dealerOpeningDiscardNoDraw:false,
    skipDrawAfterCallBy:null,
    pendingKouTingFrom:null,
    kouTingPick:false,
    kouTingEntryIdx:legal.find(a=>a.type==='kouting')?.indices||[],
    kouTingTreasurePending,
    kouTingTreasureSeen,
    ktReveal:null,
    lastWin,
    fxFlash:null,
    kanBranchBActive:false,
    kanBranchAOpts:null,
    discardedThisTurn:false,
    kanTurnEnding:false,
    _epoch:0,
  };
}
function showOnlineMatchSetResult(){
  const match=ONLINE.room?.match;
  if(!match) return;
  const ranked=[0,1,2,3].map(seat=>({seat,name:onlinePlayerName(seat),score:match.scores[seat]}));
  ranked.sort((a,b)=>b.score-a.score);
  const leader=ranked[0];
  const title=UI.lang==='zh'?'本盘结束':'セット終了';
  const body=UI.lang==='zh'
    ? `${tr('matchTotal','合计分')}: ${ranked.map(r=>`${r.name} ${r.score}`).join(' / ')}`
    : `${tr('matchTotal','合計点')}: ${ranked.map(r=>`${r.name} ${r.score}`).join(' / ')}`;
  const detail=UI.lang==='zh'
    ? `领先: ${leader?leader.name:'—'} (${leader?leader.score:0}分)\n${ranked.map((r,n)=>`${n+1}. ${r.name} ${r.score}`).join('\n')}`
    : `トップ: ${leader?leader.name:'—'} (${leader?leader.score:0}点)\n${ranked.map((r,n)=>`${n+1}. ${r.name} ${r.score}`).join('\n')}`;
  showOverlay(title,body,detail);
  refreshOverlayLocale();
}
function renderOnlineOrStart(){
  if(ONLINE.room?.match?.finished){
    const resultKey=`${ONLINE.room.id}:done`;
    if(ONLINE_MATCH_RESULT!==resultKey){
      ONLINE_MATCH_RESULT=resultKey;
      showOnlineMatchSetResult();
    }
  }
  if(!ONLINE.room?.game||!ONLINE.private){
    if(G&&!G.online){render();return;}
    renderStartScreen();
    return;
  }
  const room=ONLINE.room;
  const freshHand=!(room.game.discards||[]).some(d=>d.length>0);
  const revealKey=`${room.id}:${room.match?.round||0}:${room.version}`;
  if(room.match?.round===1&&freshHand&&!ONLINE_ROULETTE_ACTIVE&&ONLINE_DEALER_REVEAL!==revealKey){
    ONLINE_ROULETTE_ACTIVE=true;
    spinDealerRoulette(()=>{
      ONLINE_DEALER_REVEAL=revealKey;
      ONLINE_ROULETTE_ACTIVE=false;
      G=buildOnlineGame();
      if(!G){
        scheduleMatch(()=>renderOnlineOrStart(),80);
        return;
      }
      G._epoch=++MATCH_EPOCH;
      beginRoundDealCinema(()=>{
        ONLINE_DEAL_CINEMA_DONE=revealKey;
        render();
      });
    }, room.game.dealer);
    return;
  }
  if(ONLINE_ROULETTE_ACTIVE) return;
  G=buildOnlineGame();
  if(!G){
    renderStartScreen();
    return;
  }
  if(G.gameOver&&G.lastWin?.isTreasure){
    const baoFxKey=`${room.id}:${room.match?.round||0}:bao:${G.lastWin.winner}:${tileKey(G.lastWin.tile)}`;
    if(ONLINE_TREASURE_WIN_DONE!==baoFxKey){
      ONLINE_TREASURE_WIN_DONE=baoFxKey;
      render();
      if(G.lastWin.winner===0){
        scheduleMatch(()=>playHumanWinCinema({
          kanji:'宝',
          label:tr('treasureWin','宝中宝！'),
          points:G.lastWin.points,
          tile:G.lastWin.tile,
          kind:'treasure',
          cb:()=>openResultOverlay(),
        }),180);
      }else{
        scheduleMatch(()=>openResultOverlay(),400);
      }
      return;
    }
  }
  if(G.gameOver&&G.lastWin&&G.lastWin.from!=null&&!G.lastWin.isTsumo){
    const ronFxKey=`${room.id}:${room.match?.round||0}:ron:${G.lastWin.from}:${tileKey(G.lastWin.tile)}`;
    if(ONLINE_RON_FX_DONE!==ronFxKey){
      ONLINE_RON_FX_DONE=ronFxKey;
      render();
      scheduleMatch(()=>playRonRevealFx(G.lastWin.winner,G.lastWin.from,G.lastWin.tile),180);
      return;
    }
  }
  if(freshHand&&ONLINE_DEAL_CINEMA_DONE!==revealKey){
    G._epoch=++MATCH_EPOCH;
    beginRoundDealCinema(()=>{
      ONLINE_DEAL_CINEMA_DONE=revealKey;
      render();
    });
    return;
  }
  render();
}

function spinDealerRoulette(done,fixedDealer=null){
  const overlay=document.getElementById('dealer-roulette');
  const spin=document.getElementById('dealer-roulette-spin');
  const title=document.getElementById('dealer-roulette-title');
  const sub=document.getElementById('dealer-roulette-sub');
  if(!overlay||!spin) return done(0);
  const dealer=fixedDealer==null?Math.floor(Math.random()*4):fixedDealer;
  layoutDealerRouletteLabels(spin);
  const dealerView=seatViewSeat(dealer);
  const fullTurns=5+Math.floor(Math.random()*2);
  const endDeg=fullTurns*360+dealerRouletteEndAngle(dealerView);
  if(title) title.textContent=tr('dealerRoll','親決め');
  if(sub) sub.textContent=tr('dealerRouletteSpin','ルーレット回転中…');
  spin.style.transition='none';
  spin.style.transform='rotate(0deg)';
  void spin.offsetWidth;
  overlay.classList.remove('hidden');
  const spinMs=3900;
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      spin.style.transition=`transform ${spinMs}ms cubic-bezier(.15,.85,.1,1)`;
      spin.style.transform=`rotate(${endDeg}deg)`;
    });
  });
  GameSFX.play('tap');
  setTimeout(()=>{
    const dealerName=windLabelForRealSeat(dealer, dealer);
    if(sub) sub.textContent=tr('dealerIs','{name}が親').replace('{name}',dealerName);
    GameSFX.play('tap');
    setTimeout(()=>{
      overlay.classList.add('hidden');
      spin.style.transition='none';
      spin.style.transform='rotate(0deg)';
      done(dealer);
    },900);
  },spinMs+120);
}

function clearDealCinema(){
  hideDealDice();
  DEAL_CINEMA_SKIP=false;
  DEAL_CINEMA_TIMERS.forEach(id=>clearTimeout(id));
  DEAL_CINEMA_TIMERS=[];
  if(DEAL_CINEMA_FLIGHT_LAYER){
    DEAL_CINEMA_FLIGHT_LAYER.remove();
    DEAL_CINEMA_FLIGHT_LAYER=null;
  }
  const overlay=document.getElementById('deal-cinema');
  if(overlay){
    overlay.classList.add('hidden');
    overlay.classList.remove('deal-phase-open','deal-phase-treasure','deal-phase-reveal');
    overlay.setAttribute('aria-hidden','true');
    overlay.onclick=null;
  }
  const wallSides=['top','right','bottom','left'];
  wallSides.forEach(side=>{
    const el=document.getElementById(`deal-wall-${side}`);

  });

  if(sparks) sparks.innerHTML='';

function scheduleDealCinema(fn,ms){
  const ep=G?._epoch;
  const id=setTimeout(()=>{
    if(!G||G._epoch!==ep) return;
    if(DEAL_CINEMA_SKIP) return;
    fn();
  },ms);
  DEAL_CINEMA_TIMERS.push(id);
  return id;
}

function buildDealSquareWall(){
  const sides=[['top',0],['right',1],['bottom',2],['left',3]];
  const tiers=2;
  const perTier=14;
  sides.forEach(([side,idx])=>{
    const el=document.getElementById(`deal-wall-${side}`);
    if(!el) return;
    el.innerHTML=Array.from({length:tiers},(_,tier)=>(
      `<div class="deal-wall-tier">${Array.from({length:perTier},(_,i)=>{
        const wallI=tier*perTier+i;
        return `<div class="deal-wall-tile" style="--wall-i:${wallI};--wall-side:${idx}"></div>`;
      }).join('')}</div>`
    )).join('');
  });
}

function buildDealCinemaSparks(){
  const host=document.getElementById('deal-cinema-sparks');
  if(!host) return;
  host.innerHTML=Array.from({length:18},()=>{
    const left=8+Math.random()*84;
    const top=12+Math.random()*76;
    const dx=(Math.random()-.5)*18;
    const dy=-18-Math.random()*28;
    const dur=(2.4+Math.random()*1.8).toFixed(2);
    const delay=(Math.random()*1.6).toFixed(2);
    return `<span class="deal-cinema-spark" style="left:${left}%;top:${top}%;--spark-dx:${dx}px;--spark-dy:${dy}px;--spark-dur:${dur}s;--spark-delay:${delay}s"></span>`;
  }).join('');
}

function dealCinemaViewOrder(dealerView){
  const order=[];
  let seat=dealerView;
  for(let i=0;i<4;i++){order.push(seat);seat=nextPlayer(seat);}
  return order;
}

/** 配牌演出: 6枚塊×2巡 → 親チョンチョン(1・跳2・1) → 閑家各1 */
function buildDealCinemaSteps(dealerView){
  const order=dealCinemaViewOrder(dealerView);
  const steps=[];
  for(let round=0;round<HARBIN_DEAL_ROUNDS;round++){
    for(const view of order) steps.push({view,count:HARBIN_DEAL_CHUNK,phase:'chunk'});
  }
  steps.push({view:dealerView,count:1,phase:'chon'});
  steps.push({wallSkip:2,phase:'chon'});
  steps.push({view:dealerView,count:1,phase:'chon'});
  for(let i=1;i<order.length;i++) steps.push({view:order[i],count:1,phase:'bu'});
  return steps;
}

function dealCinemaFinalCounts(steps){
  const counts=[0,0,0,0];
  for(const step of steps){
    if(step.wallSkip) continue;
    counts[step.view]+=step.count||1;
  }
  return counts;
}

/** handSlot: 0..5 ＝ 二段三列グリッド内の着地点 */
function seatHandLandingPoint(view,handSlot=0){
  const selectors={
    0:'#human-hand',
    1:'#left-area .side-col',
    2:'#top-area .north-hand-row',
    3:'#right-area .side-col',
  };
  const el=document.querySelector(selectors[view]);
  const col=handSlot%3;
  const row=Math.floor(handSlot/3);
  if(!el){
    const cx=window.innerWidth/2;
    const cy=window.innerHeight/2;
    const seatOffset=[{x:0,y:120},{x:-140,y:0},{x:0,y:-120},{x:140,y:0}][view]||{x:0,y:0};
    return {x:cx+seatOffset.x+(col-1)*10,y:cy+seatOffset.y+row*8};
  }
  const rect=el.getBoundingClientRect();
  const spreadX=view===1||view===3?5:10;
  const spreadY=view===1||view===3?8:14;
  if(view===0||view===2){
    return {
      x:rect.left+8+col*spreadX,
      y:rect.top+rect.height*0.35+row*spreadY,
    };
  }
  return {
    x:rect.left+rect.width*0.35+row*spreadY,
    y:rect.top+8+col*spreadX,
  };
}

/** 開門位置から牌山を一周する取り順（列ごとに上下2段）を構築。
 *  実際の麻雀どおり、開門の辺を breakCol から端まで取り切ってから次の辺へ進み、
 *  最後に開門の辺の残り（0..breakCol-1）へ戻る。これで「少し残して別の山へ飛ぶ」現象を防ぐ。 */
function buildDealWallDrawOrder(){
  if(!DEAL_WALL_STATE) return [];
  const perTier=14;
  const sideOrder=DEAL_WALL_STATE.sideOrder;
  const startCol=Math.min(Math.max(DEAL_WALL_STATE.col||0,0),perTier-1);
  const tierTilesOf=side=>{
    const wall=document.getElementById(`deal-wall-${side}`);
    if(!wall) return [];
    return [...wall.querySelectorAll('.deal-wall-tier')].map(t=>[...t.querySelectorAll('.deal-wall-tile')]);
  };
  const queue=[];
  const pushCol=(tiers,col)=>{ for(const tier of tiers){ if(tier[col]) queue.push(tier[col]); } };
  const firstTiers=tierTilesOf(sideOrder[0]);
  for(let c=startCol;c<perTier;c++) pushCol(firstTiers,c);
  for(let s=1;s<sideOrder.length;s++){
    const tiers=tierTilesOf(sideOrder[s]);
    for(let c=0;c<perTier;c++) pushCol(tiers,c);
  }
  for(let c=0;c<startCol;c++) pushCol(firstTiers,c);
  return queue;
}

/** 取り順キューから先頭 n 枚を取り出す（既に取られた牌は飛ばす） */
function dealWallQueueShift(n){
  const q=DEAL_WALL_STATE&&DEAL_WALL_STATE.queue;
  const out=[];
  if(!q) return out;
  while(out.length<n&&q.length){
    const el=q.shift();
    if(el&&!el.classList.contains('spent')) out.push(el);
  }
  return out;
}

function rectsCenter(els){
  if(!els.length) return {x:window.innerWidth/2,y:window.innerHeight*0.44};
  let l=Infinity,t=Infinity,r=-Infinity,b=-Infinity;
  els.forEach(el=>{
    const rc=el.getBoundingClientRect();
    l=Math.min(l,rc.left); t=Math.min(t,rc.top);
    r=Math.max(r,rc.right); b=Math.max(b,rc.bottom);
  });
  return {x:(l+r)/2,y:(t+b)/2};
}

function removeDealWallTiles(els){
  els.forEach(el=>el.classList.add('spent'));
  scheduleDealCinema(()=>{els.forEach(el=>{if(el.parentNode) el.remove();});},280);
}

/** 2段3列（=6枚）を取り順キューの先頭から消費。開門位置から山を順に取り切る。 */
function consumeDealWallChunk(){
  const tiles=dealWallQueueShift(HARBIN_DEAL_CHUNK);
  removeDealWallTiles(tiles);
  return {tiles,center:rectsCenter(tiles)};
}

/** 取り順キューの先頭から1枚（チョンチョン・補牌用） */
function consumeDealWallSingle(){
  const tiles=dealWallQueueShift(1);
  if(tiles.length) removeDealWallTiles(tiles);
  return rectsCenter(tiles);
}

/** チョンチョンの「跳」：取り順キューから n 枚だけ消す（飛ばさない） */
function consumeDealWallSkip(n){
  const tiles=dealWallQueueShift(n);
  removeDealWallTiles(tiles);
}

function seatHandChunkCenter(view){
  let x=0,y=0;
  for(let i=0;i<HARBIN_DEAL_CHUNK;i++){
    const p=seatHandLandingPoint(view,i);
    x+=p.x; y+=p.y;
  }
  return {x:x/HARBIN_DEAL_CHUNK,y:y/HARBIN_DEAL_CHUNK};
}

function ensureDealFlightLayer(){
  if(!DEAL_CINEMA_FLIGHT_LAYER){
    DEAL_CINEMA_FLIGHT_LAYER=document.createElement('div');
    DEAL_CINEMA_FLIGHT_LAYER.className='deal-flight-layer';
    document.body.appendChild(DEAL_CINEMA_FLIGHT_LAYER);
  }
}

/** 6枚塊を1つの塊として牌壁→1席へ */
function spawnDealChunkFlight(targetView,compact){
  ensureDealFlightLayer();
  const chunk=consumeDealWallChunk();
  const from=chunk.center;
  const to=seatHandChunkCenter(targetView);
  const ms=compact?400:560;
  const group=document.createElement('div');
  group.className='deal-flight-chunk';
  group.style.setProperty('--deal-chunk-ms',`${ms}ms`);
  group.style.setProperty('--fx',`${from.x}px`);
  group.style.setProperty('--fy',`${from.y}px`);
  group.style.setProperty('--tx',`${to.x}px`);
  group.style.setProperty('--ty',`${to.y}px`);
  for(let i=0;i<HARBIN_DEAL_CHUNK;i++){
    const cell=document.createElement('div');
    cell.className='deal-flight-chunk-cell';
    group.appendChild(cell);
  }
  DEAL_CINEMA_FLIGHT_LAYER.appendChild(group);
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>group.classList.add('fly'));
  });
  scheduleDealCinema(()=>{if(group.parentNode) group.remove();},ms+140);
}

function spawnDealSingleFlight(targetView,compact,fromPoint){
  ensureDealFlightLayer();
  const from=fromPoint||consumeDealWallSingle();
  const to=seatHandLandingPoint(targetView,G?.dealRevealCounts?.[targetView]??0);
  const ms=compact?280:400;
  const el=document.createElement('div');
  el.className='deal-flight-tile';
  el.style.setProperty('--deal-flight-ms',`${ms}ms`);
  el.style.setProperty('--fx',`${from.x}px`);
  el.style.setProperty('--fy',`${from.y}px`);
  el.style.setProperty('--tx',`${to.x}px`);
  el.style.setProperty('--ty',`${to.y}px`);
  el.style.setProperty('--fr',`${targetView===1?-12:targetView===3?12:0}deg`);
  DEAL_CINEMA_FLIGHT_LAYER.appendChild(el);
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>el.classList.add('fly'));
  });
  scheduleDealCinema(()=>{if(el.parentNode) el.remove();},ms+100);
}

function pulseDealSeatBeacon(view){
  const beacon=document.querySelector(`.deal-seat-beacon[data-seat="${view}"]`);
  if(!beacon) return;
  beacon.classList.remove('pulse');
  void beacon.offsetWidth;
  beacon.classList.add('pulse');
}

function setDealCinemaSub(key,fallback){
  const sub=document.getElementById('deal-cinema-sub');
  if(sub) sub.textContent=tr(key,fallback);
}

/** 配牌の「二段三列」グリッド表示から1列へ整列させる FLIP 演出用に、
 *  整列前の各牌の中心位置を席ごとに記録する（自家・対面のみ。左右は元から1列）。 */
function captureDealStagingPositions(){
  const grab=sel=>{
    const host=document.querySelector(sel);
    if(!host) return [];
    return [...host.querySelectorAll('.tile')].map(el=>{
      const r=el.getBoundingClientRect();
      return {x:r.left+r.width/2,y:r.top+r.height/2};
    });
  };
  return {
    human:grab('#human-hand'),
    north:grab('#top-area .north-hand-row'),
  };
}

/** 記録した位置から、整列後の1列へ各牌をスライドさせる（牌が手前に集まって並ぶ演出）。 */
function animateDealHandCollapse(prev){
  if(!prev) return;
  const run=(sel,old)=>{
    const host=document.querySelector(sel);
    if(!host||!old||!old.length) return;
    const tiles=[...host.querySelectorAll('.tile')];
    let moved=false;
    tiles.forEach((el,i)=>{
      const o=old[i];
      if(!o) return;
      const r=el.getBoundingClientRect();
      const dx=o.x-(r.left+r.width/2);
      const dy=o.y-(r.top+r.height/2);
      if(Math.abs(dx)<0.5&&Math.abs(dy)<0.5) return;
      moved=true;
      el.style.transition='none';
      el.style.transform=`translate(${dx}px,${dy}px) scale(.92)`;
      el.style.zIndex='4';
    });
    if(!moved) return;
    void host.offsetWidth;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      tiles.forEach((el,i)=>{
        if(!old[i]) return;
        el.style.transition='transform .46s cubic-bezier(.2,.86,.18,1)';
        el.style.transform='';
      });
    }));
  };
  run('#human-hand',prev.human);
  run('#top-area .north-hand-row',prev.north);
}

function playDealCinema(done){
  if(!G) return done?.();
  clearDealCinema();
  const overlay=document.getElementById('deal-cinema');
  if(!overlay) return done?.();
  const ep=G._epoch;
  const compact=!!(MATCH?.round>1||(G.online&&ONLINE.room?.match?.round>1));
  const dealerView=G.dealer;
  const steps=buildDealCinemaSteps(dealerView);
  const finalCounts=dealCinemaFinalCounts(steps);
  G.dealRevealCounts=[0,0,0,0];
  G.dealCinemaPhase='';
  G.dealFaceReveal=false;
  G.dealCinemaActive=true;
  G.phase='deal';
  const title=document.getElementById('deal-cinema-title');
  const caption=document.getElementById('deal-cinema-caption');
  const skip=document.getElementById('deal-cinema-skip');
  if(title) title.textContent=tr('dealCinemaTitle','嵌張宝壇配牌');
  if(caption) caption.textContent=tr('dealCinemaCaption','112枚・宝壇');
  if(skip) skip.textContent=tr('dealCinemaSkip','タップでスキップ');
  setDealCinemaSub('dealCinemaRing','金の宝壇に四方の山が築かれる…');
  if(!DEAL_WALL_STATE&&G?.dealBreak){
    initDealWallState(G.dealBreak.openerView,G.dealBreak.breakCol);
  }
  buildDealSquareWall();
  if(DEAL_WALL_STATE) DEAL_WALL_STATE.queue=buildDealWallDrawOrder();
  highlightDealWallBreak();
  buildDealCinemaSparks();
  overlay.classList.remove('deal-phase-treasure','deal-phase-reveal');
  overlay.classList.remove('hidden');
  overlay.setAttribute('aria-hidden','false');
  overlay.onclick=()=>{DEAL_CINEMA_SKIP=true;finishDealCinema(done,ep,compact,finalCounts);};
  requestAnimationFrame(()=>overlay.classList.add('deal-phase-open'));
  let stepIdx=0;
  const beatMs=compact?480:720;
  const openMs=compact?520:980;
  const runBeat=()=>{
    if(DEAL_CINEMA_SKIP||!G||G._epoch!==ep) return;
    if(stepIdx>=steps.length) return runTreasure();
    const step=steps[stepIdx];
    if(step.phase==='chon'&&G.dealCinemaPhase!=='chon'){
      G.dealCinemaPhase='chon';
      setDealCinemaSub('dealCinemaChon','親チョンチョン（1枚・跳・1枚）');
    }else if(step.phase==='bu'&&G.dealCinemaPhase!=='bu'){
      G.dealCinemaPhase='bu';
      setDealCinemaSub('dealCinemaBu','閑家各1枚補牌');
    }else if(!G.dealCinemaPhase){
      setDealCinemaSub('dealCinemaDeal','親から半時計回り・各6枚（二段三列）×2巡');
    }
    if(step.wallSkip){
      consumeDealWallSkip(step.wallSkip);
      stepIdx++;
      render();
      scheduleDealCinema(runBeat,compact?200:320);
      return;
    }
    const n=step.count||1;
    if(n===HARBIN_DEAL_CHUNK&&step.phase==='chunk'){
      G.dealRevealCounts[step.view]+=HARBIN_DEAL_CHUNK;
      spawnDealChunkFlight(step.view,compact);
      pulseDealSeatBeacon(step.view);
      render();
      GameSFX.play('deal');
      stepIdx++;
      scheduleDealCinema(runBeat,beatMs);
      return;
    }
    G.dealRevealCounts[step.view]+=n;
    spawnDealSingleFlight(step.view,compact);
    pulseDealSeatBeacon(step.view);
    render();
    GameSFX.play('deal');
    stepIdx++;
    scheduleDealCinema(runBeat,compact?200:320);
  };
  const runTreasure=()=>{
    if(DEAL_CINEMA_SKIP||!G||G._epoch!==ep) return;
    G.dealRevealCounts=finalCounts.slice();
    overlay.classList.add('deal-phase-treasure');
    setDealCinemaSub('dealCinemaTreasure','山端の一枚が宝として封じられる');
    render();
    GameSFX.play('kan');
    fxVibrate(compact?[8,14,8]:[10,18,12]);
    scheduleDealCinema(runReveal,compact?360:680);
  };
  const runReveal=()=>{
    if(!G||G._epoch!==ep) return;
    if(DEAL_CINEMA_SKIP){
      finishDealCinema(done,ep,compact,finalCounts);
      return;
    }
    const stagingPos=captureDealStagingPositions();
    overlay.classList.add('deal-phase-reveal');
    setDealCinemaSub('dealCinemaReveal','嵌張の光が手前を開く');
    G.dealFaceReveal=true;
    render();
    animateDealHandCollapse(stagingPos);
    const hand=document.getElementById('human-hand');
    if(hand) hand.classList.add('deal-hand-reveal');
    GameSFX.play('reveal');
    fxVibrate(compact?[10,18,10]:[14,26,16]);
    scheduleDealCinema(()=>finishDealCinema(done,ep,compact,finalCounts),compact?620:1120);
  };
  scheduleDealCinema(runBeat,openMs);
}

function finishDealCinema(done,ep,compact,finalCounts){
  if(!G||G._epoch!==ep) return;
  clearDealCinema();
  G.dealCinemaActive=false;
  G.dealFaceReveal=false;
  G.dealRevealCounts=null;
  G.dealCinemaPhase=null;
  G.phase='discard';
  render();
  const hand=document.getElementById('human-hand');
  if(hand) hand.classList.remove('deal-hand-reveal');
  if(typeof done==='function') done();
}

function beginRoundDealCinema(done){
  if(!G) return done?.();
  G.dealRevealCounts=[0,0,0,0];
  G.dealFaceReveal=false;
  G.dealCinemaActive=true;
  G.phase='deal';
  render();
  runDealDiceSequence(()=>{
    if(!G) return;
    playDealCinema(done);
  });
}

function advanceMatchDealer(){
  if(!MATCH||!G) return;
  const keepDealer=!G.lastWin||G.lastWin.winner===G.dealer;
  if(!keepDealer) MATCH.dealer=nextPlayer(MATCH.dealer);
}

function beginMatch(){
  detachOnlineLobbyForOffline();
  MATCH={scores:[0,0,0,0],round:0,totalRounds:MATCH_TOTAL_ROUNDS,dealer:0,finished:false};
  startNextRound();
}

function startNextRound(){
  if(!MATCH) return beginMatch();
  MATCH.round++;
  if(MATCH.round>MATCH.totalRounds){
    showMatchSetResult();
    return;
  }
  if(MATCH.round>1) advanceMatchDealer();
  if(MATCH.round===1){
    spinDealerRoulette(dealer=>{
      MATCH.dealer=dealer;
      startRound();
    });
    return;
  }
  startRound();
}

function overlayPrimaryAction(){
  closeOverlay();
  if(MATCH&&!MATCH.finished&&G&&G.roundOver){
    if(MATCH.round>=MATCH.totalRounds) showMatchSetResult();
    else startNextRound();
    return;
  }
  beginMatch();
}

function showMatchSetResult(){
  if(!MATCH) return;
  MATCH.finished=true;
  const scores=G?G.scores:MATCH.scores;
  const names=G?G.players.map(p=>p.name):dealerWindNames();
  const ranked=[0,1,2,3].map(i=>({i,name:names[i],score:scores[i]}));
  ranked.sort((a,b)=>b.score-a.score);
  const leader=ranked[0];
  const title=UI.lang==='zh'?'本盘结束':'セット終了';
  const body=UI.lang==='zh'
    ? `${tr('matchTotal','合计分')}: ${ranked.map(r=>`${r.name} ${r.score}`).join(' / ')}`
    : `${tr('matchTotal','合計点')}: ${ranked.map(r=>`${r.name} ${r.score}`).join(' / ')}`;
  const detail=UI.lang==='zh'
    ? `领先: ${leader?leader.name:'—'} (${leader?leader.score:0}分)\n${ranked.map((r,n)=>`${n+1}. ${r.name} ${r.score}`).join('\n')}`
    : `トップ: ${leader?leader.name:'—'} (${leader?leader.score:0}点)\n${ranked.map((r,n)=>`${n+1}. ${r.name} ${r.score}`).join('\n')}`;
  showOverlay(title,body,detail);
  refreshOverlayLocale();
}

function startGame(){
  GameSFX.playBgm('table');
  maybeShowRulesPrimerThen(beginMatch);
}

function canFormMelds(tiles,n){
  if(tiles.length!==n*3) return false;
  if(n===0) return true;
  const s=sortTiles(tiles), f=s[0];
  if(countTile(s,f)>=3){const r=removeTiles(s,[f,f,f]);if(r&&canFormMelds(r,n-1))return true;}
  if(f.suit!=='z'&&f.num<=7){
    const f2={suit:f.suit,num:f.num+1},f3={suit:f.suit,num:f.num+2};
    const r=removeTiles(s,[f,f2,f3]);if(r&&canFormMelds(r,n-1))return true;
  }
  return false;
}

function allTileTypes(){
  const out=[];
  for(const suit of ['m','p','s']) for(let num=1;num<=9;num++) out.push({suit,num});
  for(let i=0;i<4;i++) out.push({suit:'z',num:5});
  return out;
}

function meldDecompositions(tiles){
  if(tiles.length===0) return [[]];
  const s=sortTiles(tiles), f=s[0], out=[];
  if(countTile(s,f)>=3){
    const r=removeTiles(s,[f,f,f]);
    if(r) for(const rest of meldDecompositions(r)) out.push([[f,f,f],...rest]);
  }
  if(f.suit!=='z'&&f.num<=7){
    const f2={suit:f.suit,num:f.num+1}, f3={suit:f.suit,num:f.num+2};
    const r=removeTiles(s,[f,f2,f3]);
    if(r) for(const rest of meldDecompositions(r)) out.push([[f,f2,f3],...rest]);
  }
  return out;
}

function winningDecompositions(fullHand){
  if(fullHand.length%3!==2) return [];
  const s=sortTiles(fullHand), out=[];
  for(const pair of uniq(s)){
    if(countTile(s,pair)<2) continue;
    const rest=removeTiles(s,[pair,pair]);
    if(!rest) continue;
    for(const melds of meldDecompositions(rest)){
      out.push({pair:[pair,pair],melds});
    }
  }
  return out;
}

function waitTypesForWin(hand, winTile){
  const types=new Set();
  const full=sortTiles([...hand,winTile]);
  for(const d of winningDecompositions(full)){
    if(d.pair.some(t=>tileEq(t,winTile))) types.add('tanki');
    for(const group of d.melds){
      if(!group.some(t=>tileEq(t,winTile))) continue;
      if(isTriplet(group)) types.add('shanpon');
      else if(isSeq(group)){
        const seq=sortTiles(group);
        types.add(tileEq(seq[1],winTile)?'katan':'side');
      }
    }
  }
  return types;
}

function isPureKatanWin(hand, winTile){
  const types=waitTypesForWin(hand,winTile);
  return types.size===1&&types.has('katan');
}

function standardWaits(hand){
  if(hand.length<4||(hand.length-1)%3!==0) return [];
  return allTileTypes().filter(t=>countTile(hand,t)<4&&winningDecompositions([...hand,t]).length>0);
}

function getKatanWaits(hand){
  const n=hand.length;
  if(n<4||(n-4)%3!==0) return [];
  const waits=standardWaits(hand);
  const katan=waits.filter(w=>isPureKatanWin(hand,w));
  // 扣聴は「嵌張だけで上がれる」形に限定する。单钓/双碰/辺張/両面が混ざる形は不可。
  if(katan.length!==waits.length) return [];
  return katan;
}

function isTriplet(tiles){return tiles.length===3&&tileEq(tiles[0],tiles[1])&&tileEq(tiles[1],tiles[2]);}
function isSeq(tiles){
  if(tiles.length!==3) return false;
  const s=sortTiles(tiles);
  return s[0].suit===s[1].suit&&s[1].suit===s[2].suit&&s[0].suit!=='z'&&
    s[1].num===s[0].num+1&&s[2].num===s[1].num+1;
}

function hasTriplInDecomp(tiles,n){
  if(n===0) return false;
  const s=sortTiles(tiles),f=s[0];
  if(countTile(s,f)>=3){
    const r=removeTiles(s,[f,f,f]);
    if(r&&canFormMelds(r,n-1)) return true;
  }
  if(f.suit!=='z'&&f.num<=7){
    const f2={suit:f.suit,num:f.num+1},f3={suit:f.suit,num:f.num+2};
    const r=removeTiles(s,[f,f2,f3]);
    if(r&&hasTriplInDecomp(r,n-1)) return true;
  }
  return false;
}

// Check ALL Harbin + katan win conditions
function checkWin(player, winTile){
  if(!winTile) return false;
  // 1. Katan: winTile is in katan waits
  const waits=getKatanWaits(player.hand);
  if(!waits.some(w=>tileEq(w,winTile))) return false;
  // 2. 開門 — チー・ポン・大明槓のいずれか必須（鳴きなし扣聴は不可）
  if(player.melds.length===0) return false;
  // All tiles
  const allTiles=[...player.hand,winTile,...player.melds.flatMap(m=>m.tiles)];
  // 3. ヤオ九
  if(!allTiles.some(t=>t.suit==='z'||t.num===1||t.num===9)) return false;
  // 4. 2+ suits
  const suits=new Set(allTiles.filter(t=>t.suit!=='z').map(t=>t.suit));
  if(suits.size<2) return false;
  // 5. triplet + sequence — 面子が実際に組めること
  return winningDecompositions([...player.hand,winTile]).length>0;
}

function getChiOptions(hand, tile){
  if(tile.suit==='z') return [];
  const opts=[];
  const pairs=[[tile.num-2,tile.num-1],[tile.num-1,tile.num+1],[tile.num+1,tile.num+2]];
  for(const [n1,n2] of pairs){
    if(n1<1||n1>9||n2<1||n2>9) continue;
    const t1={suit:tile.suit,num:n1},t2={suit:tile.suit,num:n2};
    if(hand.some(x=>tileEq(x,t1))&&hand.some(x=>tileEq(x,t2)))
      opts.push([t1,t2]);
  }
  return opts;
}
function getAnkanOptions(hand){
  return uniq(hand).filter(t=>countTile(hand,t)>=4);
}
/** ポン＋手牌1枚で加槓可能な候補 */
function getShouminkanOptions(p){
  const opts=[];
  if(!p||!p.melds) return opts;
  p.melds.forEach((m,mi)=>{
    if(m.type!=='pon') return;
    const t=m.calledTile||m.tiles[0];
    if(countTile(p.hand,t)>=1) opts.push({tile:t,meldIndex:mi});
  });
  return opts;
}
function getPostDrawKanOptions(p){
  return {ankan:getAnkanOptions(p.hand),shouminkan:getShouminkanOptions(p)};
}
function getTurnStartKanOptions(p){
  if(!p||p.kouTing||G.kanBranchBActive||G.discardedThisTurn) return {ankan:[],shouminkan:[]};
  return getPostDrawKanOptions(p);
}
function hasPostDrawKanOffer(post){
  return !!(post&&(post.ankan.length||post.shouminkan.length));
}
function drawRinshanTile(pi){
  const p=G.players[pi];
  if(G.wall.length===0){
    if(!G.treasureUsed){
      G.treasureUsed=true;
      const drawn=G.treasure;
      appendDrawToHandRight(p,drawn);
      updateAllTenpai();
      return drawn;
    }
    endRound(tr('roundDraw','流局'));
    return null;
  }
  const drawn=G.wall.pop();
  appendDrawToHandRight(p,drawn);
  updateAllTenpai();
  return drawn;
}
function checkRinshanWin(pi,drawn){
  if(!drawn) return false;
  const p=G.players[pi];
  const handWithout=removeTile(p.hand,drawn);
  const waitsBefore=handWithout?getKatanWaits(handWithout):[];
  const canTsumo=handWithout&&waitsBefore.some(w=>tileEq(w,drawn))&&checkWin({...p,hand:handWithout},drawn);
  if(!canTsumo) return false;
  if(p.isHuman){
    G.tsumoTile=drawn;
    G.humanOptions=['tsumo'];
    G.msg=UI.lang==='zh'?`岭上开花！(${tileName(drawn)})`:`嶺上開花！ (${tileName(drawn)})`;
    render();
  }else{
    resolveWin(pi,drawn,true,false);
  }
  return true;
}
function applySelfKanMeld(p,spec){
  const t=spec.tile;
  if(spec.kind==='ankan'){
    const newHand=removeTiles(p.hand,[t,t,t,t]);
    if(!newHand) return false;
    p.hand=sortTiles(newHand);
    p.melds.push({type:'ankan',tiles:[t,t,t,t],from:p.idx,concealed:true});
    return true;
  }
  const m=p.melds[spec.meldIndex];
  if(!m||m.type!=='pon') return false;
  const newHand=removeTile(p.hand,t);
  if(!newHand) return false;
  p.hand=sortTiles(newHand);
  p.melds[spec.meldIndex]={
    type:'kan',tiles:[t,t,t,t],from:m.from,calledTile:t,calledDiscardIdx:m.calledDiscardIdx
  };
  return true;
}
function executeSelfKan(pi,spec,branch){
  const p=G.players[pi];
  if(!p||p.kouTing) return;
  if(!applySelfKanMeld(p,spec)) return;
  const label=spec.kind==='shouminkan'?tr('shouminkan','加槓'):tr('ankan','暗槓');
  addLog(`${p.isHuman?sideName(0):p.name}が${label}！${tileName(spec.tile)}`);
  playActionFx('kan',`${p.isHuman?sideName(0):p.name} `,{
    actor:pi,
    meldTiles:[spec.tile,spec.tile,spec.tile,spec.tile]
  });
  updateAllTenpai();
  const drawn=drawRinshanTile(pi);
  if(checkRinshanWin(pi,drawn)) return;
  G.kanBranchAOpts=null;
  G.humanOptions=[];
  if(branch==='A'){
    G.kanTurnEnding=true;
    p.drawnTile=drawn;
    if(p.isHuman) G.lastDrawn=drawn;
    G.msg=UI.lang==='zh'?`杠后补牌: ${tileName(drawn)}。下家`:`嶺上補充: ${tileName(drawn)}。次へ`;
    render();
    scheduleMatch(()=>{G.kanTurnEnding=false;nextTurn(pi);},450);
    return;
  }
  G.kanBranchBActive=true;
  p.drawnTile=null;
  if(p.isHuman) G.lastDrawn=null;
  G.turn=pi;
  G.phase='discard';
  G.msg=UI.lang==='zh'?'杠后请选择打牌（先切后摸）':'カン後、捨て牌を選んでください（先切後引）';
  render();
  if(!p.isHuman) scheduleMatch(()=>aiDiscard(pi),500);
}
function tryOfferPostDrawKan(fromPi){
  const p=G.players[fromPi];
  if(!p||p.kouTing) return false;
  const post=getPostDrawKanOptions(p);
  if(!hasPostDrawKanOffer(post)) return false;
  if(p.isHuman){
    G.kanBranchAOpts=post;
    G.turn=fromPi;
    G.phase='discard';
    G.msg=tr('kanAfterDraw','摸牌後カンできます（スキップで次へ）');
    render();
    return true;
  }
  if(Math.random()<(aiLevel().kanRate||0.12)){
    const spec=post.ankan.length
      ?{kind:'ankan',tile:post.ankan[0]}
      :{kind:'shouminkan',tile:post.shouminkan[0].tile,meldIndex:post.shouminkan[0].meldIndex};
    executeSelfKan(fromPi,spec,'A');
    return true;
  }
  return false;
}
function aiMaybeTurnStartKan(pi){
  const p=G.players[pi];
  if(!p||p.kouTing||G.discardedThisTurn||G.kanBranchBActive) return false;
  const ts=getTurnStartKanOptions(p);
  if(!hasPostDrawKanOffer(ts)) return false;
  if(Math.random()>(aiLevel().kanRate||0.12)) return false;
  const spec=ts.ankan.length
    ?{kind:'ankan',tile:ts.ankan[0]}
    :{kind:'shouminkan',tile:ts.shouminkan[0].tile,meldIndex:ts.shouminkan[0].meldIndex};
  executeSelfKan(pi,spec,'B');
  return true;
}
function parseTileKey(k){
  return {suit:k[0],num:Number(k.slice(1))};
}

// GAME STATE
// ======================================================
let G=null;
let MATCH=null;
const MATCH_TOTAL_ROUNDS=10;
let MATCH_EPOCH=0;

function scheduleMatch(fn, ms){
  if(!G) return;
  const ep=G._epoch;
  setTimeout(()=>{ if(!G||G._epoch!==ep) return; fn(); }, ms);
}

function startRound(){
  if(!MATCH) MATCH={scores:[0,0,0,0],round:1,totalRounds:MATCH_TOTAL_ROUNDS,dealer:0,finished:false};
  MATCH_EPOCH++;
  clearTurnTimer();
  clearMeldFx();
  document.removeEventListener('keydown',_overlayTrapKey,true);
  _overlayFocusPrev=null;
  document.getElementById('overlay').classList.add('hidden');
  GameSFX.play('tap');
  fxVibrate(12);
  const deck=shuffle(createDeck());
  const treasure=deck[deck.length-1];
  const wall=deck.slice(0,deck.length-1);
  const dealerReal=MATCH.dealer||0;
  const dealt=dealHarbinHands(wall,dealerReal);
  const realHands=dealt.hands.map(h=>sortTiles(h));
  // dealt.wall は wall と同一参照。length=0 すると残り牌が消えるので触らない
  const players=[0,1,2,3].map(view=>{
    const real=offlineRealSeat(view);
    return {
      idx:view,
      realSeat:real,
      name:windLabelForRealSeat(real, dealerReal),
      isHuman:view===0,
      hand:realHands[real],
      melds:[],
      discards:[],
      isTenpai:false,
      kouTing:false,
      waits:[],
      drawnTile:null,
    };
  });
  const dealerView=offlineViewSeat(dealerReal);
  const roundLabel=tr('matchRound','第{n} / {t}局').replace('{n}',String(MATCH.round)).replace('{t}',String(MATCH.totalRounds));
  const dealerName=windLabelForRealSeat(dealerReal, dealerReal);
  G={
    players,wall,treasure,
    turn:dealerView,
    dealer:dealerView,
    dealerReal,
    phase:'discard',
    pendingDiscard:null,
    pendingFrom:-1,
    humanOptions:[],
    chiOpts:[],
    ankanOpts:[],
    selectedChi:null,
    scores:MATCH.scores,
    treasureUsed:false,
    msg:UI.lang==='zh'
      ? `${roundLabel}。庄家 ${dealerName}。先出后摸，逆时针。`
      : `${roundLabel}。親は${dealerName}。先出後引き・半時計回り。`,
    log:[],
    gameOver:false,
    roundOver:false,
    handsRevealed:false,
    lastDrawn:null,
    tsumoTile:null,
    dealerOpeningDiscardNoDraw:true,
    skipDrawAfterCallBy:null,
    pendingKouTingFrom:null,
    kouTingPick:false,
    kouTingTreasurePending:false,
    kouTingTreasureSeen:false,
    lastDiscardMeta:null,
    ktReveal:null,
    lastWin:null,
    fxFlash:null,
    kanBranchBActive:false,
    kanBranchAOpts:null,
    discardedThisTurn:false,
    kanTurnEnding:false,
    _epoch:MATCH_EPOCH,
  };
  updateAllTenpai();
  beginRoundDealCinema(()=>{
    if(!G||G._epoch!==MATCH_EPOCH) return;
    beginActiveTurn();
  });
}

// 扣聴: 摸牌直後に和了条件を満たす嵌張待ちだけ自動移行（13枚だけでは入らない）。
function updateAllTenpai(){
  for(const p of G.players){
    const exp=expectedHandCount(p);
    const atDiscardReady=(p.hand.length-4)%3===0;
    const atDrawReady=p.hand.length===exp+1;
    const drawn=p.drawnTile||(p.isHuman?G.lastDrawn:null);
    const atPostMainDraw=p.hand.length===exp&&handHasDrawnRef(p,drawn);
    if(!atDiscardReady&&!atDrawReady&&!atPostMainDraw) continue;
    const basis=atDrawReady||atPostMainDraw?concealedHandForTenpai(p):p.hand;
    const w=getKatanWaits(basis);
    if(p.kouTing){
      if(!p.melds?.length){p.kouTing=false;p.waits=[];}
      else p.waits=w;
    }
    if(!p.kouTing&&(atDrawReady||atPostMainDraw)&&drawn){
      if(shouldEnterKouTing(p,drawn)){
        p.kouTing=true;
        p.waits=w;
        if(tryResolveKouTingTreasureWin(p.idx)) continue;
        if(p.isHuman) addLog(`${sideName(p.idx)}が扣聴！${tr('waiting','待ち')}: ${w.map(tileName).join(' ')}`);
        else addLog(`${p.name}が扣聴`);
      }
    }
  }
}

function addLog(msg){G.log.unshift(msg);if(G.log.length>8)G.log.pop();}
// 面子1組あたり手牌から3枚相当が表に出る扱い（暗槓・大明槓も1組として数える＝嶺上1枚とセットで帳尻）
const expectedHandCount = p => Math.max(1,13-(p.melds.length*3));
const sideName = i => {
  if(G?.players?.[i]?.name) return G.players[i].name;
  const dealerReal=MATCH?.dealer??G?.dealerReal??0;
  return windLabelForView(i, dealerReal);
};
const tilesText = tiles => (tiles&&tiles.length)?sortTiles(tiles).map(tileName).join(' '):(UI.lang==='zh'?'无':'なし');

function appendDrawToHandRight(p,drawn){
  p.hand=[...p.hand,drawn];
  p.drawnTile=drawn;
  if(p.isHuman) G.lastDrawn=drawn;
}

/** 手牌配列内で ref と同一オブジェクトのインデックス（摸牌は通常末尾＝最右表示） */
function handIndexOfTileRef(p,ref){
  if(!p||!ref) return -1;
  for(let i=p.hand.length-1;i>=0;i--) if(p.hand[i]===ref) return i;
  return -1;
}

/** 扣聴: その1枚を外しても嵌張待ちが残る捨て候補（摸牌直後は引いた牌を必ず含める） */
function kouTingLegalDiscardIndices(p){
  if(!p||!p.kouTing) return [];
  const exp=expectedHandCount(p);
  const keep=p.waits&&p.waits.length?p.waits:null;
  const out=[];
  for(let i=0;i<p.hand.length;i++){
    const nh=p.hand.filter((_,j)=>j!==i);
    const w=getKatanWaits(nh);
    if(!w.length) continue;
    if(keep&&!keep.every(ww=>w.some(x=>tileEq(x,ww)))) continue;
    out.push(i);
  }
  if(p.hand.length===exp+1){
    const drawn=p.drawnTile||(p.isHuman&&G?G.lastDrawn:null);
    const di=drawn?handIndexOfTileRef(p,drawn):p.hand.length-1;
    if(di>=0&&!out.includes(di)) out.push(di);
  }
  return out;
}

function checkTsumoAfterDraw(pi,drawn){
  const p=G.players[pi];
  const basis=kouTingBasisHand(p,drawn);
  if(!basis) return false;
  const waits=getKatanWaits(basis);
  if(!waits.some(w=>tileEq(w,drawn))) return false;
  return checkWin({...p,hand:basis,kouTing:p.kouTing},drawn);
}

function handHasDrawnRef(p,drawn){
  return !!(drawn&&p.hand.some(t=>t===drawn||tileEq(t,drawn)));
}

function kouTingBasisHand(p,drawn){
  const exp=expectedHandCount(p);
  if(!p||!drawn) return null;
  if(p.hand.length===exp+1) return removeTile(p.hand,drawn);
  if(p.hand.length===exp&&handHasDrawnRef(p,drawn)) return [...p.hand];
  return null;
}

function concealedHandForTenpai(p){
  const exp=expectedHandCount(p);
  const drawn=p.drawnTile||(p.isHuman?G.lastDrawn:null);
  if(p.hand.length===exp+1&&drawn){
    const hw=removeTile(p.hand,drawn);
    return hw||p.hand;
  }
  if(p.hand.length===exp&&handHasDrawnRef(p,drawn)) return [...p.hand];
  return p.hand;
}

function shouldEnterKouTing(p,drawn){
  if(!drawn||p.kouTing||!p.melds?.length) return false;
  const basis=kouTingBasisHand(p,drawn);
  if(!basis||(basis.length-4)%3!==0) return false;
  const waits=getKatanWaits(basis);
  if(!waits.length) return false;
  const pseudo={...p,hand:basis,kouTing:true};
  return waits.some(w=>checkWin(pseudo,w));
}

/** チー/ポン直後など exp+1 枚: この牌を捨てれば扣聴に入れる手牌インデックス */
function kouTingEntryDiscardIndices(p){
  if(!p||p.kouTing||!p.melds?.length) return [];
  const exp=expectedHandCount(p);
  const hand=sortTiles([...p.hand]);
  if(hand.length!==exp+1) return [];
  const out=[];
  for(let i=0;i<hand.length;i++){
    const basis=hand.filter((_,j)=>j!==i);
    const waits=getKatanWaits(basis);
    if(!waits.length) continue;
    const pseudo={...p,hand:basis,kouTing:true};
    if(!waits.some(w=>checkWin(pseudo,w))) continue;
    out.push(i);
  }
  return out;
}

function kouTingWaitsMatchTreasure(waits){
  return !!(G?.treasure&&waits?.length&&waits.some(w=>tileEq(w,G.treasure)));
}

/** 宝引き和了が宝中宝か（和了牌を除いた手牌の嵌張待ちに宝牌が含まれるか） */
function playerWaitsForTreasure(p,winTile){
  if(!p?.kouTing||!G?.treasure||!winTile||!tileEq(winTile,G.treasure)) return false;
  const handWithout=removeTile([...p.hand],winTile);
  if(!handWithout) return false;
  return kouTingWaitsMatchTreasure(getKatanWaits(handWithout));
}

/** 山切れ後の宝引き: 和了可なら宝中宝／通常ツモを判定して resolve */
function resolveKouTingTreasureDraw(pi,drawn){
  const p=G.players[pi];
  if(!p||!checkWin(p,drawn)){
    endRound(tr('roundDraw','流局'));
    return;
  }
  const isBao=playerWaitsForTreasure(p,drawn);
  if(p.isHuman){
    if(isBao){
      G.msg=tr('kouTingTreasureWin','扣聴！待ち牌が宝牌と一致 — 宝中宝！');
      G.phase='discard';
      render();
      scheduleMatch(()=>resolveWin(pi,drawn,true,true),900);
    }else{
      G.tsumoTile=drawn;
      G.msg=`${tr('tsumo','ツモ！')} ${tileName(drawn)}`;
      G.phase='discard';
      G.humanOptions=[];
      render();
      scheduleMatch(()=>resolveWin(pi,drawn,true,false),700);
    }
    return;
  }
  resolveWin(pi,drawn,true,isBao);
}

/** 扣聴中: 摸牌後は先に1枚捨ててから（手牌＝exp）宝中宝ボタンを出す */
function canOfferKouTingTreasureNow(pi){
  const p=G?.players?.[pi];
  if(!p?.kouTing||!kouTingWaitsMatchTreasure(p.waits)) return false;
  return p.hand.length===expectedHandCount(p);
}

function maybeBeginKouTingTreasureAfterReady(pi){
  if(!canOfferKouTingTreasureNow(pi)) return false;
  const p=G.players[pi];
  if(!p.isHuman) return tryResolveKouTingTreasureWin(pi);
  return beginKouTingTreasureChoice(pi);
}

/** 人間: 扣聴後・待ち＝宝牌のとき、宝確認→宝中宝ボタンで和了（即自動和了しない） */
function beginKouTingTreasureChoice(pi){
  if(!G||G.gameOver) return true;
  const p=G.players[pi];
  if(!canOfferKouTingTreasureNow(pi)||!p?.isHuman||!G.treasure) return false;
  G.kouTingTreasurePending=true;
  G.kouTingTreasureSeen=false;
  G.turn=pi;
  G.phase='discard';
  G.humanOptions=[];
  G.msg=tr('kouTingTreasurePrompt','扣聴成立。待ちが宝牌と一致しています。「宝を見る」で確認してください');
  render();
  return true;
}

function humanRevealKouTingTreasure(){
  if(G?.online){
    if(onlineLegal('reveal_treasure')) onlineAction('reveal_treasure');
    return;
  }
  if(!G?.kouTingTreasurePending||G.kouTingTreasureSeen) return;
  G.kouTingTreasureSeen=true;
  G.msg=tr('kouTingTreasureReady','宝牌を確認しました。「宝中宝！」で和了できます');
  GameSFX.play('draw');
  fxVibrate(18);
  render();
}

function humanClaimKouTingTreasure(){
  if(G?.online){
    if(onlineLegal('treasure_win')) onlineAction('treasure_win');
    return;
  }
  if(!G?.kouTingTreasurePending||!G.kouTingTreasureSeen) return;
  const p=G.players[0];
  if(!p?.kouTing||!kouTingWaitsMatchTreasure(p.waits)||!G.treasure) return;
  G.kouTingTreasurePending=false;
  G.treasureUsed=true;
  addLog(`${sideName(0)} ${tr('kouTingTreasureWin','扣聴！待ち牌が宝牌と一致 — 宝中宝！')}`);
  resolveWin(0,G.treasure,true,true);
}

/** 扣聴成立直後: 待ち牌に宝牌が含まれれば宝中宝（AIは即和了・人間は手動） */
function tryResolveKouTingTreasureWin(pi){
  if(!G||G.gameOver||G.roundOver) return false;
  const p=G.players[pi];
  if(!p?.kouTing||!kouTingWaitsMatchTreasure(p.waits)) return false;
  if(!G.treasure) return false;
  if(p.isHuman) return maybeBeginKouTingTreasureAfterReady(pi);
  G.treasureUsed=true;
  addLog(`${sideName(pi)} ${tr('kouTingTreasureWin','扣聴！待ち牌が宝牌と一致 — 宝中宝！')}`);
  resolveWin(pi,G.treasure,true,true);
  return true;
}

function enterKouTingByDiscard(p,tileIdx,fromEl){
  const tile=p.hand[tileIdx];
  if(!tile||!p.melds?.length) return false;
  const pi=p.idx;
  noteDiscardMeta(pi,tile);
  armDiscardFlight(pi,tile,fromEl);
  p.hand=p.hand.filter((_,i)=>i!==tileIdx);
  p.hand=sortTiles(p.hand);
  pushPlayerDiscard(p,tile);
  p.drawnTile=null;
  G.lastDrawn=null;
  p.kouTing=true;
  p.waits=getKatanWaits(p.hand);
  G.kouTingPick=false;
  if(tryResolveKouTingTreasureWin(pi)) return true;
  updateAllTenpai();
  addLog(`${sideName(pi)}が扣聴！${tr('waiting','待ち')}: ${(p.waits||[]).map(tileName).join(' ')}`);
  GameSFX.play('discard');
  fxVibrate(22);
  afterDiscard(pi,tile);
  flushDiscardFlight();
  return true;
}

/** 通常手番: 捨てたあとの本引きで扣聴に入れる牌（捨て候補ごとに判定） */
function discardBasesForKouTingHint(p){
  const exp=expectedHandCount(p);
  const out=[];
  const seen=new Set();
  const push=(hand)=>{
    if(hand.length!==exp) return;
    const key=sortTiles(hand).map(tileKey).join(',');
    if(seen.has(key)) return;
    seen.add(key);
    out.push(hand);
  };
  if(p.hand.length===exp+1){
    for(let i=0;i<p.hand.length;i++) push(p.hand.filter((_,j)=>j!==i));
  }else if(p.hand.length===exp){
    push(p.hand);
  }
  return out;
}

function kouTingNearDrawTiles(p){
  if(!p||p.kouTing) return [];
  const exp=expectedHandCount(p);
  if(p.hand.length!==exp+1) return [];
  const found=new Map();
  for(const basis of discardBasesForKouTingHint(p)){
    for(const T of allTileTypes()){
      if(countTile(basis,T)>=4) continue;
      const hand14=[...basis,T];
      const pseudo={...p,hand:hand14};
      if(shouldEnterKouTing(pseudo,T)) found.set(tileKey(T),T);
    }
  }
  return sortTiles([...found.values()]);
}

function formatKtNearDrawHint(tiles){
  if(!tiles||!tiles.length) return '';
  const maxShow=12;
  if(tiles.length<=maxShow) return tiles.map(tileName).join(' ');
  return `${tiles.slice(0,maxShow).map(tileName).join(' ')} …`;
}

/* SE（ogg 優先、失敗時は Web Audio）と BGM */
const GameSFX=(function(){
  let ctx=null;
  let bgmEl=null;
  let bgmName='';
  const clips=new Map();
  const FILES={
    discard:'audio/discard.ogg',draw:'audio/draw.ogg',chi:'audio/chi.ogg',pon:'audio/pon.ogg',
    kan:'audio/kan.ogg',win:'audio/win.ogg',skip:'audio/skip.ogg',tap:'audio/tap.ogg',
    deal:'audio/deal.ogg',round:'audio/round.ogg',gacha:'audio/gacha.ogg',reveal:'audio/reveal.ogg',
    kt_discard:'audio/kt_discard.ogg',dice:'audio/dice.ogg',dice_land:'audio/dice_land.ogg'
  };
  const BGM={title:'audio/bgm-title.ogg',table:'audio/bgm-table.ogg'};
  const getCtx=()=>{
    if(ctx) return ctx;
    const C=window.AudioContext||window.webkitAudioContext;
    if(!C) return null;
    ctx=new C();
    return ctx;
  };
  const resume=c=>{if(c&&c.state==='suspended') c.resume().catch(()=>{});};
  const tone=(freq,dur,type,vol,t0)=>{
    const c=getCtx();if(!c)return;
    resume(c);
    const t=c.currentTime+(t0||0);
    const o=c.createOscillator();
    const g=c.createGain();
    o.type=type||'sine';
    o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);g.connect(c.destination);
    o.start(t);o.stop(t+dur+0.03);
  };
  const playToneFallback=(name)=>{
    switch(name){
      case 'discard':tone(540,0.038,'triangle',0.075,0);tone(360,0.032,'triangle',0.045,0.04);break;
      case 'draw':tone(720,0.055,'sine',0.065,0);tone(880,0.04,'sine',0.04,0.05);break;
      case 'chi':tone(920,0.055,'sine',0.08,0);tone(740,0.045,'sine',0.055,0.06);break;
      case 'pon':tone(420,0.065,'square',0.055,0);tone(620,0.05,'square',0.045,0.07);break;
      case 'kan':tone(300,0.1,'sine',0.085,0);tone(220,0.08,'sine',0.06,0.09);break;
      case 'win':[523,659,784].forEach((f,i)=>{setTimeout(()=>tone(f,0.12,'sine',0.06,0),i*72);});break;
      case 'skip':tone(320,0.045,'sine',0.04,0);break;
      case 'tap':tone(800,0.028,'sine',0.045,0);break;
      case 'deal':tone(420,0.03,'triangle',0.05,0);tone(560,0.022,'sine',0.035,0.03);break;
      case 'round':tone(280,0.08,'triangle',0.05,0);break;
      case 'gacha':
        for(let i=0;i<7;i++) tone(340+i*75,0.038,'square',0.055-i*0.0055, i*0.058);
        break;
      case 'reveal':
        tone(520,0.05,'sine',0.06,0);tone(740,0.07,'sine',0.075,0.055);tone(990,0.09,'sine',0.065,0.1);
        break;
      case 'kt_discard':tone(220,0.06,'triangle',0.072,0);tone(180,0.045,'triangle',0.048,0.065);break;
      case 'dice':
        for(let i=0;i<8;i++) tone(180+Math.random()*520,0.04,'square',0.04,i*0.045);
        break;
      case 'dice_land':tone(260,0.06,'triangle',0.07,0);tone(140,0.08,'sine',0.05,0.04);break;
      default:break;
    }
  };
  return{
    preload(){
      Object.entries(FILES).forEach(([k,src])=>{
        const a=new Audio(src);
        a.preload='auto';
        clips.set(k,a);
      });
    },
    setMuted(on){
      UI.muted=!!on;
      if(bgmEl) bgmEl.muted=UI.muted;
    },
    play(name){
      if(UI.muted) return;
      const clip=clips.get(name);
      if(clip){
        try{
          const n=clip.cloneNode();
          n.volume=0.72;
          const p=n.play();
          if(p&&p.catch) p.catch(()=>playToneFallback(name));
          return;
        }catch(_e){}
      }
      playToneFallback(name);
    },
    playBgm(which){
      const src=BGM[which];
      if(!src) return;
      if(bgmName===which && bgmEl && !bgmEl.paused) return;
      try{
        if(bgmEl){bgmEl.pause();bgmEl=null;}
        bgmEl=new Audio(src);
        bgmEl.loop=true;
        bgmEl.volume=which==='title'?0.32:0.22;
        bgmEl.muted=!!UI.muted;
        bgmName=which;
        const p=bgmEl.play();
        if(p&&p.catch) p.catch(()=>{});
      }catch(_e){}
    }
  };
})();

let _overlayFocusPrev=null;
function _overlayTrapKey(ev){
  const ov=document.getElementById('overlay');
  if(!ov||ov.classList.contains('hidden')) return;
  if(ev.key==='Escape'){ev.preventDefault();closeOverlay();return;}
  if(ev.key!=='Tab') return;
  const box=ov.querySelector('.overlay-box');
  if(!box) return;
  const sel='button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])';
  const list=[].filter.call(box.querySelectorAll(sel),el=>!el.disabled&&el.offsetParent!==null);
  if(!list.length) return;
  const first=list[0],last=list[list.length-1];
  if(ev.shiftKey){if(document.activeElement===first){ev.preventDefault();last.focus();}}
  else{if(document.activeElement===last){ev.preventDefault();first.focus();}}
}

function closeOverlay(){
  document.removeEventListener('keydown',_overlayTrapKey,true);
  document.getElementById('overlay').classList.add('hidden');
  if(_overlayFocusPrev&&typeof _overlayFocusPrev.focus==='function'){
    try{_overlayFocusPrev.focus();}catch(_e){}
  }
  _overlayFocusPrev=null;
}

function showOverlay(title, body, detail){
  refreshOverlayLocale();
  document.getElementById('ov-title').textContent=title||'';
  document.getElementById('ov-body').textContent=body||'';
  document.getElementById('ov-detail').textContent=detail||'';
  const ov=document.getElementById('overlay');
  document.removeEventListener('keydown',_overlayTrapKey,true);
  _overlayFocusPrev=document.activeElement;
  ov.classList.remove('hidden');
  document.addEventListener('keydown',_overlayTrapKey,true);
  requestAnimationFrame(function(){
    const btn=document.getElementById('ov-view-btn');
    if(btn) btn.focus();
  });
  refreshOverlayLocale();
}

let _meldFxTimer=null;

function clearMeldFx(){
  if(_meldFxTimer){clearTimeout(_meldFxTimer);_meldFxTimer=null;}
  document.body.classList.remove('mfx-active');
  const shell=document.querySelector('.table-shell');
  if(shell) shell.removeAttribute('data-mfx-seat');
  if(shell) shell.style.removeProperty('--mfx-glow');
  const root=document.getElementById('meld-fx');
  if(!root) return;
  root.className='';
  root.setAttribute('aria-hidden','true');
  root.innerHTML='';
}

function seatAnchorRect(pi, role){
  const area=document.querySelector(MELD_FX_SEAT_ROOT[pi]);
  if(!area) return null;
  let el=null;
  if(role==='meld'){
    const groups=area.querySelectorAll('.meld-group');
    el=groups.length?groups[groups.length-1]:area.querySelector('.melds-row')||area.querySelector('#human-rack-wrap')||area;
  }else if(role==='discard'){
    const root=discardRiverRoot(pi);
    el=root?document.querySelector(`${root} .tile:last-child`):null;
  }else if(role==='hand'){
    el=area.querySelector('#human-hand')||area.querySelector('.tiles-row:last-child')||area.querySelector('.side-col')||area;
  }
  if(!el) return null;
  const r=el.getBoundingClientRect();
  if(!r.width&&!r.height) return null;
  return {x:r.left+r.width/2,y:r.top+r.height/2,w:r.width,h:r.height};
}

function seatAnchorPoint(pi, role){
  const r=seatAnchorRect(pi, role);
  return r?{x:r.x,y:r.y}:null;
}

function meldFxFlightTiles(kind, tile, meldTiles){

function addMeldFxFlight(layer, tile, from, to, delay, animCls, faceDown){
  const wrap=document.createElement('div');
  wrap.innerHTML=tileHTML(tile, 'mfx-tile', faceDown);
  const el=wrap.firstElementChild;
  if(!el) return;
  el.classList.add('mfx-flight', animCls);
  const sw=to.w>0?Math.min(34,Math.max(22,to.w/3)):28;
  const sh=to.h>0?Math.min(48,Math.max(32,to.h)):40;
  el.style.width=sw+'px';
  el.style.height=sh+'px';
  const hw=sw/2, hh=sh/2;
  el.style.left=(from.x-hw)+'px';
  el.style.top=(from.y-hh)+'px';
  el.style.setProperty('--tx',(to.x-from.x)+'px');
  el.style.setProperty('--ty',(to.y-from.y)+'px');
  if(delay) el.style.animationDelay=delay+'ms';
  layer.appendChild(el);
}

function addMeldFxBeam(root, from, to){
  const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('class','mfx-beam');
  const line=document.createElementNS('http://www.w3.org/2000/svg','line');
  line.setAttribute('x1', from.x);
  line.setAttribute('y1', from.y);
  line.setAttribute('x2', to.x);
  line.setAttribute('y2', to.y);
  line.setAttribute('pathLength','1');
  svg.appendChild(line);
  root.appendChild(svg);
}

function runMeldFx(spec){
  const root=document.getElementById('meld-fx');
  if(!root||!G) return;
  clearMeldFx();
  root.setAttribute('aria-hidden','false');
  root.classList.add('show',`mfx-${spec.kind}`);
  document.body.classList.add('mfx-active');
  const shell=document.querySelector('.table-shell');
  if(shell) shell.setAttribute('data-mfx-seat', String(spec.actor));

  const target=seatAnchorRect(spec.actor,'meld');
  if(!target){clearMeldFx();return;}
  const isAnkan=spec.kind==='ankan';
  const source=(!isAnkan&&spec.from!=null&&spec.from>=0)?seatAnchorPoint(spec.from,'discard'):seatAnchorPoint(spec.actor,'hand');
  const targetPt={x:target.x,y:target.y,w:target.w,h:target.h};
  const glow={chi:'#6adfd5',pon:'#ff6a2f',minkan:'#ffd94a',ankan:'#8aa0ff'};
  if(shell) shell.style.setProperty('--mfx-glow',glow[spec.kind]||'#78fff0');

  const veil=document.createElement('div');
  veil.className='mfx-veil';
  const mid=source?{x:(source.x+targetPt.x)/2,y:(source.y+targetPt.y)/2}:targetPt;
  veil.style.left=mid.x+'px';
  veil.style.top=mid.y+'px';
  root.appendChild(veil);

  if(source&&!isAnkan) addMeldFxBeam(root, source, targetPt);

  const flights=document.createElement('div');
  flights.className='mfx-flights';
  root.appendChild(flights);

  const tiles=meldFxFlightTiles(spec.kind, spec.tile, spec.meldTiles);
  const animCls=isAnkan?'mfx-fly-ankan':spec.kind==='pon'?'mfx-fly-pon':spec.kind==='minkan'?'mfx-fly-kan':'mfx-fly';
  const count=Math.max(1,tiles.length);
  for(let i=0;i<count;i++){
    const t=tiles[i]||spec.tile;
    const off=(i-(count-1)/2)*10;
    const fromPt=source?{x:source.x+off,y:source.y+off*.35}:targetPt;
    const toPt={x:targetPt.x+off,y:targetPt.y};
    addMeldFxFlight(flights, t, fromPt, {...targetPt,...toPt}, i*70, animCls, isAnkan);
  }

  const stamp=document.createElement('div');
  stamp.className='mfx-stamp';
  stamp.textContent=mfxStampText(spec.kind, spec.actorLabel||'');
  stamp.style.left=targetPt.x+'px';
  stamp.style.top=(targetPt.y-target.h*.45)+'px';
  root.appendChild(stamp);

  _meldFxTimer=setTimeout(clearMeldFx,950);
}

function drawAndPlay(pi){
  const p=G.players[pi];

  // Treasure draw: when wall is empty, only 扣聴 players get treasure
  if(G.wall.length===0){
    if(G.treasureUsed||!p.kouTing){endRound(tr('roundDraw','流局'));return;}
    G.treasureUsed=true;
    const drawn=G.treasure;
    appendDrawToHandRight(p,drawn);
    updateAllTenpai();
    resolveKouTingTreasureDraw(pi,drawn);
    return;
  }

  const drawn=G.wall.splice(0,1)[0];
  appendDrawToHandRight(p,drawn);
  updateAllTenpai();

  // Check tsumo win (normal draw)
  const canTsumo=checkTsumoAfterDraw(pi,drawn);

  if(canTsumo){
    if(p.isHuman){
      // In 扣聴, auto-tsumo. Otherwise show button.
      G.tsumoTile=drawn;
      if(p.kouTing){
        G.msg=`${tr('tsumo','ツモ！')} ${tileName(drawn)}`;
        G.phase='discard';
        G.humanOptions=[];
        render();
        scheduleMatch(()=>resolveWin(0,drawn,true,false),900);
      } else {
        G.msg=UI.lang==='zh'?'可以自摸和牌！':'ツモ上がりできます！';
        G.phase='discard';
        G.humanOptions=['tsumo'];
        render();
      }
    } else {
      resolveWin(pi,drawn,true,false);
    }
    return;
  }

  G.phase='discard';
  G.humanOptions=[];
  G.tsumoTile=null;

  if(p.isHuman){
    if(p.kouTing){
      scheduleKouTingHumanDrama(0,900,680);
    } else {
      G.msg=tr('chooseDiscard','牌を選んで捨てましょう（先出後引き）');
      render();
    }
  } else {
    if(p.kouTing){
      scheduleMatch(()=>autoDiscardDrawn(pi),700);
    } else {
      scheduleMatch(()=>aiDiscard(pi),600);
    }
  }
}

function replenishDiscardAfterCall(fromPi){

/** 扣聴・人間のみ: 裏牌サスペンス→表オープン→自分で打牌（摸牌は配列末尾＝最右表示） */
function scheduleKouTingHumanDrama(pi,suspenseMs,holdMs){
  const p=G.players[pi];
  const tile=p.drawnTile||G.lastDrawn;
  if(!p||!tile){
    return;
  }
  if(!p.isHuman||!p.kouTing){
    return;
  }
  const ep=G._epoch;
  const tileRef=tile;
  const drawIdx=handIndexOfTileRef(p,tileRef);
  G.ktReveal={phase:'suspense',tile:tileRef,pi,drawIdx:drawIdx>=0?drawIdx:p.hand.length-1};
  G.lastDrawn=null;
  G.msg=`${tr('ktGachaTitle','扣聴・山から一枚…')} ${tr('ktGachaSub','何が出るかな…？')}`;
  GameSFX.play('gacha');
  fxVibrate([18,26,18,26,36,26,44]);
  render();
  scheduleMatch(()=>{
    if(!G||G._epoch!==ep||G.gameOver) return;
    const di=handIndexOfTileRef(p,tileRef);
    G.ktReveal={phase:'reveal',tile:tileRef,pi,drawIdx:di>=0?di:p.hand.length-1};
    G.lastDrawn=tileRef;
    G.msg=`${tr('ktRevealLine','来た！')} ${tileName(tileRef)} — ${tr('ktTensionLine','この一枚を切る瞬間…胸がザワザワ')}`;
    GameSFX.play('reveal');
    GameSFX.play('draw');
    fxVibrate([20,38,20]);
    render();
    scheduleMatch(()=>{
      if(!G||G._epoch!==ep||G.gameOver) return;
      G.ktReveal=null;
      G.msg=`${tr('ktPickDiscard','嵌張待ちを保てる牌だけ、タップして捨ててください')}\n${tr('ktPickDiscardHint','切った牌が誰かの和了に…と思うとヒリヒリしますね')}`;
      render();
    },typeof holdMs==='number'?holdMs:520);
  },typeof suspenseMs==='number'?suspenseMs:880);
}

// 扣聴・AIのみ: 山から摸って自動打牌（人間は「牌を引く」＋手動打牌）
function kouTingDrawThenAutoDiscard(pi){
  const p=G.players[pi];
  if(!p||!p.kouTing||G.gameOver) return;
  if(p.isHuman) return;

  if(G.wall.length===0){
    if(G.treasureUsed||!p.kouTing){endRound(tr('roundDraw','流局'));return;}
    G.treasureUsed=true;
    const drawn=G.treasure;
    appendDrawToHandRight(p,drawn);
    updateAllTenpai();
    resolveKouTingTreasureDraw(pi,drawn);
    return;
  }

  const drawn=G.wall.splice(0,1)[0];
  appendDrawToHandRight(p,drawn);
  updateAllTenpai();

  if(checkTsumoAfterDraw(pi,drawn)){
    resolveWin(pi,drawn,true,false);
    return;
  }

  G.phase='discard';
  G.humanOptions=[];
  G.tsumoTile=null;
  GameSFX.play('draw');
  render();
  scheduleMatch(()=>autoDiscardDrawn(pi),350);
}

// 扣聴・AIのみ: 摸った牌を自動打牌（人間は humanDraw + humanDiscard）
function autoDiscardDrawn(pi){
  const p=G.players[pi];
  const drawn=p.drawnTile||G.lastDrawn;
  if(!drawn){return;}
  let idx=-1;
  if(p.kouTing){
    const leg=kouTingLegalDiscardIndices(p);
    if(leg.length) idx=aiPickKouTingDiscardIndex(p,leg);
  }
  if(idx<0) idx=handIndexOfTileRef(p,p.drawnTile);
  if(idx<0) idx=p.hand.findIndex(t=>tileEq(t,drawn));
  if(idx<0){
    addLog(UI.lang==='zh'
      ? `[sync]扣听自动打出失败: 手牌中无${tileName(drawn)}`
      : `[整合]扣聴自動打牌: 手牌に${tileName(drawn)}がありません`);
    return;
  }
  if(!p.isHuman&&p.kouTing) GameSFX.play('kt_discard');
  G.pendingKouTingFrom=pi;
  p.hand.splice(idx,1);
  p.hand=sortTiles(p.hand);
  pushPlayerDiscard(p,drawn);
  p.drawnTile=null;
  if(p.isHuman) G.lastDrawn=null;
  updateAllTenpai();
  addLog(`${p.isHuman?sideName(0):p.name}が${tileName(drawn)}を捨てました（扣聴）`);
  GameSFX.play('discard');
  fxVibrate(12);
  afterDiscard(pi,drawn);
  render();
}

// 先出後引き: 捨てたあと、手牌が想定枚数に足りなければ山から補う（暗槓の嶺上で既に足りているときは引かない）
function drawAfterDiscard(pi){
  const p=G.players[pi];
  if(G.wall.length===0){
    if(G.treasureUsed||!p.kouTing){endRound(tr('roundDraw','流局'));return false;}
    G.treasureUsed=true;
    const drawn=G.treasure;
    appendDrawToHandRight(p,drawn);
    updateAllTenpai();
    resolveKouTingTreasureDraw(pi,drawn);
    return false;
  }
  const expected=expectedHandCount(p);
  let lastDrawn=null;
  while(p.hand.length<expected&&G.wall.length>0){
    lastDrawn=G.wall.splice(0,1)[0];
    appendDrawToHandRight(p,lastDrawn);
  }
  updateAllTenpai();
  if(p.hand.length>expected){
    addLog(UI.lang==='zh'
      ? `[sync]引牌后手牌长度 ${p.hand.length}→${expected}（截断） ${tilesText(p.hand)}`
      : `[整合]摸調後の手牌 ${p.hand.length}→${expected}（切り詰め） ${tilesText(p.hand)}`);
    p.hand=sortTiles(p.hand.slice(0,expected));
    if(lastDrawn){
      p.drawnTile=p.hand.find(t=>t===lastDrawn)||p.hand.find(t=>tileEq(t,lastDrawn))||p.hand[p.hand.length-1]||null;
      if(p.isHuman) G.lastDrawn=p.drawnTile;
    } else {
      p.drawnTile=null;
      if(p.isHuman) G.lastDrawn=null;
    }
    updateAllTenpai();
  }
  if(p.isHuman&&lastDrawn&&!p.kouTing){GameSFX.play('draw');fxVibrate(10);}
  if(lastDrawn&&checkTsumoAfterDraw(pi,lastDrawn)){
    resolveWin(pi,lastDrawn,true,false);
    return false;
  }
  return true;
}

function finalizeAfterDiscardCycle(fromPi){
  if(G.gameOver) return;
  // 親の配牌14枚スタート時、最初の打牌だけは引かないで13枚に揃える
  if(G.dealerOpeningDiscardNoDraw && fromPi===G.dealer){
    G.dealerOpeningDiscardNoDraw=false;
    nextTurn(fromPi);
    return;
  }
  // チー/ポン直後は「出すだけで引かない」。
  if(G.skipDrawAfterCallBy===fromPi){
    G.skipDrawAfterCallBy=null;
    nextTurn(fromPi);
    return;
  }
  // 扣聴: 摸った直後の自動打牌で来た2回目の finalize は摸り直さず次家へ（摸打1サイクル完了）
  if(G.pendingKouTingFrom===fromPi){
    G.pendingKouTingFrom=null;
    nextTurn(fromPi);
    return;
  }
  if(G.kouTingTreasurePending&&!canOfferKouTingTreasureNow(fromPi)){
    G.kouTingTreasurePending=false;
    G.kouTingTreasureSeen=false;
  }
  if(G.players[fromPi]?.isHuman&&G.players[fromPi].kouTing){
    maybeBeginKouTingTreasureAfterReady(fromPi);
  }
  if(G.kouTingTreasurePending&&G.players[fromPi]?.isHuman){
    G.turn=fromPi;
    G.phase='discard';
    G.humanOptions=[];
    render();
    return;
  }
  if(G.players[fromPi].kouTing){
    nextTurn(fromPi);
    return;
  }
  if(!drawAfterDiscard(fromPi)) return;
  if(G.kanBranchBActive){
    G.kanBranchBActive=false;
    nextTurn(fromPi);
    return;
  }
  if(tryOfferPostDrawKan(fromPi)) return;
  const pk=G.players[fromPi];
  if(pk.kouTing){
    if(pk.isHuman){
      scheduleKouTingHumanDrama(fromPi,920,560);
    } else {
      scheduleMatch(()=>autoDiscardDrawn(fromPi),280);
    }
    return;
  }
  nextTurn(fromPi);
}

function humanKouTingPick(){
  if(!G||G.turn!==0||G.phase!=='discard') return;
  const p=G.players[0];
  if(p.kouTing) return;
  const entry=G.online?(G.kouTingEntryIdx||[]):kouTingEntryDiscardIndices(p);
  if(!entry.length) return;
  G.kouTingPick=true;
  G.msg=tr('kouTingPick','聴に入る牌をタップして捨ててください');

function humanKouTingPickCancel(){

}

function humanDiscard(tileIdx, fromEl){
  if(typeof UI!=='undefined') UI.handSelectIdx=null;
  if(G?.online){
    if(G.kouTingPick&&onlineLegal('kouting')) onlineAction('kouting',{index:tileIdx});
    else onlineAction('discard',{index:tileIdx});
    return;
  }
  if(G.kouTingTreasurePending) return;
  if(G.phase!=='discard'||G.turn!==0) return;
  if(G.kanBranchAOpts||G.kanTurnEnding) return;
  const p=G.players[0];
  G.discardedThisTurn=true;
  const tile=p.hand[tileIdx];
  if(!tile) return;
  if(!p.kouTing&&G.kouTingPick){
    const entry=kouTingEntryDiscardIndices(p);
    if(entry.includes(tileIdx)&&enterKouTingByDiscard(p,tileIdx,fromEl)) return;
    return;
  }
  noteDiscardMeta(0,tile);
  armDiscardFlight(0,tile,fromEl);
  if(p.kouTing){
    if(G.ktReveal) return;
    const leg=kouTingLegalDiscardIndices(p);
    const drawnRef=p.drawnTile||(G.lastDrawn&&p.hand.some(t=>t===G.lastDrawn)?G.lastDrawn:null);
    const drawnIdx=drawnRef?handIndexOfTileRef(p,drawnRef):-1;
    if(!leg.includes(tileIdx)&&!(drawnIdx>=0&&tileIdx===drawnIdx)) return;
    p.hand=p.hand.filter((_,i)=>i!==tileIdx);
    p.hand=sortTiles(p.hand);
    pushPlayerDiscard(p,tile);
    p.drawnTile=null;
    G.lastDrawn=null;
    updateAllTenpai();
    addLog(`${sideName(0)}が${tileName(tile)}を捨てました（扣聴）`);
    GameSFX.play('kt_discard');
    fxVibrate(15);
    afterDiscard(0,tile);
    flushDiscardFlight();
    return;
  }
  p.hand=p.hand.filter((_,i)=>i!==tileIdx);
  p.hand=sortTiles(p.hand);
  pushPlayerDiscard(p,tile);
  p.drawnTile=null;
  G.lastDrawn=null;
  updateAllTenpai();
  addLog(`${sideName(0)}が${tileName(tile)}を捨てました`);
  GameSFX.play('discard');
  fxVibrate(15);
  afterDiscard(0,tile);
  flushDiscardFlight();
}

function afterDiscard(fromPi, tile){
  G.pendingDiscard=tile;
  G.pendingFrom=fromPi;
  const human=G.players[0];
  G.humanOptions=[];
  G.chiOpts=[];

  if(fromPi!==0){
    // ロンするかどうかは常にユーザーに委ねる（扣聴でも自動和了しない）
    if(checkWin(human,tile)){
      G.humanOptions.push('win');
    }
    // Pon/Chi only allowed when NOT in 扣聴
    if(!human.kouTing){
      if(countTile(human.hand,tile)>=3&&human.hand.length>3){
        G.humanOptions.push('minkan');
      }
      if(countTile(human.hand,tile)>=2&&human.hand.length>3){
        G.humanOptions.push('pon');
      }
      if(nextPlayer(fromPi)===0){
        const opts=getChiOptions(human.hand,tile);
        if(opts.length>0){G.humanOptions.push('chi');G.chiOpts=opts;}
      }
    }
  }

  if(G.humanOptions.length>0){
    G.phase='after_discard';
    G.msg=tr('actionPrompt','どうしますか？');
    render();
  } else {
    processAIResponses(fromPi,tile,()=>finalizeAfterDiscardCycle(fromPi));
  }
}

function processAIResponses(fromPi, tile, done){
  const lv=aiLevel();
  for(const p of G.players){
    if(p.isHuman||p.idx===fromPi) continue;
    if(checkWin(p,tile)&&Math.random()<(lv.ronTake??lv.claimBoost??1)){
      scheduleMatch(()=>resolveWin(p.idx,tile,false,false),400);
      return;
    }
  }
  for(const p of G.players){
    if(p.isHuman||p.idx===fromPi||p.kouTing) continue;
    if(countTile(p.hand,tile)>=3&&p.hand.length>3&&aiShouldClaimMeld(p,tile,'minkan')){
      scheduleMatch(()=>{aiMinkan(p.idx,tile,fromPi);},400);
      return;
    }
  }
  for(const p of G.players){
    if(p.isHuman||p.idx===fromPi||p.kouTing) continue;
    if(countTile(p.hand,tile)>=2&&p.hand.length>3&&aiShouldClaimMeld(p,tile,'pon')){
      scheduleMatch(()=>{aiPon(p.idx,tile,fromPi);},400);
      return;
    }
  }
  const nextPi=nextPlayer(fromPi);
  const nxt=G.players[nextPi];
  if(!nxt.isHuman&&!nxt.kouTing){
    const chiOpts=getChiOptions(nxt.hand,tile);
    const canChi=chiOpts.length>0&&(lv.chiOpen||nxt.melds.some(m=>m.type==='pon'||m.type==='kan'));
    if(canChi&&aiShouldClaimMeld(nxt,tile,'chi')){
      const pair=lv.smartPick?aiPickBestChiOption(nxt.hand,tile,chiOpts):chiOpts[0];
      scheduleMatch(()=>{aiChi(nextPi,tile,pair,fromPi);},400);
      return;
    }
  }
  done();
}

function beginActiveTurn(){
  if(!G||G.gameOver||G.roundOver) return;
  if(G.dealCinemaActive){
    clearDealCinema();
    G.dealCinemaActive=false;
    G.dealFaceReveal=false;
    G.dealRevealCounts=null;
    G.dealCinemaPhase=null;
  }
  G.phase='discard';
  G.kanBranchBActive=false;
  G.kanBranchAOpts=null;
  G.discardedThisTurn=false;
  G.kanTurnEnding=false;
  const p=G.players[G.turn];
  if(!p) return;
  if(p.isHuman){
    if(p.kouTing){
      G.msg=tr('kouTingNeedDraw','扣聴です。「牌を引く」で山から1枚（右端に現れます）');
    }else{
      G.msg=tr('chooseDiscard','牌を選んで捨てましょう（先出後引き）');
    }
    G.humanOptions=[];
    render();
    return;
  }
  if(aiMaybeTurnStartKan(G.turn)) return;
  if(p.kouTing) scheduleMatch(()=>kouTingDrawThenAutoDiscard(G.turn),500);
  else scheduleMatch(()=>aiDiscard(G.turn),500);
}

function nextTurn(fromPi){
  G.turn=nextPlayer(fromPi);
  beginActiveTurn();
}

  G.phase='discard';
