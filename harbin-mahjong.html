<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ハルビン麻雀（カタン限定）</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;height:100dvh;overflow:hidden;}
body{
  background:
    radial-gradient(circle at 50% 45%, #2f9a5c 0%, #1f6c42 35%, #133d28 75%, #0a2418 100%);
  font-family:'Hiragino Kaku Gothic Pro',sans-serif;
  height:100dvh;max-height:100dvh;overflow:hidden;user-select:none;touch-action:manipulation;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app{height:100%;min-height:0;max-height:100dvh;overflow:hidden;padding:clamp(2px,1.2vw,8px);box-sizing:border-box;}
.table-shell{
  height:100%;
  min-height:0;
  overflow:hidden;
  border-radius:16px;
  padding:10px;
  background:
    linear-gradient(135deg,#5e3510 0%,#8d5824 28%,#5a320f 58%,#a86b2d 100%);
  background-image:
    repeating-linear-gradient(90deg,rgba(255,220,160,.04) 0 11px,rgba(0,0,0,0) 11px 23px),
    repeating-linear-gradient(0deg,rgba(255,220,160,.03) 0 9px,rgba(0,0,0,0) 9px 19px),
    linear-gradient(135deg,#5e3510 0%,#8d5824 28%,#5a320f 58%,#a86b2d 100%);
  box-shadow:
    inset 0 2px 0 rgba(255,227,172,.45),
    inset 0 -4px 10px rgba(33,14,0,.55),
    0 12px 20px rgba(0,0,0,.45);
}
.table-felt{
  position:relative;
  height:100%;
  min-height:0;
  overflow-x:visible;
  overflow-y:hidden;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  gap:0;
  padding:4px;
  background:
    radial-gradient(circle at 50% 45%, rgba(65,165,112,.24), transparent 60%),
    repeating-linear-gradient(45deg, rgba(255,255,255,.02) 0 2px, rgba(0,0,0,.015) 2px 4px),
    linear-gradient(180deg,#187542 0%,#125f35 55%,#0f4e2d 100%);
  border:1px solid rgba(255,230,170,.28);
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.25);
}
.felt-play-column{
  position:relative;
  z-index:2;
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:3px;
}

/* === TILES: 表は淡い面＋濃青の帯、裏は同系の濃青＋薄灰青の縁で立体（参照イラスト寄せ） === */
.tile:not(.back){
  position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(165deg,#feffff 0%,#f4f9fd 38%,#e8f2fa 100%);
  border-radius:2px;
  border:1px solid #b8d4ea;
  box-shadow:
    0 1px 0 rgba(255,255,255,.96) inset,
    0 -2px 6px rgba(120,175,215,.16) inset,
    1px 1px 0 rgba(230,242,252,.95),
    0 2px 0 rgba(190,215,238,.6),
    0 4px 8px rgba(70,125,175,.16),
    0 8px 14px rgba(55,110,155,.09);
  font-weight:bold;cursor:pointer;transition:transform .12s ease;overflow:hidden;
}
.tile::before{
  content:"";
  position:absolute;
  left:0;right:0;bottom:0;
  height:12%;
  min-height:3px;
  /* 参照イラストの「厚みの青」に近い帯（表側の立体と色を揃える） */
  background:linear-gradient(180deg,#7eb2e8 0%,#5f9ad8 38%,#4a86ca 72%,#3d74b4 100%);
  border-top:1px solid rgba(220,236,252,.55);
  box-shadow:
    0 -1px 1px rgba(255,255,255,.28) inset,
    0 2px 3px rgba(35,75,120,.2);
  pointer-events:none;
  z-index:1;
}
.tile:not(.back)::after{
  content:"";
  position:absolute;
  left:2px;right:2px;top:2px;height:30%;
  background:linear-gradient(180deg,rgba(255,255,255,.88),rgba(230,244,255,0));
  border-radius:1px 1px 2px 2px;
  pointer-events:none;
  z-index:2;
}
/* 手前手牌: 名称未設定 (2)。東西席は手札シート回転、対面（上）は自家捨て牌 lg、北席配置は自家鳴き牌 */
#bottom-area #human-hand .tile:not(.back):not(.hand-face){
  transform:scaleY(-1);
  background:linear-gradient(168deg,#feffff 0%,#f2f7fc 40%,#e8f0f8 100%);
  border-color:#aac6de;
  box-shadow:
    inset 0 5px 14px rgba(255,255,255,.72),
    inset 0 -1px 0 rgba(255,255,255,.88),
    0 2px 0 rgba(210,226,242,.55),
    0 5px 10px rgba(45,70,95,.1);
}
#bottom-area #human-hand .tile.hand-face:not(.back){
  transform:none;
  padding:0;
  overflow:visible;
  background:transparent;
  border:none;
  position:relative;
  z-index:0;
  --hand-w:min(34px,calc((100vw - 88px) / 16));
  width:var(--hand-w);
  height:auto;
  filter:drop-shadow(0 2px 4px rgba(38,72,108,.22));
  transition:transform .12s ease,filter .12s ease,z-index 0s;
}
#bottom-area #human-hand .tile.hand-face:not(.back) .tile-art.tile-art-hand{
  width:100%;
  height:min(54px,calc(var(--hand-w)*166/121),11.5dvh);
  overflow:visible;
  border-radius:2px;
  background:transparent;
  clip-path:none;
}
#bottom-area #human-hand .tile.hand-face.tsumo-separated{
  margin-left:clamp(10px,2.8vw,16px);
}
#bottom-area #human-hand .tile.hand-face:not(.back):hover,
#bottom-area #human-hand .tile.hand-face:not(.back).selected,
#bottom-area #human-hand .tile.hand-face.just-drawn:not(.back){
  z-index:3;
}
#bottom-area #human-hand .tile:not(.back):not(.hand-face)::before{
  display:none;
}
#bottom-area #human-hand .tile.hand-face:not(.back)::before{
  display:none;
}
/* 手札スプライト: 7198 実装と同系の外周（薄青→白）。下駄はシート上部＝牌面の上 */
.tile.hand-face:not(.back) .tile-art.tile-art-hand{
  position:relative;
  border-radius:2px;
  box-shadow:
    0 0 0 1px rgba(255,255,255,.96),
    0 0 0 2px rgba(176,212,246,.78),
    1px 2px 0 rgba(228,240,252,.65),
    0 3px 7px rgba(62,112,162,.17);
}
.tile.hand-face:not(.back) .tile-art.tile-art-hand::before{
  content:"";
  position:absolute;
  left:0;right:0;top:0;
  height:clamp(3px,11%,10px);
  min-height:3px;
  pointer-events:none;
  z-index:4;
  border-radius:2px 2px 0 0;
  background:transparent;
  border-top:1px solid rgba(255,255,255,.92);
  box-shadow:0 0 0 1px rgba(168,208,248,.82);
}
.tile.hand-face:not(.back) .tile-art.tile-art-hand::after{
  content:"";
  position:absolute;
  left:2px;right:2px;bottom:2px;
  height:24%;
  pointer-events:none;
  z-index:3;
  border-radius:0 0 1px 1px;
  background:linear-gradient(0deg,rgba(255,255,255,.7) 0%,rgba(235,246,255,0) 100%);
}
#bottom-area #human-hand .tile:not(.back):not(.hand-face) .tile-art-img,
#bottom-area #human-hand .tile:not(.back):not(.hand-face) .tile-svg{
  transform:scaleY(-1);
  transform-origin:50% 50%;
}
/* 手札シート 2000×1600。pan は tileFaceArtHand の inline %（牌 bbox・黒地は screen 透過） */
#bottom-area #human-hand .tile.hand-face:not(.back) .tile-art-hand .tile-art-img.tile-art-img-hand{
  position:absolute;
  display:block;
  max-width:none;
  transform:none;
  mix-blend-mode:screen;
  z-index:1;
}
.tile.hand-face:not(.back) .tile-art-img.tile-art-img-hand{
  z-index:1;
}
/* 反転で既定の上面光沢(::after)が画面下に来るので消す。扣聴枠は ::after を使うため別指定 */
#bottom-area #human-hand .tile:not(.back):not(.kouting-tile):not(.just-drawn)::after{
  opacity:0;
  height:0;
  min-height:0;
  overflow:hidden;
  pointer-events:none;
}
#bottom-area #human-hand .tile.kouting-tile:not(.just-drawn)::after{
  opacity:1;
  height:auto;
  inset:0;
  left:0;
  right:0;
  top:0;
  bottom:0;
  border-radius:2px;
  background:none;
  box-shadow:none;
  border:1px solid rgba(255,220,80,.55);
  content:"";
}
.tile{-webkit-tap-highlight-color:transparent;}
@media (hover:hover){
.tile:hover{transform:translateY(-4px);}
#bottom-area #human-hand .tile:not(.back):not(.hand-face):hover{transform:scaleY(-1) translateY(4px);}
#bottom-area #human-hand .tile.hand-face:not(.back):hover{transform:translateY(-4px);}
}
.tile.selected{transform:translateY(-8px);outline:2px solid #ff0;}
#bottom-area #human-hand .tile:not(.back):not(.hand-face).selected{transform:scaleY(-1) translateY(8px);}
#bottom-area #human-hand .tile.hand-face:not(.back).selected{transform:translateY(-8px);}
.tile.man{color:#c00;}
.tile.pin{color:#125ec0;}
.tile.sou{color:#0a7a2a;}
.tile.chun{color:#c00;}
/* 裏牌: 柄なし・参照イラストの濃青側面＋薄い青灰の縁、影で厚みを強調 */
.tile.back{
  position:relative;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;
  color:transparent;
  border:1px solid #c4d8ea;
  border-radius:2px;
  font-weight:bold;cursor:pointer;transition:transform .12s ease;overflow:hidden;
  background:
    linear-gradient(105deg,rgba(255,255,255,.14) 0%,rgba(255,255,255,0) 42%,rgba(40,90,130,.06) 100%),
    linear-gradient(180deg,#9ec4ef 0%,#7eace4 12%,#6a9ad8 32%,#5688cc 52%,#4676b8 72%,#3a649e 100%);
  box-shadow:
    0 0 0 1px rgba(220,235,248,.65) inset,
    0 2px 0 rgba(255,255,255,.22) inset,
    0 -5px 12px rgba(40,85,130,.22) inset,
    1px 1px 0 rgba(225,238,252,.65),
    0 2px 0 rgba(70,120,170,.32),
    0 5px 8px rgba(55,105,155,.2),
    0 9px 16px rgba(45,95,145,.12),
    0 14px 22px rgba(40,85,125,.08);
}
.tile.back::before{display:none;}
.tile.back::after{
  content:'';
  position:absolute;inset:0;
  border-radius:inherit;
  pointer-events:none;
  box-shadow:
    inset 0 3px 6px rgba(255,255,255,.26),
    inset 0 -4px 10px rgba(35,75,115,.26);
}
.tile .num{line-height:1;z-index:1;}
.tile .suit{font-size:.6em;line-height:1;z-index:1;}
.tile-svg{display:block;width:100%;height:100%;padding:7%;position:relative;z-index:3;filter:drop-shadow(0 1px 1px rgba(70,125,175,.28));}
/* スプライトは <img> で表示（background + var(url) が環境によって無効になり白牌になるのを避ける） */
.tile-art{
  overflow:hidden;
  width:100%;
  height:100%;
  position:relative;
  z-index:3;
}
.tile-art .tile-art-img{
  position:absolute;
  display:block;
  left:calc(var(--tx) * -100% / 62);
  top:calc(var(--ty) * -100% / 98);
  width:calc(760 * 100% / 62);
  height:calc(456 * 100% / 98);
  max-width:none;
  pointer-events:none;
  user-select:none;
}
/* sizes */
.tile.lg{width:min(34px,calc((100vw - 88px) / 16));height:min(48px,calc((100vw - 88px) / 16 * 1.42),10dvh);font-size:clamp(9px,2.2vw,16px);}
.tile.lg .tile-svg{padding:8% 10%;}
.tile.md{width:28px;height:40px;font-size:12px;}
.tile.sm{width:22px;height:32px;font-size:10px;}
.tile.xs{width:18px;height:26px;font-size:8px;}
.tile.vert{width:26px;height:36px;font-size:10px;}
#left-area .side-col .tile.side,
#right-area .side-col .tile.side,
#left-area .side-col .tile.side-xs,
#right-area .side-col .tile.side-xs{
  width:clamp(24px,5.5vw,46px);
  height:clamp(17px,calc((100dvh - 200px) / 14),33px);
  font-size:clamp(8px,1.8vw,11px);
  padding:0;
  flex-shrink:0;
}
.tile.side{width:30px;height:21px;font-size:10px;flex-direction:row;gap:2px;padding:0 3px;}
.tile.side .tile-art{width:100%;height:100%;}
.tile.side-xs{width:26px;height:18px;font-size:8px;flex-direction:row;gap:1px;padding:0 2px;}
.tile.side-xs .tile-art{width:100%;height:100%;}
/* side-seat discards: landscape frame — サイズは手牌と揃える */
.tile.side-disc{
  --disc-w:clamp(24px,5.5vw,46px);
  --disc-h:clamp(17px,calc((100dvh - 200px) / 14),33px);
  width:var(--disc-w);height:var(--disc-h);
  font-size:clamp(8px,1.8vw,11px);
  flex-direction:row;gap:1px;padding:0;
  overflow:hidden;
}
.tile.side-disc .tile-art{width:100%;height:100%;}
/* meld rack side tiles: 捨て牌と同サイズ */
#left-area .side-rack .meld-group .tile.side,
#right-area .side-rack .meld-group .tile.side{
  --meld-w:clamp(24px,5.5vw,46px);
  --meld-h:clamp(17px,calc((100dvh - 200px) / 14),33px);
  width:var(--meld-w);height:var(--meld-h);
}
#left-area .side-rack .meld-group .tile.side .tile-art,
#right-area .side-rack .meld-group .tile.side .tile-art{width:100%;height:100%;}
.tile.side-face{
  padding:0;
  overflow:hidden;
}
.tile.side-face .tile-art{
  position:absolute;
  inset:2px 2px 3px;
  width:auto;
  height:auto;
  border-radius:2px;
  overflow:hidden;
  z-index:3;
}
/* 左右捨て・鳴き: 7198 スプライトを卓上向きに回転（原点は牌面セル中心） */
.tile.side-face .tile-art .tile-art-img{
  left:calc(var(--tx) * -100% / 62);
  top:calc(var(--ty) * -100% / 98);
  width:calc(760 * 100% / 62);
  height:calc(456 * 100% / 98);
  max-width:none;
  transform:rotate(var(--side-art-rot));
  transform-origin:calc((var(--tx) + 31) * 100% / 760) calc((var(--ty) + 49) * 100% / 456);
}
.tile.side-face.side-disc-left{--side-art-rot:90deg;}
.tile.side-face.side-disc-right{--side-art-rot:-90deg;}
/* 東西席: 自家手札と同寸のまま回転のみ（東=左90°・西=右90°） */
.tile.hand-face.opp-hand{
  --hand-w:min(34px,calc((100vw - 88px) / 16));
  --hand-h:min(54px,calc(var(--hand-w)*166/121),11.5dvh);
  width:var(--hand-h);
  height:var(--hand-w);
  padding:0;
  overflow:visible;
  background:transparent;
  border:none;
  position:relative;
  flex-shrink:0;
  filter:drop-shadow(1px 2px 4px rgba(38,72,108,.3));
}
.tile.hand-face.opp-hand .tile-art.tile-art-hand{
  position:absolute;
  left:50%;
  top:50%;
  width:var(--hand-w);
  height:var(--hand-h);
  transform:translate(-50%,-50%) rotate(var(--opp-rot,-90deg));
  overflow:visible;
  border-radius:2px;
  background:transparent;
  clip-path:none;
}
.tile.hand-face.opp-rot-left{--opp-rot:-90deg;}
.tile.hand-face.opp-rot-right{--opp-rot:90deg;}
/* 東西捨て牌のみやや小さく（鳴き牌は opp-hand フルサイズのまま） */
.tile.hand-face.opp-hand.opp-disc{
  --hand-w:min(28px,calc((100vw - 88px) / 19));
  --hand-h:min(44px,calc(var(--hand-w)*166/121),9.5dvh);
}
.tile.hand-face.opp-hand .tile-art-img.tile-art-img-hand{mix-blend-mode:screen;}
.tile.hand-face.opp-hand::before,
.tile.hand-face.opp-hand::after{display:none;}
/* opp の外周ラインは .tile-art.tile-art-hand の疑似要素（回転に追従） */
/* 東西・手牌列だけやや縮小（見切れ防止。鳴き・捨ては opp-hand のまま） */
#left-area .side-col .tile.hand-face.opp-hand,
#right-area .side-col .tile.hand-face.opp-hand{
  --hand-w:min(26px,calc((100vw - 88px) / 20));
  --hand-h:min(40px,calc(var(--hand-w)*166/121),8.8dvh);
}
#left-area .side-discards-zone .tile.hand-face.opp-hand:not(.back),
#left-area .side-rack .meld-group .tile.hand-face.opp-hand:not(.back),
#right-area .side-discards-zone .tile.hand-face.opp-hand:not(.back),
#right-area .side-rack .meld-group .tile.hand-face.opp-hand:not(.back){
  background:transparent;
  border:none;
  border-bottom:none;
  box-shadow:none;
  transform-origin:50% 50%;
}
.tile.side-face .side-face-art{
  position:absolute;
  inset:2px 2px 4px;
  z-index:3;
  overflow:hidden;
  border-radius:2px;
}
.tile.side-face .side-face-symbol{
  position:absolute;
  inset:-2px 0 0;
  display:flex;
  align-items:center;
  justify-content:center;
  transform:rotate(var(--side-art-rot)) scale(1.06);
  transform-origin:50% 50%;
}
.tile.side-face .side-face-symbol .tile-svg{
  width:100%;
  height:100%;
  padding:2%;
  filter:drop-shadow(0 1px 1px rgba(70,125,175,.25));
}
/* 左右席: 手前（画面下）から卓心へ見たとき、下辺に裏青の厚みが見える */
#left-area .side-col .tile,
#right-area .side-col .tile,
#left-area .side-discards-zone .tile,
#right-area .side-discards-zone .tile,
#left-area .side-rack .meld-group .tile,
#right-area .side-rack .meld-group .tile{
  transform-origin:50% 100%;
  border-left:none;
  border-right:none;
  border-bottom:none;
  border-top:1px solid #b8d4ea;
}
#left-area .side-col .tile:not(.back),
#right-area .side-col .tile:not(.back),
#left-area .side-discards-zone .tile:not(.back),
#right-area .side-discards-zone .tile:not(.back),
#left-area .side-rack .meld-group .tile:not(.back),
#right-area .side-rack .meld-group .tile:not(.back){
  background:#fbfdff;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95),
    0 3px 0 rgba(70,120,170,.42);
}
/* 捨て牌・鳴り牌の奥行き: 親の overflow:hidden にクリップされる 0 3px box-shadow の代わりに
   border-bottom + inset shadow で卓上手前エッジの立体感を出す */
#left-area .side-discards-zone .tile:not(.back),
#right-area .side-discards-zone .tile:not(.back),
#left-area .side-rack .meld-group .tile:not(.back),
#right-area .side-rack .meld-group .tile:not(.back){
  border-bottom:3px solid rgba(50,100,158,.65);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -3px 5px rgba(50,100,158,.22);
}
#left-area .side-col .tile:not(.back)::before,
#right-area .side-col .tile:not(.back)::before,
#left-area .side-discards-zone .tile:not(.back)::before,
#right-area .side-discards-zone .tile:not(.back)::before,
#left-area .side-rack .meld-group .tile:not(.back)::before,
#right-area .side-rack .meld-group .tile:not(.back)::before{
  left:1px;right:1px;top:auto;bottom:0;
  width:auto;
  height:16%;
  min-height:4px;
  z-index:4;
  border-top:1px solid rgba(220,236,252,.55);
  border-left:none;
  border-right:none;
  box-shadow:inset 0 -1px 1px rgba(255,255,255,.24);
}
#left-area .side-col .tile:not(.back)::after,
#right-area .side-col .tile:not(.back)::after,
#left-area .side-discards-zone .tile:not(.back)::after,
#right-area .side-discards-zone .tile:not(.back)::after,
#left-area .side-rack .meld-group .tile:not(.back)::after,
#right-area .side-rack .meld-group .tile:not(.back)::after{
  left:1px;right:1px;top:2px;bottom:auto;height:26%;
  background:linear-gradient(180deg,rgba(255,255,255,.72),rgba(255,255,255,0));
}
/* 北席（上）: 手札｜鳴き（横並び）、捨て牌はその下 */
#top-area .north-rack-row{
  display:flex;
  flex-direction:row;
  align-items:flex-end;
  justify-content:center;
  gap:6px;
  max-width:min(500px,98vw);
}
#top-area .north-hand-row{display:flex;flex-wrap:nowrap;gap:1px;justify-content:center;align-items:flex-end;flex-shrink:0;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
#top-area .north-hand-row::-webkit-scrollbar{display:none;}
#top-area .north-hand-row .tile{flex:0 0 auto;vertical-align:bottom;}
#top-area .north-hand-row.deal-staging{display:flex;flex-direction:column;flex-wrap:nowrap;align-items:center;gap:3px;max-width:100%;overflow-x:visible;}
#top-area .north-hand-row.deal-staging .deal-hand-row{display:flex;flex-direction:row;flex-wrap:nowrap;gap:2px;justify-content:center;}
#top-area .north-melds{display:flex;flex-wrap:nowrap;gap:2px;justify-content:flex-start;align-items:flex-end;flex-shrink:0;}
#top-area .top-discards.north-discards{display:flex;flex-direction:column;align-items:stretch;gap:3px;width:100%;max-width:98vw;margin:4px auto 0;padding:0 4px;box-sizing:border-box;}
#top-area .north-melds .meld-group .tile,
#top-area .north-hand-row .tile{
  width:min(32px,calc((100vw - 96px) / 14));
  height:min(45px,calc((100vw - 96px) / 14 * 1.42),10dvh);
  font-size:clamp(9px,2.2vw,16px);
}
#top-area .top-discards .tile.lg{
  width:min(28px,calc((100vw - 88px) / 19));
  height:min(40px,calc((100vw - 88px) / 19 * 1.42),9dvh);
  font-size:clamp(8px,2vw,14px);
}
#top-area .top-discards .discard-river-mat{width:100%;}
.top-seat .tiles-row.top-discards.north-discards{align-self:stretch;justify-content:flex-start;}
#left-area .side-col .tile.back,
#right-area .side-col .tile.back,
#left-area .side-discards-zone .tile.back,
#right-area .side-discards-zone .tile.back,
#left-area .side-rack .meld-group .tile.back,
#right-area .side-rack .meld-group .tile.back{
  background:linear-gradient(0deg,#3a649e 0%,#4676b8 26%,#5688cc 48%,#6a9ad8 68%,#7eace4 86%,#9ec4ef 100%);
  box-shadow:
    inset 0 0 0 1px rgba(220,235,248,.5),
    inset 0 -2px 0 rgba(255,255,255,.14),
    inset 0 3px 8px rgba(40,85,130,.2);
}
#left-area .side-col .tile.back::before,
#right-area .side-col .tile.back::before,
#left-area .side-discards-zone .tile.back::before,
#right-area .side-discards-zone .tile.back::before,
#left-area .side-rack .meld-group .tile.back::before,
#right-area .side-rack .meld-group .tile.back::before{
  display:block;
  left:0;right:0;top:auto;bottom:0;
  height:16%;
  min-height:4px;
  background:linear-gradient(180deg,#7eb2e8 0%,#5f9ad8 38%,#4a86ca 72%,#3d74b4 100%);
  border-top:1px solid rgba(220,236,252,.55);
  border-left:none;
  border-right:none;
  box-shadow:inset 0 -1px 1px rgba(255,255,255,.28),0 1px 2px rgba(35,75,120,.18);
  z-index:2;
}
#left-area .side-col .tile.back::after,
#right-area .side-col .tile.back::after,
#left-area .side-discards-zone .tile.back::after,
#right-area .side-discards-zone .tile.back::after,
#left-area .side-rack .meld-group .tile.back::after,
#right-area .side-rack .meld-group .tile.back::after{
  inset:auto;left:0;right:0;top:0;height:24%;
  border-radius:inherit;
  box-shadow:inset 0 4px 8px rgba(35,75,115,.24);
}

/* drawn tile highlight: the freshly drawn tile pops up */
.tile.just-drawn{transform:translateY(-6px) scale(1.03);box-shadow:0 -2px 8px rgba(255,210,80,.85),0 6px 8px rgba(0,0,0,.55),inset 0 1px 1px rgba(255,255,255,.7);outline:2px solid rgba(255,210,80,.9);z-index:2;}
.tile.just-drawn::after{content:"NEW";position:absolute;top:-7px;left:50%;transform:translateX(-50%);background:#e74c3c;color:#fff;font-size:8px;padding:1px 4px;border-radius:6px;letter-spacing:.5px;box-shadow:0 1px 2px rgba(0,0,0,.5);}
#bottom-area #human-hand .tile.just-drawn:not(.back):not(.hand-face){transform:scaleY(-1) translateY(6px) scale(1.03);}
#bottom-area #human-hand .tile.hand-face.just-drawn:not(.back){transform:translateY(-6px) scale(1.03);}
#bottom-area #human-hand .tile.just-drawn:not(.back)::after{
  top:auto;
  bottom:calc(100% + 4px);
  transform:translateX(-50%) scaleY(-1);
}

/* kouting (tenpai-locked) hand: subtle green tint to indicate locked */
.kouting-tile{filter:brightness(.93) saturate(.85);position:relative;}
.kouting-tile::after{content:"";position:absolute;inset:0;border:1px solid rgba(255,220,80,.55);border-radius:2px;pointer-events:none;}
.kouting-badge{display:inline-block;background:linear-gradient(180deg,#d4a017,#a87b00);color:#fff;font-size:10px;font-weight:bold;padding:2px 8px;border-radius:10px;margin-left:4px;letter-spacing:.5px;box-shadow:0 1px 2px rgba(0,0,0,.4);}
.kt-near-hint{display:block;margin:4px auto 0;color:#b8f0b8;font-size:10px;line-height:1.35;max-width:min(420px,96vw);text-align:center;}
.player-label-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;max-width:min(420px,96vw);text-align:center;}

/* 扣聴・人間の「ガチャ感」摸牌演出 */
.tile.back.kt-mystery{
  animation:kt-gacha-shake 0.11s ease-in-out infinite;
  box-shadow:
    0 0 0 2px rgba(255,200,80,.55),
    0 0 14px rgba(255,160,40,.5),
    0 4px 10px rgba(0,0,0,.35);
}
@keyframes kt-gacha-shake{
  0%,100%{transform:translateY(-5px) rotate(-2.5deg) scale(1.02);}
  50%{transform:translateY(-8px) rotate(2.5deg) scale(1.05);}
}
.human-rack.kt-rack-pulse{
  position:relative;
  border-radius:10px;
  animation:kt-rack-glow 0.85s ease-in-out infinite;
}
@keyframes kt-rack-glow{
  0%,100%{box-shadow:0 0 0 0 rgba(255,210,100,.35);}
  50%{box-shadow:0 0 18px 4px rgba(255,180,60,.45);}
}
.tile.kt-reveal-pop{
  animation:kt-reveal-pop 0.45s ease-out 1;
}
.tile.kt-discardable{cursor:pointer;}
.tile.kt-discard-locked{opacity:.72;cursor:default;}
@keyframes kt-reveal-pop{
  0%{transform:translateY(4px) scale(.92);filter:brightness(1.8);}
  55%{transform:translateY(-14px) scale(1.08);filter:brightness(1.15);}
  100%{transform:translateY(-10px) scale(1.04);filter:brightness(1);}
}

/* === LAYOUT === */
#top-area{display:flex;justify-content:center;align-items:flex-start;gap:4px;padding:2px;min-height:0;flex:0 1 auto;overflow:visible;}
#middle-area{display:flex;flex:1 1 auto;gap:2px;overflow-x:visible;overflow-y:hidden;min-height:0;align-items:stretch;}
#left-area,#right-area{display:flex;flex-direction:column;justify-content:center;align-items:stretch;width:auto;min-width:0;max-width:min(48vw,168px);flex:0 0 auto;background:rgba(0,0,0,.15);border-radius:6px;padding:3px 4px;gap:2px;overflow:visible;border:1px solid rgba(255,255,255,.1);}
.side-main{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 1 auto;min-width:0;max-width:100%;min-height:0;max-height:100%;}
.side-col{display:flex;flex-direction:column;gap:1px;align-items:center;flex-wrap:nowrap;align-content:flex-start;flex-shrink:1;min-height:0;max-height:100%;overflow-y:auto;overflow-x:visible;padding:0 2px;-webkit-overflow-scrolling:touch;}
.side-meld-group{display:flex;flex-direction:row;gap:1px;padding:0;background:transparent;border:none;border-radius:0;}
.side-melds{display:flex;flex-direction:column;gap:3px;align-items:center;flex-shrink:0;}
.side-divider{width:80%;height:1px;background:rgba(255,255,255,.2);margin:1px 0;}
#center-area{
  flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;
  background:transparent;border-radius:0;padding:0 2px;gap:0;border:none;
  overflow:visible;z-index:4;container-type:inline-size;container-name:center-col;
}
.center-playfield{
  display:flex;
  flex:1;
  min-height:0;
  min-width:0;
  width:100%;
  align-items:stretch;
  gap:2px;
}
#center-hud{
  flex:1 1 auto;min-width:0;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;width:100%;
  max-width:100%;overflow:visible;
  background:rgba(0,0,0,.06);border-radius:8px;padding:4px;border:1px solid rgba(255,255,255,.06);
}
#center-discard-wrap{
  flex:1;min-height:0;min-width:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
  overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
}
#bottom-area{display:flex;flex-direction:column;align-items:stretch;justify-content:flex-end;gap:2px;padding:6px 4px 0;width:100%;max-width:100%;min-height:0;flex:0 1 auto;overflow:visible;}
#action-bar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:3px;padding-bottom:max(4px, env(safe-area-inset-bottom));flex-shrink:0;}

/* player info */
.player-label{color:#ffe;font-size:10px;text-align:center;font-weight:bold;line-height:1.35;flex-shrink:0;position:relative;z-index:3;padding:2px 1px 0;}
#left-area .player-label,#right-area .player-label{display:block;white-space:normal;word-break:keep-all;}
.score-badge{background:rgba(0,0,0,.5);color:#ffe;font-size:10px;padding:1px 4px;border-radius:3px;}
.tiles-row{display:flex;flex-wrap:wrap;gap:1px;justify-content:center;}
.melds-row{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;}
.meld-group{display:flex;gap:1px;padding:0;background:transparent;border:none;border-radius:0;}
.tile.discard-claimed{opacity:.45;filter:saturate(.35) grayscale(.5);}
.tile.discard-claimed::before{opacity:.55;}
.tile.meld-from-river{outline:none;box-shadow:none;}
.top-seat{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;width:100%;max-width:100%;min-height:0;}
.top-rack{display:flex;align-items:flex-end;justify-content:center;gap:6px;max-width:100%;flex-shrink:0;}
.top-rack .melds-row{flex-shrink:0;margin:0;}
.top-discards{justify-content:flex-start;margin-top:0;width:100%;max-width:98vw;}
.side-player{display:flex;align-items:flex-end;gap:3px;width:100%;min-height:0;flex:1 1 auto;overflow:hidden;}
#left-area .side-player{flex-direction:row;justify-content:flex-start;align-items:flex-end;}
#right-area .side-player{flex-direction:row;justify-content:flex-end;align-items:flex-end;}
#left-area .side-rack{flex-direction:row;align-items:flex-end;gap:3px;}
#right-area .side-rack{flex-direction:row;align-items:flex-end;gap:3px;}
#left-area .side-discards-zone{align-items:flex-start;}
#left-area .side-discards-zone .discard-strip.strip-side{
  align-content:flex-start;
  justify-content:flex-end;
  max-height:100%;
}
.side-main{display:flex;flex-direction:column;align-items:center;gap:2px;flex:0 0 auto;min-width:0;max-width:100%;}
.side-stack{
  display:flex;
  flex:1;
  min-height:0;
  width:100%;
  align-items:flex-end;
  gap:4px;
  overflow:hidden;
}
#left-area .side-stack{flex-direction:row;justify-content:flex-start;}
#right-area .side-stack{flex-direction:row-reverse;justify-content:flex-end;}
.side-rack{
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  flex:0 0 auto;
  max-width:100%;
}
.side-discards-zone{
  flex:1 1 auto;
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  align-items:flex-start;
  overflow:hidden;
}
#right-area .side-discards-zone{align-items:flex-end;}
.side-discards-zone .discard-strip.strip-side{
  display:flex;
  flex-direction:row;
  flex-wrap:wrap-reverse;
  gap:4px;
  align-content:flex-start;
  align-items:flex-end;
  justify-content:flex-end;
  height:100%;
  max-height:100%;
  width:auto;
}
#right-area .side-discards-zone .discard-strip.strip-side{align-content:flex-end;}
.side-discards-zone .discard-strip.strip-side .tile{flex:0 0 auto;}
#left-area .side-rack .melds-row,
#right-area .side-rack .melds-row{
  flex-direction:column;
  flex-wrap:nowrap;
  gap:4px;
  align-items:center;
  flex-shrink:0;
}
#left-area .side-rack .meld-group,
#right-area .side-rack .meld-group{flex-direction:column;}
#left-area .side-rack .meld-group .tile.side,
#right-area .side-rack .meld-group .tile.side{width:34px;height:24px;font-size:11px;overflow:hidden;padding:0;}
.discards-area{display:flex;flex-wrap:wrap;gap:1px;max-width:200px;}

/* center info */
.wall-info{color:#f9f5da;font-size:12px;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.55);}
.treasure-reveal{background:rgba(255,215,0,.2);border:1px solid gold;border-radius:4px;padding:3px 6px;color:#ffe;font-size:11px;text-align:center;}
.message{color:#fff;font-size:12px;text-align:center;background:rgba(0,0,0,.42);padding:5px 10px;border-radius:6px;max-width:min(260px, 94vw);border:1px solid rgba(255,255,255,.08);word-break:break-word;}
.center-console{
  background:linear-gradient(180deg,#151515 0%,#272727 100%);
  border:2px solid #3f3f3f;
  border-radius:10px;
  padding:6px 12px;
  min-width:0;
  width:100%;
  max-width:min(260px, 92vw);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 6px 10px rgba(0,0,0,.4);
}
.center-console .digital{
  font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
  color:#29b8ff;
  font-size:clamp(11px,2.6vw,16px);
  text-align:center;
  letter-spacing:.35px;
  text-shadow:0 0 8px rgba(41,184,255,.55);
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:2px 10px;
  white-space:nowrap;
}
.center-console .digital .score-cell{
  min-width:0;
  overflow:hidden;
  text-overflow:ellipsis;
}
.wind-hud{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;}
.wind-chip{
  min-width:30px;height:24px;padding:0 8px;
  display:flex;align-items:center;justify-content:center;
  border-radius:5px;
  border:1px solid rgba(255,220,140,.45);
  background:linear-gradient(180deg,#252525,#111);
  color:#f1e2ad;font-size:12px;font-weight:bold;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 4px rgba(0,0,0,.45);
}
.wind-chip.active{
  color:#fff7cf;
  border-color:#ffcf5c;
  box-shadow:0 0 10px rgba(255,210,90,.45),inset 0 1px 0 rgba(255,255,255,.2);
}

/* 装飾ウォール（本数は概ね山の残りに連動、演出用） */
.tile.wall-mini.back{
  width:9px;height:13px;border-radius:2px;
  background:
    linear-gradient(118deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,0) 45%),
    linear-gradient(180deg,#ffd88a 0%,#f0a030 42%,#c86a12 88%,#8f4510 100%);
  border:1px solid rgba(255,240,200,.55);
  box-shadow:
    0 1px 0 rgba(255,255,255,.35) inset,
    0 2px 4px rgba(0,0,0,.4);
}
.felt-wall-ornament{
  position:absolute;
  z-index:1;
  display:flex;
  flex-direction:column;
  gap:1px;
  pointer-events:none;
  opacity:0.48;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));
}
.felt-wall-ornament .felt-wall-tier{display:flex;gap:2px;justify-content:center;}
.felt-wall-top{top:6px;left:22%;right:22%;width:auto;align-items:center;}
.felt-wall-bottom{bottom:6px;left:22%;right:22%;width:auto;align-items:center;flex-direction:column-reverse;}

/* 捨て牌リバー */
.discard-river-mat{
  border:1px solid rgba(255,255,255,.22);
  border-radius:6px;
  background:rgba(0,0,0,.08);
  padding:3px 4px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);
}
.discard-row-6:not(.discard-row-sidecol){
  display:grid;
  grid-template-columns:repeat(6,minmax(0,auto));
  gap:2px;
  justify-content:center;
  align-items:end;
}
.discard-row-sidecol{
  display:flex;
  flex-direction:column;
  gap:2px;
  align-items:center;
}
.discard-cell{display:flex;align-items:center;justify-content:center;}
.discard-cell.discard-pending-target{
  border-radius:5px;
  outline:2px solid rgba(255,220,100,.92);
  outline-offset:1px;
  animation:pendingDiscardGlow 1.15s ease-in-out infinite;
}
@keyframes pendingDiscardGlow{
  0%,100%{outline-color:rgba(255,220,100,.55);box-shadow:0 0 0 0 rgba(255,200,80,.25);}
  50%{outline-color:rgba(255,245,180,.98);box-shadow:0 0 14px 2px rgba(255,210,90,.45);}
}
.side-discards-zone .discard-cell.is-claimed .tile.side-disc{
  transform:rotate(-90deg) scale(0.94);
  opacity:.88;
}
.discard-river-mat .discard-cell.is-claimed .tile.lg,
.discard-river-mat .discard-cell.is-claimed .tile.hand-face.opp-hand{
  transform:none;
  opacity:.45;
  filter:saturate(.35) grayscale(.5);
}
.discard-river-mat .discard-cell.is-claimed .tile.lg::before{
  opacity:.55;
}
/* ロン和了: 放銃（点炮）牌を強調 */
.discard-cell.ron-fired{
  position:relative;
  z-index:4;
  animation:ron-fired-pulse 1.1s ease-in-out infinite;
}
.discard-cell.ron-fired::after{
  content:attr(data-ron-label);
  position:absolute;
  left:50%;
  bottom:calc(100% + 4px);
  transform:translateX(-50%);
  padding:2px 8px;
  border-radius:999px;
  background:linear-gradient(180deg,#ff6a3a,#c41e12);
  color:#fff8e8;
  font-size:9px;
  font-weight:bold;
  white-space:nowrap;
  letter-spacing:.04em;
  box-shadow:0 2px 8px rgba(0,0,0,.45),0 0 12px rgba(255,90,40,.65);
  pointer-events:none;
}
.discard-cell.ron-fired .tile{
  outline:2px solid rgba(255,120,40,.95);
  outline-offset:1px;
  filter:drop-shadow(0 0 10px rgba(255,110,30,.85)) drop-shadow(0 0 18px rgba(255,60,20,.45));
}
@keyframes ron-fired-pulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.06);}
}
#meld-fx.mfx-ron{--mfx-main:#ff5a28;--mfx-hot:#ffe8c8;}
#meld-fx.mfx-ron .mfx-stamp{
  font-size:clamp(13px,3.6vw,16px);
  padding:6px 14px;
  border-color:rgba(255,140,60,.75);
}
.ron-reveal-banner{
  margin:4px auto 0;
  padding:5px 12px;
  max-width:min(320px,94vw);
  border-radius:8px;
  border:1px solid rgba(255,140,50,.55);
  background:linear-gradient(180deg,rgba(80,18,8,.82),rgba(40,8,4,.88));
  color:#ffe6c8;
  font-size:11px;
  line-height:1.45;
  text-align:center;
  box-shadow:0 0 18px rgba(255,90,30,.28);
}
.ron-reveal-banner strong{color:#ffd070;}

/* 中央ハブ: 丸い局情報＋上下左右に各席（卓面と同じ向き） */
.table-hub{
  position:relative;
  z-index:5;
  display:grid;
  grid-template-columns:minmax(40px,1fr) auto minmax(40px,1fr);
  grid-template-rows:auto auto auto;
  grid-template-areas:
    ". hub-n ."
    "hub-w hub-core hub-e"
    ". hub-s .";
  width:min(252px,100%);
  max-width:100%;
  margin:4px auto 6px;
  padding:0;
  gap:6px 8px;
  align-items:center;
  justify-items:center;
  background:transparent;
  border:none;
  box-shadow:none;
  flex-shrink:0;
}
.hub-crosshair{
  position:absolute;
  inset:4% 8%;
  pointer-events:none;
  z-index:0;
}
.hub-crosshair::before,
.hub-crosshair::after{
  content:"";
  position:absolute;
  background:linear-gradient(90deg,transparent,rgba(255,220,160,.22),transparent);
}
.hub-crosshair::before{
  left:50%;top:0;bottom:0;width:1px;
  transform:translateX(-50%);
  background:linear-gradient(180deg,transparent,rgba(255,220,160,.2),transparent);
}
.hub-crosshair::after{
  top:50%;left:0;right:0;height:1px;
  transform:translateY(-50%);
}
.hub-arm{position:relative;z-index:2;}
.hub-arm-n{grid-area:hub-n;}
.hub-arm-s{grid-area:hub-s;}
.hub-arm-w{grid-area:hub-w;justify-self:end;}
.hub-arm-e{grid-area:hub-e;justify-self:start;}
.hub-core-wrap{grid-area:hub-core;z-index:3;overflow:visible;min-width:0;}
.hub-arm-e,.hub-arm-w{min-width:0;max-width:100%;}
.hub-wind{
  min-width:44px;
  max-width:100%;
  min-height:auto;
  padding:3px 6px;
  display:inline-flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
  border-radius:6px;
  border:1px solid rgba(40,28,12,.55);
  background:linear-gradient(180deg,#fdf9f0,#e8dcc4 45%,#c4a882);

.deal-wall-tile.spent{animation:none !important;opacity:0;transform:translateY(-8px) scale(.45);filter:blur(1px);flex:0 0 0;width:0;height:0;margin:0;border-width:0;overflow:hidden;pointer-events:none;transition:opacity .22s ease,transform .28s ease,width .22s ease,height .22s ease,margin .22s ease,border-width .22s ease,filter .28s ease;}
.deal-flight-layer{position:fixed;inset:0;pointer-events:none;z-index:119;}
.deal-flight-tile{position:fixed;left:0;top:0;width:20px;height:28px;border-radius:4px;background:linear-gradient(160deg,#2a6b45 0%,#123a24 48%,#081a10 100%);border:1px solid rgba(255,220,120,.48);box-shadow:0 8px 18px rgba(0,0,0,.55),0 0 14px rgba(255,210,90,.22);transform:translate3d(var(--fx,0px),var(--fy,0px),0) scale(1.02) rotate(var(--fr,0deg));opacity:0;will-change:transform,opacity;}

.deal-flight-trail{position:fixed;left:0;top:0;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,rgba(255,246,207,.95),rgba(255,210,90,0));box-shadow:0 0 16px rgba(255,220,120,.75);pointer-events:none;transform:translate3d(var(--fx,0px),var(--fy,0px),0);opacity:0;}

.deal-katan-square{position:absolute;left:50%;bottom:max(10px,env(safe-area-inset-bottom));width:min(92vw,540px);height:min(24vw,118px);margin-left:calc(-1 * min(46vw,270px));border-radius:16px;border:1px solid rgba(255,220,120,.55);background:linear-gradient(180deg,rgba(255,246,207,.12),rgba(0,0,0,.22));box-shadow:0 0 34px rgba(255,210,90,.28),inset 0 0 22px rgba(255,210,90,.12);opacity:0;transform:scale(.86);overflow:hidden;}

#human-hand.deal-staging{display:flex;flex-direction:column;align-items:center;gap:3px;max-width:100%;}

#human-hand.deal-hand-reveal .tile.hand-face:not(.back) .tile-art-hand{animation:dealHandFlipHandFace .82s cubic-bezier(.2,.9,.2,1) backwards;}
#human-hand.deal-hand-reveal .tile:not(.back):not(.hand-face) .tile-art-img,

#human-hand.deal-hand-reveal .tile:not(.back):not(.hand-face):nth-child(odd) .tile-art-img,
#human-hand.deal-hand-reveal .tile:not(.back):not(.hand-face):nth-child(odd) .tile-svg{animation-delay:.05s;}

#human-hand.deal-hand-reveal .tile:not(.back):not(.hand-face):nth-child(3n) .tile-art-img,
#human-hand.deal-hand-reveal .tile:not(.back):not(.hand-face):nth-child(3n) .tile-svg{animation-delay:.1s;}
#human-hand.deal-hand-reveal .tile.hand-face:not(.back):nth-child(5n) .tile-art-hand{animation-delay:.14s;}
#human-hand.deal-hand-reveal .tile:not(.back):not(.hand-face):nth-child(5n) .tile-art-img,
#human-hand.deal-hand-reveal .tile:not(.back):not(.hand-face):nth-child(5n) .tile-svg{animation-delay:.14s;}
@keyframes dealAuroraDrift{0%{transform:rotate(0deg) scale(1);}100%{transform:rotate(360deg) scale(1.04);}}
@keyframes dealSparkFloat{0%,100%{opacity:0;transform:translate3d(0,0,0) scale(.6);}20%{opacity:.9;}50%{opacity:.35;transform:translate3d(var(--spark-dx,0px),var(--spark-dy,-28px),0) scale(1);}80%{opacity:0;}}
@keyframes dealCoreGlow{0%,100%{opacity:.45;transform:scale(.96);}50%{opacity:.95;transform:scale(1.04);}}
@keyframes dealWallTileRise{0%{opacity:0;transform:translateY(10px) scale(.78);}100%{opacity:1;transform:translateY(0) scale(1);}}
@keyframes dealFlightArc{0%{transform:translate3d(var(--fx),var(--fy),0) scale(1.08) rotate(var(--fr,0deg));opacity:1;}42%{transform:translate3d(var(--mx),var(--my),0) scale(1.16) rotate(calc(var(--fr,0deg) + 8deg));opacity:1;}100%{transform:translate3d(var(--tx),var(--ty),0) scale(.9) rotate(0deg);opacity:.88;}}
@keyframes dealTrailFade{0%{opacity:.85;transform:translate3d(var(--fx),var(--fy),0) scale(1);}100%{opacity:0;transform:translate3d(var(--tx),var(--ty),0) scale(.2);}}
@keyframes dealTreasureAscend{0%{opacity:0;transform:scale(.5) translateY(18px);}55%{opacity:1;transform:scale(1.08) translateY(-4px);}100%{opacity:1;transform:scale(1) translateY(0);}}
@keyframes dealTreasureRipple{0%{opacity:.8;transform:scale(.7);}100%{opacity:0;transform:scale(1.8);}}
@keyframes dealSeatPulse{0%{opacity:.35;transform:translate(-50%,-50%) scale(.8);}35%{opacity:1;box-shadow:0 0 28px rgba(255,220,120,.85);transform:translate(-50%,-50%) scale(1.2);}100%{opacity:.35;transform:translate(-50%,-50%) scale(.85);}}
@keyframes dealKatanSquare{0%{opacity:0;transform:scale(.82);}40%{opacity:1;transform:scale(1.03);}100%{opacity:.42;transform:scale(1.08);}}
@keyframes dealKatanScan{0%{opacity:0;transform:translateX(-120%);}20%{opacity:1;}100%{opacity:0;transform:translateX(120%);}}
@keyframes dealHandFlip{0%{transform:rotateY(94deg) translateY(8px);opacity:.15;filter:brightness(.7);}100%{transform:rotateY(0deg) translateY(0);opacity:1;filter:brightness(1);}}
@keyframes dealHandFlipHandFace{0%{transform:rotateY(94deg) translateY(8px);opacity:.15;filter:brightness(.7);}100%{transform:rotateY(0deg) translateY(0);opacity:1;filter:brightness(1);}}

/* === MELD FX (卓上キネマ) === */
#meld-fx{
  --mfx-main:#78fff0;
  --mfx-hot:#ffffff;
  position:fixed;inset:0;
  z-index:150;
  pointer-events:none;
  overflow:hidden;
  opacity:0;
  visibility:hidden;
}
#meld-fx.show{opacity:1;visibility:visible;}
#meld-fx.mfx-chi{--mfx-main:#6adfd5;--mfx-hot:#eafffb;}
#meld-fx.mfx-pon{--mfx-main:#ff6a2f;--mfx-hot:#ffe2a0;}
#meld-fx.mfx-minkan{--mfx-main:#ffd94a;--mfx-hot:#fff7bd;}
#meld-fx.mfx-ankan{--mfx-main:#8aa0ff;--mfx-hot:#e8edff;}
#meld-fx .mfx-veil{
  position:absolute;
  width:min(42vw,280px);
  height:min(42vw,280px);
  border-radius:50%;
  transform:translate(-50%,-50%);
  background:radial-gradient(circle,rgba(255,255,255,.16) 0%,rgba(255,255,255,0) 68%);
  opacity:0;
}
#meld-fx.show .mfx-veil{animation:mfx-veil .92s ease-out forwards;}
#meld-fx .mfx-beam{
  position:absolute;inset:0;
  width:100%;height:100%;
  overflow:visible;
}
#meld-fx .mfx-beam line{
  stroke:var(--mfx-main);
  stroke-width:3;
  stroke-linecap:round;
  filter:drop-shadow(0 0 8px var(--mfx-main));
  stroke-dasharray:1;
  stroke-dashoffset:1;
}
#meld-fx.show .mfx-beam line{animation:mfx-beam .62s cubic-bezier(.2,.85,.2,1) forwards;}
#meld-fx .mfx-flights{position:absolute;inset:0;}
#meld-fx .mfx-flight{
  position:fixed;
  left:0;top:0;
  margin:0;
  z-index:151;
  pointer-events:none;
  will-change:transform,opacity;
  filter:drop-shadow(0 6px 14px rgba(0,0,0,.55));
}
#meld-fx .mfx-flight.tile{width:28px;height:40px;font-size:11px;}
#meld-fx .mfx-flight.mfx-fly{animation:mfx-fly .58s cubic-bezier(.2,.85,.2,1) forwards;}
#meld-fx .mfx-flight.mfx-fly-pon{animation:mfx-fly-pon .52s cubic-bezier(.12,.95,.2,1) forwards;}
#meld-fx .mfx-flight.mfx-fly-kan{animation:mfx-fly-kan .66s cubic-bezier(.16,.9,.2,1) forwards;}
#meld-fx .mfx-flight.mfx-fly-ankan{animation:mfx-fly-ankan .72s ease-in forwards;}
#meld-fx .mfx-stamp{
  position:fixed;
  transform:translate(-50%,-50%) scale(.72);
  padding:6px 14px 8px;
  border-radius:10px;
  font-size:clamp(18px,4.8vw,28px);
  font-weight:900;
  letter-spacing:.12em;
  color:#fff;
  background:linear-gradient(180deg,rgba(8,18,28,.82),rgba(8,18,28,.48));
  border:1px solid color-mix(in srgb,var(--mfx-main),white 42%);
  box-shadow:0 0 18px color-mix(in srgb,var(--mfx-main),transparent 12%),inset 0 0 12px rgba(255,255,255,.14);
  text-shadow:0 2px 6px rgba(0,0,0,.85),0 0 14px var(--mfx-main);
  opacity:0;
}
#meld-fx .mfx-stamp::before{
  content:"";
  position:absolute;inset:-7px;
  border-radius:14px;
  border:1px solid rgba(255,255,255,.22);
  background:
    radial-gradient(circle at 18% 24%,rgba(255,255,255,.24) 0 1px,transparent 2px),
    radial-gradient(circle at 74% 68%,rgba(255,255,255,.18) 0 1px,transparent 2px);
  opacity:.75;
  pointer-events:none;
}
#meld-fx.show .mfx-stamp{animation:mfx-stamp .9s ease-out forwards;}
body.mfx-active .table-shell{transition:filter .12s ease;}
body.mfx-active .table-shell[data-mfx-seat="0"] #bottom-area,
body.mfx-active .table-shell[data-mfx-seat="1"] #left-area,
body.mfx-active .table-shell[data-mfx-seat="2"] #top-area,
body.mfx-active .table-shell[data-mfx-seat="3"] #right-area{
  filter:brightness(1.08) saturate(1.08);
}
body.mfx-active .table-shell[data-mfx-seat="0"] #bottom-area .meld-group:last-child,
body.mfx-active .table-shell[data-mfx-seat="1"] #left-area .meld-group:last-child,
body.mfx-active .table-shell[data-mfx-seat="2"] #top-area .meld-group:last-child,
body.mfx-active .table-shell[data-mfx-seat="3"] #right-area .meld-group:last-child{
  box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 18px var(--mfx-glow,rgba(120,255,240,.4));
}
@keyframes mfx-veil{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.55);}
  18%{opacity:.95;}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.18);}
}
@keyframes mfx-beam{
  0%{stroke-dashoffset:1;opacity:0;}
  12%{opacity:1;}
  100%{stroke-dashoffset:0;opacity:0;}
}
@keyframes mfx-fly{
  0%{transform:translate(0,0) scale(1.08);opacity:0;}
  10%{opacity:1;}
  100%{transform:translate(var(--tx),var(--ty)) scale(1);opacity:0;}
}
@keyframes mfx-fly-pon{
  0%{transform:translate(0,0) scale(1.14) rotate(-6deg);opacity:0;}
  12%{opacity:1;}
  70%{transform:translate(calc(var(--tx)*.92),calc(var(--ty)*.92)) scale(1.04) rotate(2deg);opacity:1;}
  100%{transform:translate(var(--tx),var(--ty)) scale(1) rotate(0);opacity:0;}
}
@keyframes mfx-fly-kan{
  0%{transform:translate(0,0) scale(1.1);opacity:0;}
  10%{opacity:1;}
  55%{transform:translate(calc(var(--tx)*.78),calc(var(--ty)*.78)) scale(1.02);opacity:1;}
  100%{transform:translate(var(--tx),var(--ty)) scale(.98);opacity:0;}
}
@keyframes mfx-fly-ankan{
  0%{transform:translate(0,0) scale(1.02);opacity:0;}
  14%{opacity:.92;}
  100%{transform:translate(var(--tx),var(--ty)) scale(.84);opacity:0;}
}
@keyframes mfx-stamp{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.5) rotate(-8deg);}
  20%{opacity:1;transform:translate(-50%,-50%) scale(1.06) rotate(2deg);}
  72%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.02) rotate(0);}
}

<script>
// ======================================================
// TILE UTILITIES
// ======================================================
const SUIT_ORDER = {m:0,p:1,s:2,z:3};
const SUIT_NAME  = {m:'万',p:'筒',s:'索',z:''};
const SUIT_CLS   = {m:'man',p:'pin',s:'sou',z:'chun'};

const tileKey  = t => t.suit+t.num;
const tileEq   = (a,b) => a.suit===b.suit && a.num===b.num;
const sortTiles = arr => [...arr].sort((a,b)=>SUIT_ORDER[a.suit]-SUIT_ORDER[b.suit]||a.num-b.num);
const countTile = (arr,t) => arr.filter(x=>tileEq(x,t)).length;
const uniq      = arr => arr.filter((t,i)=>arr.findIndex(x=>tileEq(x,t))===i);
const nextPlayer = i => (i+3)%4; // counter-clockwise

/** ハルビン配牌（scripts/harbin-deal.mjs と同期） */
const HARBIN_DEAL_CHUNK=6;
const HARBIN_DEAL_ROUNDS=2;
function dealOrderFromDealer(dealer){
  const order=[];
  let s=dealer;
  for(let i=0;i<4;i++){order.push(s);s=nextPlayer(s);}
  return order;
}
function dealHarbinHands(wall,dealer){
  const hands=[[],[],[],[]];
  const order=dealOrderFromDealer(dealer);
  for(let round=0;round<HARBIN_DEAL_ROUNDS;round++){
    for(const seat of order) hands[seat].push(...wall.splice(0,HARBIN_DEAL_CHUNK));
  }
  hands[dealer].push(wall.shift());
  wall.splice(0,2);
  hands[dealer].push(wall.shift());
  for(const seat of order){
    if(seat===dealer) continue;
    hands[seat].push(wall.shift());
  }
  const v=validateHarbinHands(hands,dealer);
  if(!v.ok) console.error('harbin deal',v.errors);
  return {hands,wall};
}
function validateHarbinHands(hands,dealer){
  const errors=[];
  for(let s=0;s<4;s++){
    const want=s===dealer?(HARBIN_DEAL_CHUNK*HARBIN_DEAL_ROUNDS+2):(HARBIN_DEAL_CHUNK*HARBIN_DEAL_ROUNDS+1);
    if((hands[s]?.length||0)!==want) errors.push(`seat${s}:${hands[s].length}!=${want}`);
  }
  if(hands.reduce((n,h)=>n+h.length,0)!==53) errors.push('total!=53');
  return {ok:!errors.length,errors};
}

function removeTile(arr, t){
  const i = arr.findIndex(x=>tileEq(x,t));
  if(i<0) return null;
  return [...arr.slice(0,i),...arr.slice(i+1)];
}
function removeTiles(arr, ts){
  let r=[...arr];
  for(const t of ts){r=removeTile(r,t);if(!r)return null;}
  return r;
}
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function createDeck(){
  const d=[];
  for(const s of['m','p','s']) for(let n=1;n<=9;n++) for(let i=0;i<4;i++) d.push({suit:s,num:n});
  for(let i=0;i<4;i++) d.push({suit:'z',num:5});
  return d;
}

const DEFAULT_ONLINE_API_BASE='https://harbin-mahjong-online.onrender.com';

const UI={
  lang:'ja',
  difficulty:'normal',
  settingsOpen:false,
  apiBase:DEFAULT_ONLINE_API_BASE,
};

const ONLINE={
  room:null,
  playerId:null,
  seat:null,
  source:null,
  status:'',
  private:null,
  sseDisconnected:false,
};
let ONLINE_DEALER_REVEAL=null;
let ONLINE_ROULETTE_ACTIVE=false;
let ONLINE_DEAL_CINEMA_DONE=null;
let ONLINE_RON_FX_DONE=null;
let ONLINE_MATCH_RESULT=null;
let DEAL_CINEMA_TIMERS=[];
let DEAL_CINEMA_FLIGHT_LAYER=null;
let DEAL_CINEMA_SKIP=false;
const DEAL_WALL_VIEW_SIDE=['bottom','left','top','right'];
let DEAL_WALL_STATE=null;
let DEAL_DICE_CTX=null;

function rollD6(){return 1+Math.floor(Math.random()*6);}
function openerViewFromDealerDice(dealerView,sum){
  return dealCinemaViewOrder(dealerView)[(sum-1)%4];
}
function breakColFromDice(sum){return Math.min(Math.max(sum,2),11);}
function wallSideOrderFromOpener(openerView){
  return dealCinemaViewOrder(openerView).map(v=>DEAL_WALL_VIEW_SIDE[v]);
}
function sideLabelForWall(side){
  const m={bottom:tr('seatSelf','手前'),left:tr('seatLeft','左'),top:tr('seatAcross','対面'),right:tr('seatRight','右')};
  return m[side]||side;
}
function humanViewSeat(){return 0;}
function isHumanDealer(){
  if(!G) return false;
  if(G.online) return onlineRealSeat(0)===(G.dealerReal??ONLINE.room?.game?.dealer);
  return G.dealer===0;
}
function isHumanOpener(openerView){return openerView===humanViewSeat();}
function setDieFace(el,n){
  if(!el) return;
  el.classList.remove('d1','d2','d3','d4','d5','d6','rolling');
  el.classList.add('d'+n);
}
function animateDiceRoll(d1,d2,cb){
  const a=document.getElementById('deal-die-a');
  const b=document.getElementById('deal-die-b');
  a?.classList.add('rolling');
  b?.classList.add('rolling');
  GameSFX.play('dice');
  let t=0;
  const tick=setInterval(()=>{
    setDieFace(a,rollD6());
    setDieFace(b,rollD6());
    t++;
    if(t>=14){
      clearInterval(tick);
      a?.classList.remove('rolling');
      b?.classList.remove('rolling');
      setDieFace(a,d1);
      setDieFace(b,d2);
      GameSFX.play('dice_land');
      fxVibrate([8,12,8]);
      setTimeout(cb,520);
    }
  },85);
}
function hideDealDice(){
  const el=document.getElementById('deal-dice');
  if(el) el.classList.add('hidden');
}
function showDealDicePhase(phase,onComplete){
  const overlay=document.getElementById('deal-dice');
  const title=document.getElementById('deal-dice-title');
  const sub=document.getElementById('deal-dice-sub');
  const btn=document.getElementById('deal-dice-roll-btn');
  if(!overlay||!btn) return onComplete?.();
  const preset=DEAL_DICE_CTX?.preset;
  const dealerView=G?.dealer??0;
  if(phase==='dealer'){
    if(title) title.textContent=tr('dealDiceDealerTitle','親がダイスを振る');
    if(sub) sub.textContent=tr('dealDiceDealerSub','合計で開門者（次に牌を取る人）を決めます');
  }else{
    const ov=DEAL_DICE_CTX?.openerView??0;
    if(title) title.textContent=tr('dealDiceOpenerTitle','開門者がダイスを振る');
    if(sub) sub.textContent=tr('dealDiceOpenerSub','合計で牌山の取り始め位置を決めます')+' — '+sideName(ov);
  }
  overlay.classList.remove('hidden');
  const needHuman=phase==='dealer'?isHumanDealer():isHumanOpener(DEAL_DICE_CTX?.openerView??0);
  btn.style.display=needHuman?'inline-block':'none';
  const run=()=>{
    btn.disabled=true;
    let d1,d2;
    if(phase==='dealer'&&preset){
      d1=preset.dealerDice[0]; d2=preset.dealerDice[1];
    }else if(phase==='opener'&&preset){
      d1=preset.openerDice[0]; d2=preset.openerDice[1];
    }else{
      d1=rollD6(); d2=rollD6();
    }
    animateDiceRoll(d1,d2,()=>{
      const sum=d1+d2;
      if(phase==='dealer'){
        DEAL_DICE_CTX.dealerDice=[d1,d2];
        DEAL_DICE_CTX.dealerSum=sum;
        if(preset) DEAL_DICE_CTX.openerView=onlineViewSeat(preset.openerSeat);
        else DEAL_DICE_CTX.openerView=openerViewFromDealerDice(dealerView,sum);
        if(sub) sub.textContent=tr('dealDiceSum','合計 {n}').replace('{n}',String(sum))+' — '+tr('dealDiceOpenerIs','開門者: {name}').replace('{name}',sideName(DEAL_DICE_CTX.openerView));
        btn.disabled=false;
        setTimeout(()=>showDealDicePhase('opener',onComplete),900);
      }else{
        DEAL_DICE_CTX.openerDice=[d1,d2];
        DEAL_DICE_CTX.openerSum=sum;
        DEAL_DICE_CTX.breakCol=preset?preset.breakCol:breakColFromDice(sum);
        const side=wallSideOrderFromOpener(DEAL_DICE_CTX.openerView)[0];
        if(sub) sub.textContent=tr('dealDiceBreakAt','{side}の牌山・左から{n}墩目の次から')
          .replace('{side}',sideLabelForWall(side))
          .replace('{n}',String(sum));
        hideDealDice();
        initDealWallState(DEAL_DICE_CTX.openerView,DEAL_DICE_CTX.breakCol);
        if(G) G.dealBreak={...DEAL_DICE_CTX};
        btn.disabled=false;
        onComplete?.();
      }
    });
  };
  btn.onclick=run;
  if(!needHuman) setTimeout(run,600);
}
function runDealDiceSequence(done){
  const preset=G?.online?ONLINE.room?.game?.dealBreak:null;
  DEAL_DICE_CTX={phase:'dealer',dealerView:G?.dealer??0,preset};
  if(preset){
    DEAL_DICE_CTX.openerView=onlineViewSeat(preset.openerSeat);
    DEAL_DICE_CTX.breakCol=preset.breakCol;
    DEAL_DICE_CTX.dealerSum=preset.dealerSum;
    DEAL_DICE_CTX.openerSum=preset.openerSum;
  }
  showDealDicePhase('dealer',done);
}
function initDealWallState(openerView,breakCol){
  DEAL_WALL_STATE={
    sideOrder:wallSideOrderFromOpener(openerView),
    sideIdx:0,
    col:breakCol,
    openerView,
  };
}
function currentDealWallSide(){
  if(!DEAL_WALL_STATE) return DEAL_WALL_VIEW_SIDE[G?.dealer??0];
  return DEAL_WALL_STATE.sideOrder[DEAL_WALL_STATE.sideIdx];
}
function advanceDealWallCol(delta){
  if(!DEAL_WALL_STATE) return;
  DEAL_WALL_STATE.col+=delta;
  while(DEAL_WALL_STATE.col>11){
    DEAL_WALL_STATE.col-=12;
    DEAL_WALL_STATE.sideIdx=(DEAL_WALL_STATE.sideIdx+1)%4;
  }
}
function highlightDealWallBreak(){
  document.querySelectorAll('.deal-wall-break-mark').forEach(el=>el.remove());
  if(!DEAL_WALL_STATE) return;
  const side=DEAL_WALL_STATE.sideOrder[0];
  const col=DEAL_WALL_STATE.col;
  const wall=document.getElementById(`deal-wall-${side}`);
  if(!wall) return;
  const tiers=[...wall.querySelectorAll('.deal-wall-tier')];
  const tier=tiers[0];
  const tile=tier?.querySelectorAll('.deal-wall-tile:not(.spent)')[col];
  if(!tile) return;
  const mark=document.createElement('div');
  mark.className='deal-wall-break-mark';
  const trc=tile.getBoundingClientRect();
  const wrc=wall.getBoundingClientRect();
  mark.style.left=(trc.left-wrc.left)+'px';
  mark.style.top=(trc.top-wrc.top)+'px';
  wall.appendChild(mark);
}

const TURN_LIMIT_MS=30000;
let _turnTimerGeneration=0;
let _turnTickTimer=null;

function clearTurnTimer(){
  _turnTimerGeneration++;
  if(_turnTickTimer){clearInterval(_turnTickTimer);_turnTickTimer=null;}
  const el=document.getElementById('turn-timer');
  if(el){el.classList.add('hidden');el.textContent='';}
}

function shouldArmHumanTurnTimer(){
  if(!G||G.gameOver)return false;
  if(G.turn!==0)return false;
  const p0=G.players[0];
  if(G.phase==='after_discard'&&G.humanOptions&&G.humanOptions.length)return true;
  if(G.phase==='discard'&&p0.kouTing){
    if(G.ktReveal) return false;
    const exp=expectedHandCount(p0);
    if(p0.hand.length===exp&&G.wall.length>0) return true;
    if(p0.hand.length>exp) return true;
    return false;
  }
  if(G.phase==='discard'&&!p0.kouTing)return true;
  return false;
}

function leaveToMenu(){
  if(G&&!G.gameOver){
    if(!confirm(t('backToMenuConfirm')))return;
  }
  clearTurnTimer();
  if(ONLINE.source){try{ONLINE.source.close();}catch(_e){}ONLINE.source=null;}
  ONLINE.room=null;

  ONLINE.seat=null;
  ONLINE.private=null;

  ONLINE.sseDisconnected=false;
  ONLINE_DEALER_REVEAL=null;

  ONLINE_DEAL_CINEMA_DONE=null;
  ONLINE_MATCH_RESULT=null;

  _overlayFocusPrev=null;
  const ov=document.getElementById('overlay');
  if(ov) ov.classList.add('hidden');
  closeRulebook();
  clearMeldFx();
  renderStartScreen();
}

function applyTurnTimeoutAction(){
  if(!G||G.gameOver)return;
  const p0=G.players[0];
  if(G.online){
    if(G.phase==='after_discard'&&G.humanOptions.length){
      if(onlineLegal('skip')) onlineAction('skip');
      return;
    }
    if(G.phase==='discard'&&G.turn===0&&!p0.kouTing){
      const ktEntry=G.kouTingEntryIdx||[];
      if(ktEntry.length===1&&onlineLegal('kouting')){
        onlineAction('kouting',{index:ktEntry[0]});
        return;
      }
      const t=aiFindDiscard(p0);
      const idx=p0.hand.findIndex(x=>tileEq(x,t));
      if(idx>=0) onlineAction('discard',{index:idx});
      return;
    }
    if(G.phase==='discard'&&p0.kouTing){
      const exp=expectedHandCount(p0);
      if(p0.hand.length===exp&&onlineLegal('draw')){
        onlineAction('draw');
        return;
      }
      if(p0.hand.length>exp){
        const leg=kouTingLegalDiscardIndices(p0);
        if(leg.length) onlineAction('discard',{index:leg[0]});
      }
      return;
    }
    return;
  }
  if(G.phase==='after_discard'&&G.humanOptions.length){humanSkip();return;}
  if(G.phase==='discard'&&p0.kouTing){
    if(G.ktReveal) return;
    const exp=expectedHandCount(p0);
    if(p0.hand.length===exp&&G.wall.length>0){humanDraw();return;}
    if(p0.hand.length>exp){
      const leg=kouTingLegalDiscardIndices(p0);
      if(leg.length) humanDiscard(leg[0]);
    }
    return;
  }
  if(G.phase==='discard'&&!p0.kouTing){
    const ktEntry=kouTingEntryDiscardIndices(p0);
    if(ktEntry.length===1){
      G.kouTingPick=true;
      enterKouTingByDiscard(p0,ktEntry[0]);
      return;
    }
    const t=aiFindDiscard(p0);
    const idx=p0.hand.findIndex(x=>tileEq(x,t));
    if(idx>=0) humanDiscard(idx);
  }
}

function onTurnTimeDeadline(scheduledGen){
  if(scheduledGen!==_turnTimerGeneration)return;
  if(!G||G.gameOver)return;
  if(!shouldArmHumanTurnTimer())return;
  clearTurnTimer();
  applyTurnTimeoutAction();
}

function armTurnTimer(){
  clearTurnTimer();
  if(!G||G.gameOver)return;
  if(G.dealCinemaActive)return;
  if(!shouldArmHumanTurnTimer())return;
  const scheduledGen=_turnTimerGeneration;
  const deadline=Date.now()+TURN_LIMIT_MS;
  const el=document.getElementById('turn-timer');
  const tick=()=>{
    if(scheduledGen!==_turnTimerGeneration)return;
    const left=Math.max(0,Math.ceil((deadline-Date.now())/1000));
    if(el){
      el.classList.remove('hidden');
      el.textContent=left>0?`${tr('turnTimeLeft','残り')} ${left} ${tr('turnTimeSec','秒')}`:`0 ${tr('turnTimeSec','秒')}`;
    }
  };
  tick();
  _turnTickTimer=setInterval(tick,500);
  setTimeout(()=>onTurnTimeDeadline(scheduledGen),TURN_LIMIT_MS);
}

function normalizeApiBase(v){
  const s=String(v||'').trim();
  if(!s) return '';
  return s.replace(/\/+$/,'');
}
function apiUrl(path){
  const base=normalizeApiBase(UI.apiBase);
  return `${base}${path}`;
}
function loadUiPrefs(){
  try{
    const raw=localStorage.getItem('hm_api_base');
    if(raw===null) UI.apiBase=normalizeApiBase(DEFAULT_ONLINE_API_BASE);
    else UI.apiBase=normalizeApiBase(raw);
  }catch(_e){}
}
function saveUiPrefs(){
  try{
    localStorage.setItem('hm_api_base',normalizeApiBase(UI.apiBase));
  }catch(_e){}
}
function setOnlineServerUrl(){
  const input=prompt(tr('onlineServer','対戦サーバーURL'),UI.apiBase||'');
  if(input===null) return;
  UI.apiBase=normalizeApiBase(input);
  saveUiPrefs();
  renderStartScreen();
}
function clearOnlineServerUrl(){
  UI.apiBase=normalizeApiBase(DEFAULT_ONLINE_API_BASE);
  saveUiPrefs();
  renderStartScreen();
}

async function onlineRequest(path, body){
  const res=await fetch(apiUrl(path),{
    method:'POST',
    headers:{'content-type':'application/json'},
    body:JSON.stringify(body||{})
  });
  const data=await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error||`HTTP ${res.status}`);
  return data;
}

function connectOnlineEvents(){
  if(!ONLINE.room||!ONLINE.playerId) return;
  if(ONLINE.source) ONLINE.source.close();
  const code=ONLINE.room.id;
  const source=new EventSource(apiUrl(`/api/rooms/${code}/events?playerId=${encodeURIComponent(ONLINE.playerId)}`));
  ONLINE.source=source;
  source.addEventListener('hello',ev=>{
    const data=JSON.parse(ev.data);
    ONLINE.room=data.room;
    ONLINE.private=data.private;
    ONLINE.sseDisconnected=false;
    ONLINE.status=tr('onlineConnected','接続中');
    renderOnlineOrStart();
  });
  source.addEventListener('room_state',ev=>{
    ONLINE.room=JSON.parse(ev.data);
    ONLINE.sseDisconnected=false;
    ONLINE.status=tr('onlineConnected','接続中');
    renderOnlineOrStart();
  });
  source.addEventListener('private_state',ev=>{
    ONLINE.private=JSON.parse(ev.data);
    renderOnlineOrStart();
  });
  source.onerror=()=>{
    try{source.close();}catch(_e){}
    if(ONLINE.source===source) ONLINE.source=null;
    ONLINE.sseDisconnected=true;
    ONLINE.status=tr('onlineDisconnected','未接続');
    renderOnlineOrStart();
  };
}

function buildOnlineGame(){
  const room=ONLINE.room, priv=ONLINE.private;
  if(!room?.game||!priv) return null;
  const players=[0,1,2,3].map(view=>{
    const real=onlineRealSeat(view);
    const isHuman=view===0;
    const kouTing=!!room.game.kouTing?.[real];
    const hand=isHuman?sortTiles(priv.hand||[]):Array.from({length:room.game.handCounts?.[real]||0},()=>({suit:'z',num:5}));
    const waits=kouTing&&isHuman?getKatanWaits(hand):[];
    return {
      idx:view,
      realSeat:real,
      name:isHuman?onlinePlayerName(real):onlinePlayerName(real),
      isHuman,
      hand,
      melds:room.game.melds?.[real]||[],
      discards:room.game.discards?.[real]||[],
      isTenpai:false,
      kouTing,
      waits,
      drawnTile:isHuman&&priv.lastDraw?priv.lastDraw:null,
    };
  });
  const legal=priv.legalActions||[];
  const humanOptions=[];
  let phase='discard';
  let chiOpts=[];
  if(legal.some(a=>a.type==='ron')){phase='after_discard';humanOptions.push('win');}
  if(legal.some(a=>a.type==='minkan')){phase='after_discard';humanOptions.push('minkan');}
  if(legal.some(a=>a.type==='pon')){phase='after_discard';humanOptions.push('pon');}
  const chi=legal.find(a=>a.type==='chi');
  if(chi){phase='after_discard';humanOptions.push('chi');chiOpts=chi.options||[];}
  if(legal.some(a=>a.type==='skip')) phase='after_discard';
  if(legal.some(a=>a.type==='tsumo')) humanOptions.push('tsumo');
  const pending=room.game.pending;
  const winner=room.game.winner;
  const handEnded=room.game.status==='ended';
  const scores=[0,1,2,3].map(view=>room.match?.scores?.[onlineRealSeat(view)]??0);
  let lastWin=null;
  let endMsg=null;
  if(winner&&winner.type&&winner.type!=='draw'&&winner.seat!=null){
    const wView=onlineViewSeat(winner.seat);
    const fromView=winner.from!=null?onlineViewSeat(winner.from):null;
    const isTsumo=winner.type==='tsumo';
    const isTreasure=!!winner.treasure;
    const deltasReal=winner.scoreDeltas||(isTsumo?getTsumoScoreDeltas(winner.seat,4):getRonScoreDeltas(winner.seat,winner.from,winner.discarderListening!==false,2));
    const deltas=[0,1,2,3].map(v=>deltasReal[onlineRealSeat(v)]);
    const totalPts=deltas[wView]||0;
    const fromName=fromView!=null?sideName(fromView):null;
    lastWin={
      winner:wView,
      tile:winner.tile,
      method:winner.type,
      points:totalPts,
      from:fromView,
      discarderListening:winner.discarderListening,
      isTsumo,
      isTreasure,
      scoreDeltas:deltas,
      detail:buildWinScoreDetail(wView,deltas,isTsumo,fromView??-1,winner.discarderListening!==false),
    };
    if(winner.type==='ron'&&fromName!=null){
      endMsg=`${sideName(wView)} ${tr('ron','ロン！')} ${tileName(winner.tile)} (+${totalPts})\n${tr('dianpao','点炮')}: ${fromName}`;
    }else{
      endMsg=`${onlinePlayerName(winner.seat)} ${winner.type} (+${totalPts})`;
    }
  }
  return {
    online:true,
    players,
    wall:Array.from({length:room.game.wallCount||0},()=>({suit:'z',num:5})),
    treasure:priv.treasure||{suit:'z',num:5},
    turn:onlineViewSeat(room.game.turn||0),
    dealer:onlineViewSeat(room.game.dealer||0),
    dealerReal:room.game.dealer||0,
    phase,
    pendingDiscard:pending?.tile||null,
    pendingFrom:pending?onlineViewSeat(pending.from):-1,
    humanOptions,
    chiOpts,
    ankanOpts:[],
    scores,
    treasureUsed:!!room.game.treasureUsed,
    msg:winner
      ? (winner.type==='draw'
        ? tr('roundDraw','流局')
        : (endMsg||`${onlinePlayerName(winner.seat)} ${winner.type}`))
      : (room.match
        ? tr('matchRound','第{n} / {t}局').replace('{n}',String(room.match.round)).replace('{t}',String(room.match.totalRounds))
        : `${tr('onlineRoom','部屋コード')}: ${room.id}`),
    log:[],
    gameOver:handEnded,
    roundOver:handEnded,
    handsRevealed:handEnded,
    lastDrawn:priv.lastDraw||null,
    tsumoTile:legal.find(a=>a.type==='tsumo')?.tile||null,
    dealerOpeningDiscardNoDraw:false,
    skipDrawAfterCallBy:null,
    pendingKouTingFrom:null,
    kouTingPick:false,
    kouTingEntryIdx:legal.find(a=>a.type==='kouting')?.indices||[],
    ktReveal:null,
    lastWin,
    fxFlash:null,
    kanBranchBActive:false,
    kanBranchAOpts:null,
    discardedThisTurn:false,
    kanTurnEnding:false,
    _epoch:0,
  };
}

  const body=UI.lang==='zh'
    ? `${tr('matchTotal','合计分')}: ${ranked.map(r=>`${r.name} ${r.score}`).join(' / ')}`
    : `${tr('matchTotal','合計点')}: ${ranked.map(r=>`${r.name} ${r.score}`).join(' / ')}`;

    ? `领先: ${leader?leader.name:'—'} (${leader?leader.score:0}分)\n${ranked.map((r,n)=>`${n+1}. ${r.name} ${r.score}`).join('\n')}`
    : `トップ: ${leader?leader.name:'—'} (${leader?leader.score:0}点)\n${ranked.map((r,n)=>`${n+1}. ${r.name} ${r.score}`).join('\n')}`;
  showOverlay(title,body,detail);

function renderOnlineOrStart(){
  if(ONLINE.room?.match?.finished){
    const resultKey=`${ONLINE.room.id}:done`;
    if(ONLINE_MATCH_RESULT!==resultKey){
      ONLINE_MATCH_RESULT=resultKey;
      showOnlineMatchSetResult();
    }
  }
  if(!ONLINE.room?.game||!ONLINE.private){
    if(G&&!G.online){render();return;}
    renderStartScreen();
    return;
  }
  const room=ONLINE.room;
  const freshHand=!(room.game.discards||[]).some(d=>d.length>0);
  const revealKey=`${room.id}:${room.match?.round||0}:${room.version}`;
  if(room.match?.round===1&&freshHand&&!ONLINE_ROULETTE_ACTIVE&&ONLINE_DEALER_REVEAL!==revealKey){
    ONLINE_ROULETTE_ACTIVE=true;
    spinDealerRoulette(()=>{
      ONLINE_DEALER_REVEAL=revealKey;
      ONLINE_ROULETTE_ACTIVE=false;
      G=buildOnlineGame();
      if(!G){
        scheduleMatch(()=>renderOnlineOrStart(),80);
        return;
      }
      G._epoch=++MATCH_EPOCH;
      beginRoundDealCinema(()=>{
        ONLINE_DEAL_CINEMA_DONE=revealKey;
        render();
      });
    }, room.game.dealer);
    return;
  }
  if(ONLINE_ROULETTE_ACTIVE) return;
  G=buildOnlineGame();
  if(!G){
    renderStartScreen();
    return;
  }
  if(G.gameOver&&G.lastWin&&G.lastWin.from!=null&&!G.lastWin.isTsumo){
    const ronFxKey=`${room.id}:${room.match?.round||0}:ron:${G.lastWin.from}:${tileKey(G.lastWin.tile)}`;
    if(ONLINE_RON_FX_DONE!==ronFxKey){
      ONLINE_RON_FX_DONE=ronFxKey;
      render();
      scheduleMatch(()=>playRonRevealFx(G.lastWin.winner,G.lastWin.from,G.lastWin.tile),180);
      return;
    }
  }
  if(freshHand&&ONLINE_DEAL_CINEMA_DONE!==revealKey){
    G._epoch=++MATCH_EPOCH;
    beginRoundDealCinema(()=>{
      ONLINE_DEAL_CINEMA_DONE=revealKey;
      render();
    });
    return;
  }
  render();
}

function spinDealerRoulette(done,fixedDealer=null){
  const overlay=document.getElementById('dealer-roulette');
  const spin=document.getElementById('dealer-roulette-spin');
  const title=document.getElementById('dealer-roulette-title');
  const sub=document.getElementById('dealer-roulette-sub');
  if(!overlay||!spin) return done(0);
  const dealer=fixedDealer==null?Math.floor(Math.random()*4):fixedDealer;
  layoutDealerRouletteLabels(spin);
  const dealerView=seatViewSeat(dealer);
  const fullTurns=5+Math.floor(Math.random()*2);
  const endDeg=fullTurns*360+dealerRouletteEndAngle(dealerView);
  if(title) title.textContent=tr('dealerRoll','親決め');
  if(sub) sub.textContent=tr('dealerRouletteSpin','ルーレット回転中…');
  spin.style.transition='none';
  spin.style.transform='rotate(0deg)';
  void spin.offsetWidth;
  overlay.classList.remove('hidden');
  const spinMs=3900;
  requestAnimationFrame(()=>{
    requestAnimationFrame(()=>{
      spin.style.transition=`transform ${spinMs}ms cubic-bezier(.15,.85,.1,1)`;
      spin.style.transform=`rotate(${endDeg}deg)`;
    });
  });
  GameSFX.play('tap');
  setTimeout(()=>{
    const dealerName=windLabelForRealSeat(dealer, dealer);
    if(sub) sub.textContent=tr('dealerIs','{name}が親').replace('{name}',dealerName);
    GameSFX.play('tap');
    setTimeout(()=>{
      overlay.classList.add('hidden');
      spin.style.transition='none';
      spin.style.transform='rotate(0deg)';
      done(dealer);
    },900);
  },spinMs+120);
}

function dealCinemaViewOrder(dealerView){
  const order=[];
  let seat=dealerView;
  for(let i=0;i<4;i++){order.push(seat);seat=nextPlayer(seat);}
  return order;
}

/** 配牌演出: 6枚塊×2巡 → 親チョンチョン(1・跳2・1) → 閑家各1 */
function buildDealCinemaSteps(dealerView){
  const order=dealCinemaViewOrder(dealerView);
  const steps=[];
  for(let round=0;round<HARBIN_DEAL_ROUNDS;round++){
    for(const view of order) steps.push({view,count:HARBIN_DEAL_CHUNK,phase:'chunk'});
  }
  steps.push({view:dealerView,count:1,phase:'chon'});
  steps.push({wallSkip:2,phase:'chon'});
  steps.push({view:dealerView,count:1,phase:'chon'});
  for(let i=1;i<order.length;i++) steps.push({view:order[i],count:1,phase:'bu'});
  return steps;
}

function dealCinemaFinalCounts(steps){
  const counts=[0,0,0,0];
  for(const step of steps){
    if(step.wallSkip) continue;
    counts[step.view]+=step.count||1;
  }
  return counts;
}

/** handSlot: 0..5 ＝ 二段三列グリッド内の着地点 */
function seatHandLandingPoint(view,handSlot=0){
  const selectors={
    0:'#human-hand',
    1:'#left-area .side-col',
    2:'#top-area .north-hand-row',
    3:'#right-area .side-col',
  };
  const el=document.querySelector(selectors[view]);
  const col=handSlot%3;
  const row=Math.floor(handSlot/3);
  if(!el){
    const cx=window.innerWidth/2;
    const cy=window.innerHeight/2;
    const seatOffset=[{x:0,y:120},{x:-140,y:0},{x:0,y:-120},{x:140,y:0}][view]||{x:0,y:0};
    return {x:cx+seatOffset.x+(col-1)*10,y:cy+seatOffset.y+row*8};
  }
  const rect=el.getBoundingClientRect();
  const spreadX=view===1||view===3?5:10;
  const spreadY=view===1||view===3?8:14;
  if(view===0||view===2){
    return {
      x:rect.left+8+col*spreadX,
      y:rect.top+rect.height*0.35+row*spreadY,
    };
  }
  return {
    x:rect.left+rect.width*0.35+row*spreadY,
    y:rect.top+8+col*spreadX,
  };
}

/** 開門者の牌壁から次の3列（2段×3枚＝6枚塊）の DOM */
function pickDealWallChunkTiles(side,colStart){
  const wall=document.getElementById(`deal-wall-${side}`);
  if(!wall) return [];
  const tiers=[...wall.querySelectorAll('.deal-wall-tier')];
  const picked=[];
  for(const tier of tiers){
    const tiles=[...tier.querySelectorAll('.deal-wall-tile:not(.spent)')];
    for(let i=0;i<3;i++){
      const t=tiles[colStart+i];
      if(t) picked.push(t);
    }
  }
  return picked;
}

function rectsCenter(els){
  if(!els.length) return {x:window.innerWidth/2,y:window.innerHeight*0.44};
  let l=Infinity,t=Infinity,r=-Infinity,b=-Infinity;
  els.forEach(el=>{
    const rc=el.getBoundingClientRect();
    l=Math.min(l,rc.left); t=Math.min(t,rc.top);
    r=Math.max(r,rc.right); b=Math.max(b,rc.bottom);
  });
  return {x:(l+r)/2,y:(t+b)/2};
}

function removeDealWallTiles(els){
  els.forEach(el=>el.classList.add('spent'));
  scheduleDealCinema(()=>{els.forEach(el=>{if(el.parentNode) el.remove();});},280);
}

/** 2段3列を牌壁から一括で消費（開門位置から反時計回りに進む） */
function consumeDealWallChunk(){
  const side=currentDealWallSide();
  const col=DEAL_WALL_STATE?.col??0;
  const tiles=pickDealWallChunkTiles(side,col);
  removeDealWallTiles(tiles);
  advanceDealWallCol(3);
  return {side,col,tiles,center:rectsCenter(tiles)};
}

function pickDealWallSingleTile(side,col){
  const tiers=[...document.getElementById(`deal-wall-${side}`)?.querySelectorAll('.deal-wall-tier')||[]];
  const tier=tiers[tiers.length-1]||tiers[0];
  const row=[...tier?.querySelectorAll('.deal-wall-tile:not(.spent)')||[]];
  return row[col]||row[0]||null;
}

/** 塊の次の列から1枚（チョンチョン・補牌用） */
function consumeDealWallSingle(){
  const side=currentDealWallSide();
  const col=DEAL_WALL_STATE?.col??0;
  const t=pickDealWallSingleTile(side,col);
  if(t) removeDealWallTiles([t]);
  advanceDealWallCol(1);
  return rectsCenter(t?[t]:[]);
}

/** チョンチョンの「跳」：牌壁から n 枚だけ消す（飛ばさない） */
function consumeDealWallSkip(n){
  const side=currentDealWallSide();
  const col=DEAL_WALL_STATE?.col??0;
  const tiers=[...document.getElementById(`deal-wall-${side}`)?.querySelectorAll('.deal-wall-tier')||[]];
  const picked=[];
  for(const tier of tiers){
    const row=[...tier.querySelectorAll('.deal-wall-tile:not(.spent)')];
    for(let i=0;i<n&&col+i<row.length;i++) picked.push(row[col+i]);
  }
  removeDealWallTiles(picked.slice(0,n));
  advanceDealWallCol(n);
}

function seatHandChunkCenter(view){
  let x=0,y=0;
  for(let i=0;i<HARBIN_DEAL_CHUNK;i++){
    const p=seatHandLandingPoint(view,i);
    x+=p.x; y+=p.y;
  }
  return {x:x/HARBIN_DEAL_CHUNK,y:y/HARBIN_DEAL_CHUNK};
}

function playDealCinema(done){
  if(!G) return done?.();
  clearDealCinema();
  const overlay=document.getElementById('deal-cinema');
  if(!overlay) return done?.();
  const ep=G._epoch;
  const compact=!!(MATCH?.round>1||(G.online&&ONLINE.room?.match?.round>1));
  const dealerView=G.dealer;
  const steps=buildDealCinemaSteps(dealerView);
  const finalCounts=dealCinemaFinalCounts(steps);
  G.dealRevealCounts=[0,0,0,0];
  G.dealCinemaPhase='';
  G.dealFaceReveal=false;
  G.dealCinemaActive=true;
  G.phase='deal';
  const title=document.getElementById('deal-cinema-title');
  const caption=document.getElementById('deal-cinema-caption');
  const skip=document.getElementById('deal-cinema-skip');
  if(title) title.textContent=tr('dealCinemaTitle','嵌張宝壇配牌');
  if(caption) caption.textContent=tr('dealCinemaCaption','112枚・宝壇');
  if(skip) skip.textContent=tr('dealCinemaSkip','タップでスキップ');
  setDealCinemaSub('dealCinemaRing','金の宝壇に四方の山が築かれる…');
  if(!DEAL_WALL_STATE&&G?.dealBreak){
    initDealWallState(G.dealBreak.openerView,G.dealBreak.breakCol);
  }
  buildDealSquareWall();
  highlightDealWallBreak();
  buildDealCinemaSparks();
  overlay.classList.remove('deal-phase-treasure','deal-phase-reveal');
  overlay.classList.remove('hidden');
  overlay.setAttribute('aria-hidden','false');
  overlay.onclick=()=>{DEAL_CINEMA_SKIP=true;finishDealCinema(done,ep,compact,finalCounts);};
  requestAnimationFrame(()=>overlay.classList.add('deal-phase-open'));
  let stepIdx=0;
  const beatMs=compact?480:720;
  const openMs=compact?520:980;
  const runBeat=()=>{
    if(DEAL_CINEMA_SKIP||!G||G._epoch!==ep) return;
    if(stepIdx>=steps.length) return runTreasure();
    const step=steps[stepIdx];
    if(step.phase==='chon'&&G.dealCinemaPhase!=='chon'){
      G.dealCinemaPhase='chon';
      setDealCinemaSub('dealCinemaChon','親チョンチョン（1枚・跳・1枚）');
    }else if(step.phase==='bu'&&G.dealCinemaPhase!=='bu'){
      G.dealCinemaPhase='bu';
      setDealCinemaSub('dealCinemaBu','閑家各1枚補牌');
    }else if(!G.dealCinemaPhase){
      setDealCinemaSub('dealCinemaDeal','親から半時計回り・各6枚（二段三列）×2巡');
    }
    if(step.wallSkip){
      consumeDealWallSkip(step.wallSkip);
      stepIdx++;
      render();
      scheduleDealCinema(runBeat,compact?200:320);
      return;
    }
    const n=step.count||1;
    if(n===HARBIN_DEAL_CHUNK&&step.phase==='chunk'){
      G.dealRevealCounts[step.view]+=HARBIN_DEAL_CHUNK;
      spawnDealChunkFlight(step.view,compact);
      pulseDealSeatBeacon(step.view);
      render();
      GameSFX.play('deal');
      stepIdx++;
      scheduleDealCinema(runBeat,beatMs);
      return;
    }
    G.dealRevealCounts[step.view]+=n;
    spawnDealSingleFlight(step.view,compact);
    pulseDealSeatBeacon(step.view);
    render();
    GameSFX.play('deal');
    stepIdx++;
    scheduleDealCinema(runBeat,compact?200:320);
  };
  const runTreasure=()=>{
    if(DEAL_CINEMA_SKIP||!G||G._epoch!==ep) return;
    G.dealRevealCounts=finalCounts.slice();
    overlay.classList.add('deal-phase-treasure');
    setDealCinemaSub('dealCinemaTreasure','山端の一枚が宝として封じられる');
    render();
    GameSFX.play('kan');
    fxVibrate(compact?[8,14,8]:[10,18,12]);
    scheduleDealCinema(runReveal,compact?360:680);
  };
  const runReveal=()=>{
    if(!G||G._epoch!==ep) return;
    if(DEAL_CINEMA_SKIP){
      finishDealCinema(done,ep,compact,finalCounts);
      return;
    }
    overlay.classList.add('deal-phase-reveal');
    setDealCinemaSub('dealCinemaReveal','嵌張の光が手前を開く');
    G.dealFaceReveal=true;
    render();
    const hand=document.getElementById('human-hand');
    if(hand) hand.classList.add('deal-hand-reveal');
    GameSFX.play('reveal');
    fxVibrate(compact?[10,18,10]:[14,26,16]);
    scheduleDealCinema(()=>finishDealCinema(done,ep,compact,finalCounts),compact?620:1120);
  };
  scheduleDealCinema(runBeat,openMs);
}

function finishDealCinema(done,ep,compact,finalCounts){
  if(!G||G._epoch!==ep) return;
  clearDealCinema();
  G.dealCinemaActive=false;
  G.dealFaceReveal=false;
  G.dealRevealCounts=null;
  G.dealCinemaPhase=null;
